<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08142b">
    <title>نتائج البحث - Alislamiah-AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(145deg, #040a17 0%, #07142a 55%, #06172c 100%);
            color: #ffffff;
            font-family: Arial, "Segoe UI", Tahoma, sans-serif;
            padding: 14px;
        }
        .app {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }
        .topbar {
            width: 100%;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .top-button {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, .13);
            background: rgba(255, 255, 255, .055);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
        }
        .top-title {
            font-size: 16px;
            font-weight: 700;
            color: #08b9ef;
        }
        #results-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }
        .result-card {
            background: rgba(255, 255, 255, 0.075);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .result-card h3 {
            color: #08b9ef;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .result-card p {
            color: #bdc9df;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .result-link {
            display: inline-block;
            background: linear-gradient(145deg, #087fff, #0870e4);
            color: #fff;
            padding: 8px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .loading, .no-results {
            text-align: center;
            color: #aebbd2;
            margin-top: 50px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="topbar">
            <a href="index.html" class="top-button">🏠</a>
            <div class="top-title" id="page-title">نتائج البحث</div>
            <div style="width: 44px;"></div>
        </div>

        <div id="results-container">
            <div class="loading">جاري الاتصال بقاعدة البيانات...</div>
        </div>
    </div>

    <!-- استدعاء Firebase ومكتبة Firestore عبر ES Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // بيانات مشروعك الخاصة
        const firebaseConfig = {
          apiKey: "AIzaSyBFPwbDSeMzI5eOL8DeXNZovcr47JtlZnU",
          authDomain: "alislamiah-ai.firebaseapp.com",
          projectId: "alislamiah-ai",
          storageBucket: "alislamiah-ai.firebasestorage.app",
          messagingSenderId: "956902867596",
          appId: "1:956902867596:web:0e99d136f745655535f1a9",
          measurementId: "G-MV3BQG10T2"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const shortcut = urlParams.get('shortcut');
        const container = document.getElementById("results-container");
        const pageTitle = document.getElementById("page-title");

        async function fetchFromFirestore() {
            try {
                // ملاحظة: تأكد أن اسم المجموعة (Collection) في لوحة تحكم فايرستور هو "sites" أو قم بتغييره حسب ما تسميه
                const querySnapshot = await getDocs(collection(db, "sites"));
                let database = [];

                querySnapshot.forEach((doc) => {
                    database.push(doc.data());
                });

                processResults(database);

            } catch (error) {
                console.error("خطأ في جلب البيانات: ", error);
                container.innerHTML = `<div class="no-results">عذراً، حدث خطأ في الاتصال بقاعدة البيانات. تأكد من إعدادات القواعد (Firestore Rules).</div>`;
            }
        }

        function processResults(database) {
            if (shortcut) {
                pageTitle.innerText = "اختصار: " + shortcut.toUpperCase();
                let matched = database.filter(item => 
                    item.keywords && item.keywords.toLowerCase().includes(shortcut.toLowerCase())
                );
                
                if (matched.length > 0) {
                    displayResults(matched);
                } else {
                    container.innerHTML = `
                        <div class="result-card">
                            <h3>اختصار (${shortcut})</h3>
                            <p>تم الانتقال إلى قسم ${shortcut} بنجاح.</p>
                            <a href="index.html" class="result-link">العودة للرئيسية</a>
                        </div>
                    `;
                }
            } else if (query) {
                pageTitle.innerText = "نتائج: " + query;
                let filtered = database.filter(item => 
                    (item.title && item.title.toLowerCase().includes(query.toLowerCase())) || 
                    (item.description && item.description.toLowerCase().includes(query.toLowerCase())) ||
                    (item.keywords && item.keywords.toLowerCase().includes(query.toLowerCase()))
                );

                if (filtered.length > 0) {
                    displayResults(filtered);
                } else {
                    container.innerHTML = `
                        <div class="no-results">
                            <p>لا توجد نتائج مطابقة لـ: "<strong>${query}</strong>"</p>
                            <br>
                            <a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" class="result-link">البحث في الويب عبر جوجل</a>
                        </div>
                    `;
                }
            } else {
                displayResults(database);
            }
        }

        function displayResults(data) {
            container.innerHTML = "";
            data.forEach(site => {
                let card = document.createElement("div");
                card.className = "result-card";
                card.innerHTML = `
                    <h3>${site.title || "بدون عنوان"}</h3>
                    <p>${site.description || "لا يوجد وصف"}</p>
                    <a href="${site.url || "#"}" class="result-link" target="_blank">زيارة الموقع</a>
                `;
                container.appendChild(card);
            });
        }

        // تشغيل عملية الجلب
        fetchFromFirestore();
    </script>

</body>
</html>
