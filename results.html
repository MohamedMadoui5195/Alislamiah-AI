<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج البحث</title>
    <style>
        body {
            background: #0b1020;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .result {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
        }
        a { color: #00c3ff; text-decoration: none; }
    </style>
</head>
<body>

    <h1>نتائج البحث</h1>
    <div id="results"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const resultsDiv = document.getElementById('results');

        if(query === "News") {
            resultsDiv.innerHTML = `
                <div class="result">
                    <h3>Alarabiya.net</h3>
                    <p>أهم الأخبار العاجلة.</p>
                    <a href="https://www.alarabiya.net" target="_blank">زيارة الموقع</a>
                </div>
            `;
        } else {
            resultsDiv.innerHTML = `<p>نتائج البحث عن: ${query}</p>`;
        }
    </script>

</body>
</html>
