<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alislamiah Search Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; padding-top: 140px; background-color: #f8fafc; font-family: sans-serif; }
        #app-header { position: fixed; top: 0; left: 0; width: 100%; z-index: 50; }
    </style>
</head>
<body>

    <header id="app-header" class="bg-emerald-700 p-4 rounded-b-3xl shadow-lg">
        <div class="flex items-center justify-between mb-3 text-white">
            <button onclick="window.history.back()" class="p-2"><i class="fas fa-arrow-right text-xl"></i></button>
            <h1 class="font-bold text-lg">Alislamiah Search Engine</h1>
            <div class="w-8"></div>
        </div>
        <input type="text" id="searchInput" oninput="render()" placeholder="ابحث عن منصة أو موقع..." 
               class="w-full py-2 px-4 rounded-xl focus:outline-none shadow-inner">
    </header>

    <main id="container" class="p-4 max-w-lg mx-auto"></main>

    <script>
        const library = [
            { title: "الإسلامية نت", type: "منصة", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net/" },
            { title: "متجر الإسلامية", type: "منصة", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net.-store/" },
            { title: "فضاء الأولياء", type: "منصة", url: "https://awlya.education.dz/" },
            { title: "قناة الشيخ فركوس", type: "منصة", url: "https://www.youtube.com/@ferkous" },
            { title: "إسلام ويب", type: "موقع", url: "https://www.islamweb.net" },
            { title: "موقع الإسلام سؤال وجواب", type: "موقع", url: "https://islamqa.info" },
    
    { title: "قناة الإسلامية انجليزي", type: "منصة", url: "https://www.youtube.com/@AlislamiahEnglish" } ,

{ title: "قناة الإسلامية", type: "منصة", url: "https://youtube.com/@alislamiah5195" },

{ title: "قناة Eisen", type: "منصة", url: "https://youtube.com/@eisen-e1a?si=Pb9WtA9ImTYtOfe1" },

{ title: "الجزيرة نت", type: "منصة", url: "https://www.aljazeera.net" },

{ title: "العربية.نت", type: "منصة", url: "https://www.alarabiya.net" }


];



        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('container');
            container.innerHTML = '';

            if (query === '') return;

            const filtered = library.filter(i => i.title.toLowerCase().includes(query));

            // تحقق من وجود نتائج
            if (filtered.length === 0) return;

            // تحديد النوع بناءً على أول نتيجة مطابقة
            const type = filtered[0].type;

            if (type === "منصة") {
                // عرض المنصات فقط (صفحة داكنة)
                container.innerHTML = `<div class="bg-slate-800 p-5 rounded-3xl shadow-2xl">
                    <h2 class="text-white font-bold mb-4">المنصات (تطبيقات وقنوات)</h2>` +
                    filtered.map(i => `<div class="bg-slate-700 p-4 rounded-xl mb-2 flex justify-between items-center text-white font-bold">
                        <span>${i.title}</span>
                        <button onclick="window.location.href='${i.url}'" class="bg-blue-600 px-4 py-2 rounded-lg text-xs">فتح</button>
                    </div>`).join('') + `</div>`;
            } else {
                // عرض المواقع الدينية فقط (صفحة خضراء)
                container.innerHTML = `<div class="bg-emerald-800 p-5 rounded-3xl shadow-xl">
                    <h2 class="text-white font-bold mb-4">المواقع الدينية</h2>` +
                    filtered.map(i => `<div class="bg-white p-4 rounded-xl mb-2 flex justify-between items-center text-emerald-900 font-bold">
                        <span>${i.title}</span>
                        <button onclick="window.location.href='${i.url}'" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs">زيارة</button>
                    </div>`).join('') + `</div>`;
            }
        }
    </script>
</body>
</html>
