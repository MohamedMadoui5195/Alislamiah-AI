<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج البحث - Alislamiah AI Browser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0b1020; color: white; padding: 20px; }
        
        .header { margin-bottom: 30px; text-align: center; }
        
        #results-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .result-card h3 { color: #00c3ff; margin-bottom: 8px; }
        
        .result-card a {
            display: inline-block;
            margin-top: 10px;
            color: #fff;
            background: #0077ff;
            padding: 8px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>نتائج البحث</h1>
</div>

<div id="results-container">
    <!-- هنا ستظهر النتائج -->
</div>

<script>
    const newsData = [
        {
            title: "Alarabiya.net",
            description: "أهم الأخبار العاجلة من العالم العربي والعالم.",
            url: "https://www.alarabiya.net",
            keywords: "alarabiya.net, alarabiya net, أخبار"
        }
    ];

    function showResults() {
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const container = document.getElementById("results-container");

        if (query === "News") {
            newsData.forEach(site => {
                container.innerHTML += `
                    <div class="result-card">
                        <h3>${site.title}</h3>
                        <p>${site.description}</p>
                        <a href="${site.url}" target="_blank">زيارة الموقع</a>
                    </div>
                `;
            });
        } else {
            container.innerHTML = `<p style="text-align:center;">جاري البحث عن: ${query}...</p>`;
        }
    }

    window.onload = showResults;
</script>

</body>
</html>
