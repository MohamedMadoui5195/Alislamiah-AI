<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نتائج البحث - Alislamiah AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#ffffff;
color:#202124;
padding-top:75px;
}

.topButtons{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
background:#1565C0;
box-shadow:0 2px 10px rgba(0,0,0,.15);
z-index:9999;
}

.leftButtons{
display:flex;
gap:10px;
}

.navBtn{
display:flex;
align-items:center;
gap:6px;
background:#ffffff;
color:#1565C0;
border:none;
border-radius:25px;
padding:8px 16px;
font-size:14px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}.navBtn:hover{
background:#E3F2FD;
}

#results{
max-width:900px;
margin:20px auto;
padding:0 18px;
}

.result{
padding:18px;
margin-bottom:18px;
border:1px solid #E0E0E0;
border-radius:14px;
background:#fff;
transition:.3s;
}

.result:hover{
box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.resultHeader{
display:flex;
align-items:center;
gap:10px;
margin-bottom:8px;
}

.resultHeader img{
width:24px;
height:24px;
border-radius:50%;
}

.resultTitle{
font-size:22px;
color:#1a0dab;
text-decoration:none;
font-weight:bold;
}

.resultTitle:hover{
text-decoration:underline;
}

.resultUrl{
display:block;
margin:6px 0;
color:#188038;
font-size:14px;
text-decoration:none;
word-break:break-all;
}

.resultDesc{
color:#4d5156;
font-size:15px;
line-height:1.7;
}

</style>

</head>

<body>

<div class="topButtons">

<div class="leftButtons">

<button class="navBtn" onclick="history.back()">
⬅ رجوع
</button>

<button class="navBtn" onclick="window.location.href='index.html'">
🏠 الرئيسية
</button>

</div>

</div>

<div id="results"></div>

<script type="module" src="results.js"></script>

</body>

</html>
