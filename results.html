<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الإسلامية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background-color: #0f172a; } /* خلفية التطبيق العامة داكنة */
    </style>
</head>
<body class="pb-10">

    <!-- القسم الأول: المواقع الأساسية (أبيض وأخضر) -->
    <div class="bg-emerald-700 p-5 rounded-b-3xl mb-6 shadow-xl">
        <h2 class="text-white font-bold text-lg mb-4">المواقع الإسلامية الأساسية</h2>
        <div id="mainSites" class="space-y-3">
            <!-- المواقع الأساسية -->
            <div class="bg-white text-gray-800 p-4 rounded-2xl flex justify-between items-center shadow-sm">
                <span class="font-bold">القرآن الكريم</span>
                <button onclick="window.location.href='https://quran.com'" class="bg-emerald-600 text-white px-5 py-2 rounded-xl text-sm font-bold">زيارة</button>
            </div>
            <div class="bg-white text-gray-800 p-4 rounded-2xl flex justify-between items-center shadow-sm">
                <span class="font-bold">موقع الإسلام سؤال وجواب</span>
                <button onclick="window.location.href='https://islamqa.info'" class="bg-emerald-600 text-white px-5 py-2 rounded-xl text-sm font-bold">زيارة</button>
            </div>
        </div>
    </div>

    <!-- القسم الثاني: المنصات والمواقع الإضافية (داكن وأنيق) -->
    <div class="p-4">
        <h2 class="text-gray-400 font-bold text-sm mb-4 px-1">منصات التواصل والمواقع الأخرى</h2>
        <div id="extraSites" class="space-y-4">
            <!-- المنصات الإضافية -->
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-3xl shadow-lg">
                <h3 class="text-white font-bold text-lg mb-3">يوتيوب (الإسلامية)</h3>
                <button onclick="window.location.href='https://www.youtube.com'" class="w-full bg-blue-600 text-white py-3 rounded-2xl font-bold shadow-md">زيارة الموقع داخل التطبيق</button>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-3xl shadow-lg">
                <h3 class="text-white font-bold text-lg mb-3">فيسبوك</h3>
                <button onclick="window.location.href='https://www.facebook.com'" class="w-full bg-blue-600 text-white py-3 rounded-2xl font-bold shadow-md">زيارة الموقع داخل التطبيق</button>
            </div>
        </div>
    </div>

</body>
</html>
