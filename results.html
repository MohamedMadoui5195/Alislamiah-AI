<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08142b">
    <title>نتائج البحث - Alislamiah-AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(145deg, #040a17 0%, #07142a 55%, #06172c 100%);
            color: #ffffff;
            font-family: Arial, "Segoe UI", Tahoma, sans-serif;
            padding: 14px;
        }
        .app {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }
        /* شريط التنقل العلوي */
        .topbar {
            width: 100%;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .top-button {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, .13);
            background: rgba(255, 255, 255, .055);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
        }
        .top-title {
            font-size: 16px;
            font-weight: 700;
            color: #08b9ef;
        }
        /* حاوية النتائج */
        #results-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }
        .result-card {
            background: rgba(255, 255, 255, 0.075);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .result-card h3 {
            color: #08b9ef;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .result-card p {
            color: #bdc9df;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .result-link {
            display: inline-block;
            background: linear-gradient(145deg, #087fff, #0870e4);
            color: #fff;
            padding: 8px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .no-results {
            text-align: center;
            color: #aebbd2;
            margin-top: 50px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- شريط علوي للرجوع -->
        <div class="topbar">
            <a href="index.html" class="top-button">🏠</a>
            <div class="top-title" id="page-title">نتائج البحث</div>
            <div style="width: 44px;"></div> <!-- توازن الفراغ -->
        </div>

        <!-- مكان عرض النتائج -->
        <div id="results-container"></div>
    </div>

    <script>
        // قاعدة البيانات المحلية للمتصفح
        const database = [
            {
                title: "منصة يوتيوب (YouTube)",
                description: "تطبيق ومشاهدة الفيديوهات ومقاطع الفيديو المتنوعة.",
                url: "https://www.youtube.com",
                keywords: "youtube, يوتيوب, فيديو, فديو"
            },
            {
                title: "القرآن الكريم والتلاوات",
                description: "استماع وقراءة القرآن الكريم بأصوات نخبة من القراء.",
                url: "https://quran.com",
                keywords: "quran, قرآن, قريان, مصحف, تلاوة"
            },
            {
                title: "المساعد الذكي (Alislamiah AI)",
                description: "خدمات الذكاء الاصطناعي والإجابة على الأسئلة والمساعدة البرمجية.",
                url: "https://chatgpt.com",
                keywords: "ai, ذكاء اصطناعي, مساعد, chatgpt"
            },
            {
                title: "المفضلة والمواقع المحفوظة",
                description: "إدارة وتصفح المواقع المفضلة لديك بسرعة فائقة.",
                url: "#",
                keywords: "favorites, مفضلة"
            }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const shortcut = urlParams.get('shortcut');
        const container = document.getElementById("results-container");
        const pageTitle = document.getElementById("page-title");

        if (shortcut) {
            pageTitle.innerText = "اختصار: " + shortcut.toUpperCase();
            let matched = database.filter(item => item.keywords.includes(shortcut.toLowerCase()));
            
            if (matched.length > 0) {
                displayResults(matched);
            } else {
                container.innerHTML = `
                    <div class="result-card">
                        <h3>اختصار (${shortcut})</h3>
                        <p>تم الوصول إلى قسم ${shortcut} بنجاح عبر متصفح Alislamiah AI.</p>
                        <a href="index.html" class="result-link">العودة للرئيسية</a>
                    </div>
                `;
            }
        } else if (query) {
            pageTitle.innerText = "نتائج: " + query;
            let filtered = database.filter(item => 
                item.title.toLowerCase().includes(query.toLowerCase()) || 
                item.description.toLowerCase().includes(query.toLowerCase()) ||
                item.keywords.toLowerCase().includes(query.toLowerCase())
            );

            if (filtered.length > 0) {
                displayResults(filtered);
            } else {
                // إذا لم توجد في قاعدة البيانات، اقترح بحث خارجي أو اعرض رسالة
                container.innerHTML = `
                    <div class="no-results">
                        <p>لا توجد نتائج مطابقة لـ: "<strong>${query}</strong>"</p>
                        <br>
                        <a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" class="result-link">البحث في الويب عبر جوجل</a>
                    </div>
                `;
            }
        } else {
            displayResults(database);
        }

        function displayResults(data) {
            container.innerHTML = "";
            data.forEach(site => {
                let card = document.createElement("div");
                card.className = "result-card";
                card.innerHTML = `
                    <h3>${site.title}</h3>
                    <p>${site.description}</p>
                    <a href="${site.url}" class="result-link" target="_blank">زيارة الموقع</a>
                `;
                container.appendChild(card);
            });
        }
    </script>

</body>
</html>
