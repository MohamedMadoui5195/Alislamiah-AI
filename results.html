<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08142b">
    <title>نتائج البحث - Alislamiah-AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(145deg, #040a17 0%, #07142a 55%, #06172c 100%);
            color: #ffffff;
            font-family: Arial, "Segoe UI", Tahoma, sans-serif;
            padding-top: 75px;
            padding-bottom: 85px;
            padding-left: 14px;
            padding-right: 14px;
        }
        .app {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        /* الشريط العلوي الثابت مع شريط بحث غير قابل للكتابة يوجه للرئيسية */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(7, 20, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 1000;
        }
        .top-nav button, .search-bar-fake {
            height: 42px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.13);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }
        .top-nav button {
            width: 42px;
            font-size: 18px;
            flex-shrink: 0;
        }
        .search-bar-fake {
            flex-grow: 1;
            padding: 0 15px;
            color: #99aabf;
            font-size: 14px;
            justify-content: flex-start;
            cursor: pointer;
        }

        #results-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }
        .result-card {
            background: rgba(255, 255, 255, 0.075);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .result-card h3 {
            color: #08b9ef;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .result-card p {
            color: #bdc9df;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .result-link {
            display: inline-block;
            background: linear-gradient(145deg, #087fff, #0870e4);
            color: #fff;
            padding: 8px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .loading, .no-results {
            text-align: center;
            color: #aebbd2;
            margin-top: 50px;
            font-size: 16px;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(7, 20, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .bottom-nav button, .bottom-nav a {
            background: none;
            border: none;
            color: #aebbd2;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            transition: 0.2s;
        }
        .bottom-nav button:hover, .bottom-nav a:hover {
            color: #08b9ef;
        }
        .bottom-nav span {
            font-size: 20px;
        }

        /* نافذة الـ WebView الداخلية لعرض المواقع دون الخروج */
        .webview-modal {
            position: fixed;
            inset: 0;
            background: #07142a;
            z-index: 2000;
            display: none;
            flex-direction: column;
        }
        .webview-header {
            height: 55px;
            background: #040a17;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }
        .webview-title {
            color: #08b9ef;
            font-size: 15px;
            font-weight: bold;
        }
        .close-webview {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .webview-iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
            background: white;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-nav">
        <a href="index.html" class="top-button">🏠</a>
        <div class="search-bar-fake" onclick="location.href='index.html'">
            <span id="search-placeholder-text">ابحث في Alislamiah-AI...</span>
        </div>
        <button class="top-button" onclick="location.href='index.html'">🔍</button>
    </div>

    <div class="app">
        <div id="results-container">
            <div class="loading">جاري جلب النتائج...</div>
        </div>
    </div>

    <!-- الشريط السفلي -->
    <div class="bottom-nav">
        <a href="index.html">
            <span>🏠</span>
            الرئيسية
        </a>
        <button onclick="location.href='results.html?shortcut=quran'">
            <span>📖</span>
            القرآن
        </button>
        <button onclick="location.href='results.html?shortcut=ai'">
            <span>🤖</span>
            الذكاء الاصطناعي
        </button>
        <button onclick="location.href='results.html?shortcut=favorites'">
            <span>⭐</span>
            المفضلة
        </button>
    </div>

    <!-- نافذة الـ WebView -->
    <div id="webviewModal" class="webview-modal">
        <div class="webview-header">
            <div class="webview-title" id="webviewTitle">Alislamiah-AI Browser</div>
            <button class="close-webview" onclick="closeWebView()">إغلاق والرجوع</button>
        </div>
        <iframe id="webviewIframe" class="webview-iframe" src=""></iframe>
    </div>

    <!-- كود جلب البيانات الأصلي الذي كان يعمل معك بدقة -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBFPwbDSeMzI5eOL8DeXNZovcr47JtlZnU",
          authDomain: "alislamiah-ai.firebaseapp.com",
          projectId: "alislamiah-ai",
          storageBucket: "alislamiah-ai.firebasestorage.app",
          messagingSenderId: "956902867596",
          appId: "1:956902867596:web:0e99d136f745655535f1a9",
          measurementId: "G-MV3BQG10T2"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const shortcut = urlParams.get('shortcut');
        const container = document.getElementById("results-container");

        if (query) {
            document.getElementById("search-placeholder-text").innerText = query;
        }

        async function fetchFromFirestore() {
            try {
                const querySnapshot = await getDocs(collection(db, "sites"));
                let database = [];

                querySnapshot.forEach((doc) => {
                    database.push(doc.data());
                });

                processResults(database);

            } catch (error) {
                console.error("خطأ في جلب البيانات: ", error);
                container.innerHTML = `<div class="no-results">عذراً، حدث خطأ في الاتصال بقاعدة البيانات.</div>`;
            }
        }

        function processResults(database) {
            if (shortcut) {
                let matched = database.filter(item => 
                    item.keywords && item.keywords.toLowerCase().includes(shortcut.toLowerCase())
                );
                
                if (matched.length > 0) {
                    displayResults(matched);
                } else {
                    container.innerHTML = `
                        <div class="result-card">
                            <h3>اختصار (${shortcut})</h3>
                            <p>تم الانتقال إلى قسم ${shortcut} بنجاح عبر منصة الإسلامية.</p>
                            <a href="index.html" class="result-link">العودة للرئيسية</a>
                        </div>
                    `;
                }
            } else if (query) {
                let filtered = database.filter(item => 
                    (item.title && item.title.toLowerCase().includes(query.toLowerCase())) || 
                    (item.description && item.description.toLowerCase().includes(query.toLowerCase())) ||
                    (item.keywords && item.keywords.toLowerCase().includes(query.toLowerCase()))
                );

                if (filtered.length > 0) {
                    displayResults(filtered);
                } else {
                    container.innerHTML = `
                        <div class="no-results">
                            <p>لا توجد نتائج مطابقة لـ: "<strong>${query}</strong>"</p>
                            <br>
                            <a href="index.html" class="result-link">العودة للرئيسية للبحث من جديد</a>
                        </div>
                    `;
                }
            } else {
                displayResults(database);
            }
        }

        function displayResults(data) {
            container.innerHTML = "";
            data.forEach(site => {
                let card = document.createElement("div");
                card.className = "result-card";
                card.innerHTML = `
                    <h3>${site.title || "بدون عنوان"}</h3>
                    <p>${site.description || "لا يوجد وصف"}</p>
                    <button class="result-link" onclick="openWebView('${site.url || "#"}', '${escapeHtml(site.title || "الموقع")}')">زيارة الموقع داخل الإسلامية</button>
                `;
                container.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return String(text).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        fetchFromFirestore();
    </script>

    <!-- وظائف الـ WebView -->
    <script>
        function openWebView(url, title) {
            const modal = document.getElementById("webviewModal");
            const iframe = document.getElementById("webviewIframe");
            const titleElem = document.getElementById("webviewTitle");

            titleElem.innerText = "Alislamiah - " + title;
            iframe.src = url;
            modal.style.display = "flex";
            document.body.style.overflow = "hidden";
        }

        function closeWebView() {
            const modal = document.getElementById("webviewModal");
            const iframe = document.getElementById("webviewIframe");

            iframe.src = "";
            modal.style.display = "none";
            document.body.style.overflow = "";
        }
    </script>

</body>
</html>
