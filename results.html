<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الإسلامية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background-color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <!-- شريط البحث والتنقل الثابت -->
    <div class="sticky top-0 z-50 bg-emerald-700 p-4 rounded-b-3xl shadow-xl">
        <div class="flex items-center justify-between mb-3 text-white">
            <button onclick="window.history.back()" class="p-2"><i class="fas fa-arrow-right text-xl"></i></button>
            <h1 class="font-bold text-lg">دليل الإسلامية</h1>
            <div class="w-8"></div>
        </div>
        
        <!-- حقل البحث -->
        <input type="text" id="searchInput" oninput="filterContent()" placeholder="ابحث هنا..." 
               class="w-full py-2.5 px-4 rounded-xl shadow-inner focus:outline-none mb-3">

        <!-- أزرار التنقل (التصنيفات) -->
        <div class="flex gap-2 overflow-x-auto hide-scrollbar">
            <button onclick="setCategory('الكل')" class="bg-white text-emerald-800 px-4 py-1 rounded-full text-sm font-bold">الكل</button>
            <button onclick="setCategory('أساسية')" class="bg-emerald-900 text-white px-4 py-1 rounded-full text-sm">أساسية</button>
            <button onclick="setCategory('منصات')" class="bg-emerald-900 text-white px-4 py-1 rounded-full text-sm">منصات</button>
        </div>
    </div>

    <!-- حاوية النتائج -->
    <main id="container" class="p-4 space-y-6"></main>

    <script>
        const allItems = [
            { title: "فضاء الأولياء", url: "https://example.com/parents", type: "أساسية", theme: "light" },
            { title: "موقع الإسلامية نت", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net/", type: "أساسية", theme: "light" },
            { title: "متجر الإسلامية", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net-store", type: "أساسية", theme: "light" },
            { title: "يوتيوب (قنوات دينية)", url: "https://www.youtube.com", type: "منصات", theme: "dark" },
            { title: "منصة فايربيز", url: "https://console.firebase.google.com", type: "منصات", theme: "dark" }
        ];

        let currentCategory = 'الكل';

        function setCategory(cat) {
            currentCategory = cat;
            filterContent();
        }

        function filterContent() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('container');
            container.innerHTML = '';

            const filtered = allItems.filter(i => 
                (currentCategory === 'الكل' || i.type === currentCategory) && 
                i.title.toLowerCase().includes(searchText)
            );

            // عرض القسم الأساسي
            const main = filtered.filter(i => i.theme === 'light');
            if(main.length > 0) {
                let html = `<div class="bg-emerald-800 p-4 rounded-3xl"><h2 class="text-white mb-3 font-bold text-sm">القسم الأساسي</h2>`;
                main.forEach(i => html += `<div class="bg-white p-4 rounded-2xl flex justify-between items-center mb-2 shadow-sm">
                    <span class="font-bold text-gray-800">${i.title}</span>
                    <a href="${i.url}" target="_self" class="bg-emerald-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold">زيارة</a>
                </div>`);
                container.innerHTML += html + `</div>`;
            }

            // عرض القسم الداكن
            const dark = filtered.filter(i => i.theme === 'dark');
            if(dark.length > 0) {
                let html = `<h2 class="text-gray-400 font-bold px-1 text-sm">منصات ومواقع أخرى</h2>`;
                dark.forEach(i => html += `<div class="bg-slate-800 border border-slate-700 p-4 rounded-3xl mb-3 shadow-lg">
                    <h3 class="text-white font-bold mb-3">${i.title}</h3>
                    <a href="${i.url}" target="_self" class="block text-center w-full bg-blue-600 text-white py-2 rounded-xl font-bold">زيارة الموقع</a>
                </div>`);
                container.innerHTML += html;
            }
        }

        filterContent();
    </script>
</body>
</html>
