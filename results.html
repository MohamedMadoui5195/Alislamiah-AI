<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نتائج البحث | Alislamiah AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#ffffff;
color:#202124;
padding-top:65px;
}

.topBar{
position:fixed;
top:0;
left:0;
right:0;
height:65px;
background:#ffffff;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 16px;
border-bottom:1px solid #e5e5e5;
z-index:9999;
}

.logo{
font-size:24px;
font-weight:bold;
color:#1565C0;
}

.buttons{
display:flex;
gap:10px;
}

.btn{
background:#1565C0;
color:#fff;
border:none;
border-radius:30px;
padding:8px 16px;
font-size:14px;
cursor:pointer;
transition:.25s;
}

.btn:hover{
background:#0D47A1;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}.result{
background:#fff;
border:1px solid #e5e5e5;
border-radius:14px;
padding:18px;
margin-bottom:18px;
transition:.25s;
}

.result:hover{
box-shadow:0 4px 14px rgba(0,0,0,.10);
}

.resultTop{
display:flex;
align-items:center;
gap:12px;
margin-bottom:10px;
}

.resultIcon{
width:42px;
height:42px;
border-radius:10px;
object-fit:cover;
background:#f1f3f4;
}

.resultTitle{
font-size:22px;
font-weight:bold;
color:#1a0dab;
text-decoration:none;
}

.resultTitle:hover{
text-decoration:underline;
}

.resultUrl{
display:block;
margin-top:5px;
font-size:14px;
color:#188038;
text-decoration:none;
word-break:break-word;
}

.resultDesc{
margin-top:10px;
font-size:15px;
line-height:1.8;
color:#4d5156;
}

</style>

</head>

<body>

<div class="topBar">

<div class="logo">
Alislamiah AI
</div>

<div class="buttons">

<button class="btn" onclick="history.back()">
⬅ رجوع
</button>

<button class="btn" onclick="window.location.href='index.html'">
🏠 الرئيسية
</button>

</div>

</div>

<div class="container">

<div id="results"></div>

</div>

<script type="module" src="results.js"></script>

</body>
</html>
