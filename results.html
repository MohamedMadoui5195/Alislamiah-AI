<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج البحث الموحدة</title>
</head>
<body style="margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#202124;">

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const query = new URLSearchParams(window.location.search).get('q');
        const engine = localStorage.getItem("searchEngine") || "Alislamiah";
        if (!query) return;

        // تحديد رابط الـ iframe لجميع المحركات (بما فيها محركك الإسلامية) ليعملوا بنفس الطريقة تماماً
        let searchUrl = "";
        if (engine === "Google") {
            searchUrl = `https://www.google.com/search?igu=1&q=${encodeURIComponent(query)}`;
        } else if (engine === "Microsoft Bing") {
            searchUrl = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
        } else {
            // محركك الإسلامية سيتم عرضه داخل الـ iframe تحت الشريط الثابت تماماً مثل جوجل وبينج!
            searchUrl = `https://mohamedmadoui5195.github.io/Alislamiah/results_full.html?q=${encodeURIComponent(query)}`;
        }

        document.documentElement.style.margin = "0";
        document.documentElement.style.padding = "0";
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";

        document.body.style.margin = "0";
        document.body.style.padding = "0";
        document.body.style.width = "100%";
        document.body.style.height = "100%";
        document.body.style.overflow = "hidden";

        // بناء الواجهة الموحدة للجميع (شريط علوي ثابت + iframe في المساحة تحتها)
        document.body.innerHTML = `
            <div style="display:flex; flex-direction:column; width:100vw; height:100vh; overflow:hidden; margin:0; padding:0; box-sizing:border-box;">
                <!-- الشريط العلوي الموحد والثابت في أعلى الشاشة لجميع المحركات -->
                <div style="display:flex; align-items:center; gap:12px; padding:12px 18px; background:#202124; width:100%; flex-shrink:0; box-sizing:border-box; z-index:999999; border-bottom:1px solid #3c4043; box-shadow: 0 3px 8px rgba(0,0,0,0.4); direction:ltr;">
                    <!-- زر العودة -->
                    <button onclick="history.back()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:6px; display:flex; align-items:center; justify-content:center;" title="العودة">⬅️</button>
                    <!-- زر الرئيسية -->
                    <button onclick="window.location.href='index.html'" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:6px; display:flex; align-items:center; justify-content:center;" title="الرئيسية">🏠</button>
                    <!-- شريط البحث الواسع -->
                    <form action="results.html" method="GET" style="flex:1; display:flex; align-items:center; background:#3c4043; border-radius:28px; padding:6px 16px; margin:0; border: 1px solid #5f6368;">
                        <input type="text" name="q" value="${query}" style="flex:1; border:none; background:transparent; color:#fff; outline:none; font-size:16px; direction:rtl; padding:0 6px;" required>
                        <button type="submit" style="background:none; border:none; color:#8ab4f8; cursor:pointer; font-size:16px; padding:0; display:flex; align-items:center;">🔍</button>
                    </form>
                </div>
                <!-- مساحة عرض المحرك والنتائج تبدأ من أسفله تماماً وتغطي باقي الشاشة -->
                <div style="flex:1; width:100%; height:100%; overflow:hidden;">
                    <iframe src="${searchUrl}" style="width:100%; height:100%; border:none; display:block;"></iframe>
                </div>
            </div>
        `;
    });
</script>

</body>
</html>
