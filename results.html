<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج البحث</title>
    <style>
        body {
            background: #0b1020;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .result-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
        }
        .result-card h3 {
            color: #00c3ff;
            margin-bottom: 8px;
        }
        .result-card p {
            color: #c7d7ff;
            margin-bottom: 10px;
        }
        a { 
            color: #fff; 
            background: #0077ff; 
            padding: 8px 15px; 
            border-radius: 8px; 
            text-decoration: none; 
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>نتائج البحث</h1>
    <div id="results-container"></div>

    <script>
        // تعريف بيانات المواقع الإخبارية
        const newsData = [
            {
                title: "Alarabiya.net",
                description: "أهم الأخبار العاجلة من العالم العربي والعالم",
                url: "https://www.alarabiya.net",
                keywords: "alarabiya.net, alarabiya net, أخبار"
            }
        ];

        // منطق عرض النتائج
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');

        if (query === "News") {
            // كود عرض النتائج الخاصة بالأخبار
            displayNewsResults(newsData);
        } else {
            let container = document.getElementById("results-container");
            container.innerHTML = `<p>نتائج البحث عن: ${query}</p>`;
        }

        function displayNewsResults(data) {
            let container = document.getElementById("results-container"); // تأكد أن هذا هو معرف الحاوية عندك
            container.innerHTML = ""; // مسح النتائج القديمة

            data.forEach(site => {
                let card = document.createElement("div");
                card.className = "result-card"; // تأكد من وجود هذا التنسيق في CSS
                card.innerHTML = `
                    <h3>${site.title}</h3>
                    <p>${site.description}</p>
                    <a href="${site.url}" target="_blank">زيارة الموقع</a>
                `;
                container.appendChild(card);
            });
        }
    </script>

</body>
</html>
