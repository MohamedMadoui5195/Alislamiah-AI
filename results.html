<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج البحث - Alislamiah Search Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; padding-top: 130px; background-color: #060c16; color: #fff; font-family: sans-serif; }
        #app-header { position: fixed; top: 0; left: 0; width: 100%; z-index: 50; }
        .result-card { background: #0a1525; border: 1px solid #17283e; transition: .2s; }
        .result-card:hover { border-color: #214f8f; background: #0f1e31; }

        /* =====================================================
           تنسيق صندوق إجابة الذكاء الاصطناعي (الوضع الداكن)
        ===================================================== */
        .ai-answer-box {
            background: linear-gradient(145deg, rgba(8, 127, 255, 0.12), rgba(8, 185, 239, 0.05));
            border: 1px solid rgba(8, 127, 255, 0.3);
            border-radius: 20px;
            padding: 20px 22px;
            margin-bottom: 16px;
            direction: rtl;
            text-align: right;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.4s ease-in-out;
        }

        .ai-answer-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: 700;
            color: #08b9ef;
            font-size: 16px;
        }

        .ai-answer-header span {
            background: #087fff;
            color: #ffffff;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .ai-answer-content {
            color: #e2e8f0;
            font-size: 14.5px;
            line-height: 1.8;
        }

        .ai-loading {
            color: #94a3b8;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header id="app-header" class="bg-[#081321] border-b border-[#17283e] p-4 shadow-lg">
        <div class="flex items-center justify-between mb-3 text-white max-w-2xl mx-auto">
            <button onclick="window.history.back()" class="p-2"><i class="fas fa-arrow-right text-xl"></i></button>
            <h1 class="font-bold text-lg">Alislamiah Search Engine</h1>
            <div class="w-8"></div>
        </div>
        <div class="max-w-2xl mx-auto">
            <input type="text" id="searchInput" oninput="render()" placeholder="ابحث عن منصة أو موقع..." 
                   class="w-full py-3 px-4 rounded-xl bg-white text-slate-900 focus:outline-none shadow-inner text-sm">
        </div>
    </header>

    <main id="container" class="p-4 max-w-2xl mx-auto space-y-3">
        <!-- صندوق رد الذكاء الاصطناعي (يظهر تلقائياً عند البحث) -->
        <div id="aiAnswerContainer" class="ai-answer-box" style="display: none;">
            <div class="ai-answer-header">
                <i class="fas fa-robot"></i> رد الذكاء الاصطناعي
                <span>Alislamiah AI</span>
            </div>
            <div id="aiAnswerText" class="ai-answer-content ai-loading">
                جاري توليد الإجابة...
            </div>
        </div>

        <!-- نتائج البحث ستظهر هنا -->
        <div id="resultsList" class="space-y-3"></div>
    </main>

    <script>
        // قاعدة البيانات الشاملة للمواقع والمنصات
        const library = [
            { title: "الإسلامية نت", type: "منصة", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net/", desc: "المنصة الرسمية لشبكة الإسلامية " },
            { title: "متجر الإسلامية", type: "منصة", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net.-store/", desc: "متجر تطبيقات الإسلامية " },
            { title: "قناة الشيخ أحمد النفيس", type: "منصة", url: "https://youtube.com/@ahmad_alnufais?si=_u9f-SVVxpAOmy0D", desc: "القناة الرسمية للشيخ أحمد النفيس تلاوات عطرة وخاشعة." },
            { title: "فضاء الأولياء", type: "منصة", url: "https://awlya.education.dz/", desc: "فضاء أولياء التلاميذ للتعرف على نتائج ومستويات الأبناء الدراسية في الجزائر." },
            { title: "قناة الشيخ فركوس", type: "منصة", url: "https://youtube.com/channel/UC1UuPsSzEOhxUamwLt86IiQ?si=tUGE9H6rfKrbD3F3", desc: "القناة الرسمية لفضيلة الشيخ الدكتور محمد علي فركوس للخطب والدروس العلمية." },
            { title: "إسلام ويب", type: "موقع", url: "https://www.islamweb.net", desc: "موقع إسلامي شامل يقدم فتاوى، استشارات، ومقالات دعوية وعلمية موثوقة." },
            { title: "موقع الإسلام سؤال وجواب", type: "موقع", url: "https://islamqa.info", desc: "موقع إسلامي يشرف عليه الشيخ محمد صالح المنجد للإجابة عن الأسئلة الشرعية." },
            { title: "قناة الإسلامية انجليزي", type: "منصة", url: "https://www.youtube.com/@AlislamiahEnglish", desc: "القناة المخصصة للمحتوى الإسلامي باللغة الإنجليزية." },
            { title: "قناة الإسلامية", type: "منصة", url: "https://youtube.com/@alislamiah5195", desc: "القناة الرئيسية لمنصة الإسلامية على يوتيوب." },
            { title: "قناة Eisen", type: "منصة", url: "https://youtube.com/@eisen-e1a?si=Pb9WtA9ImTYtOfe1", desc: "قناة تقنية وتوعوية مميزة." },
            { title: "الجزيرة نت", type: "منصة", url: "https://www.aljazeera.net", desc: "شبكة الجزيرة الإخبارية لمتابعة آخر الأحداث والأنباء العربية والعالمية." },
            { title: "العربية.نت", type: "منصة", url: "https://www.alarabiya.net", desc: "بوابة إخبارية عربية شاملة لآخر الأخبار السياسية والاقتصادية والرياضية." },
            { title: "قناة الشيخ العفاسي", type: "منصة", url: "https://youtube.com/@alafasy?si=jBz3cGMAkjx3jMQI", desc: "القناة الرسمية للقارئ والمنشد الشيخ مشاري بن راشد العفاسي." },
            { title: "Mr bahmed Instagram", type: "منصة", url: "https://www.instagram.com/mr_bahmed", desc: "الحساب الرسمي على إنستغرام." },
            { title: "قناة Chiraz activities", type: "منصة", url: "https://youtube.com/@chirazactivities?si=g8w4AvfEisOYA7Ha", desc: "قناة تعليمية وأنشطة متنوعة." },
            { title: "قناة Bahmed Hadj Brahim", type: "منصة", url: "https://youtube.com/@bahmedhadjbrahim?si=kJTUNbw6r2w_9smW", desc: "قناة الأستاذ باحمد حاج إبراهيم." },
            { title: "Chiraz activities Instagram", type: "منصة", url: "https://www.instagram.com/chirazactivities?igsi=MTAyZWN2YTZtcGwwMQ==", desc: "صفحة إنستغرام لـ Chiraz activities." },
            { title: "Mr Bahmed موقع", type: "منصة", url: "https://mrbahmed.com", desc: "الموقع الإلكتروني الرسمي لـ Mr Bahmed." },
            { title: "Chiraz Activities", type: "منصة", url: "https://Chirazactivities.com", desc: "الموقع الإلكتروني الرسمي." },
            { title: "Firebase", type: "منصة", url: "https://firebase.google.com", desc: "منصة تطوير تطبيقات الويب والهواتف من جوجل." },
            { title: "MIT App Inventor", type: "منصة", url: "https://appinventor.mit.edu", desc: "منصة مرئية لإنشاء تطبيقات أندرويد بسهولة وبدون تعقيد." },
            { title: "dz.exams", type: "منصة", url: "https://www.dzexams.com", desc: "موقع الفرائض والاختبارات والامتحانات التعليمية في الجزائر." },
            { title: "CNAS", type: "منصة", url: "https://cnas.dz/", desc: "الصندوق الوطني للتأمينات الاجتماعية للعمال الأجناء بالجزائر." },
            { title: "GitHub", type: "منصة", url: "https://github.com", desc: "منصة استضافة المشاريع البرمجية وتطوير البرمجيات مفتوحة المصدر." },
            { title: "SNTF", type: "منصة", url: "https://sntf.dz", desc: "الشركة الوطنية للنقل بالسكك الحديدية في الجزائر." },
            { title: "Alafasy", type: "منصة", url: "https://alfan.link/Alafasy", desc: "روابط منصات ومنتجات الشيخ مشاري العفاسي." },
            { title: "قناة إسلام صبحي", type: "منصة", url: "https://youtube.com/@islam_sobhi?si=rXne1e-ujW_VwUPT", desc: "تلاوات عطرة بصوت القارئ إسلام صبحي." },
            { title: "قناة Quran dz", type: "منصة", url: "https://youtube.com/@dz-quran?si=--qmv3vg-rfU_jls", desc: "قناة لتعلم وتلاوة القرآن الكريم." },
            { title: "Instagram خالد سليماني", type: "منصة", url: "https://www.instagram.com/khaled_juridiq?igsi=cTUwcjcxcm12MWht", desc: "الحساب الرسمي." },
            { title: "Ali Ben maghar Instagram", type: "منصة", url: "https://www.instagram.com/ali_bnm03?igsi=MW0wbXJsbXQ0b3VrMw==", desc: "الحساب الرسمي." },
            { title: "Etusa Instagram", type: "منصة", url: "https://www.instagram.com/etusa.dz?igsi=dWtkbDN3dmZwZGJw", desc: "صفحة إنستغرام لمؤسسة النقل الحضري والشبه حضري للجزائر." },
            { title: "Etusa", type: "منصة", url: "https://www.etusa.dz", desc: "الموقع الرسمي لمؤسسة النقل الحضري." },
            { title: "دار المعرفة", type: "منصة", url: "https://easyquran.com", desc: "موقع سهل القرآن الكريم ومصادر دار المعرفة." },
            { title: "Alislamiah Instagram", type: "منصة", url: "https://www.instagram.com/alislamiah5195?igsi=MWprbTEzdWQ2bzh0bQ==", desc: "الحساب الرسمي لمنصة الإسلامية على إنستغرام." },
            { title: "قناة Mohamed Anes kalache", type: "منصة", url: "https://youtube.com/@anes__kal?si=X3xcqwW62W2oI8fY", desc: "القناة الرسمية." },
            { title: "Ma maitresse de français", type: "منصة", url: "https://mamaitressedefrançais.com", desc: "موقع تعليم اللغة الفرنسية." },
            { title: "قناة Ma maîtresse de français", type: "منصة", url: "https://youtube.com/@mamaitressedefrancais3429?si=KZGBYcwi8ZaOLU-c", desc: "قناة تعليم اللغة الفرنسية." },
            { title: "قناة Ma maîtresse de français BEM ET Lycée", type: "منصة", url: "https://youtube.com/@mamaitressedefrancais4amlycee?si=J-Pd8iC8rxtqUIkK", desc: "دروس تخص شهادة التعليم المتوسط والثانوي في الفرنسية." },
            { title: "قناة الأستاذ حمياني للفيزياء", type: "منصة", url: "https://youtube.com/@hamianiphysique?si=KILJ1imYO_j1ppYA", desc: "دروس في مادة الفيزياء للأستاذ حمياني." },
            { title: "AI Assistant", type: "منصة", url: "https://mohamedmadoui5195.github.io/Alislamiah-AI/chat.html", desc: "مساعد الإسلامية الذكي للإجابة عن الأسئلة والاستفسارات عبر الذكاء الاصطناعي." }
        ];

        // دالة جلب الأيقونة الحقيقية تلقائياً من الرابط
        function getFavicon(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
            } catch (e) {
                return 'https://www.google.com/favicon.ico';
            }
        }

        // قراءة الاستعلام (Query) من الرابط عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            if (query) {
                document.getElementById('searchInput').value = query;
            }
            render();
        });

        // دالة توليد رد الذكاء الاصطناعي مع الأوصاف الكاملة للمواقع
        function updateAiAnswer(query) {
            const aiContainer = document.getElementById('aiAnswerContainer');
            const aiText = document.getElementById('aiAnswerText');

            if (!query || query.trim() === '') {
                aiContainer.style.display = 'none';
                return;
            }

            aiContainer.style.display = 'block';
            aiText.classList.add('ai-loading');
            aiText.innerHTML = 'جاري توليد الإجابة...';

            setTimeout(() => {
                aiText.classList.remove('ai-loading');

                if (query.includes('الإسلامية') || query.includes('alislamiah')) {
                    aiText.innerHTML = `تعتبر منصة <strong>الإسلامية</strong> شبكة رقمية متكاملة تقدم خدمات متنوعة تشمل المنصات التعليمية، المتاجر الرقمية، ومساعد الذكاء الاصطناعي لتسهيل الوصول للمحتوى الهادف.`;
                } else if (query.includes('العربية')) {
                    aiText.innerHTML = `موقع <strong>العربية.نت</strong> هو بوابة إخبارية رائدة لتغطية الأخبار العربية، العالمية، السياسية، والرياضية لحظة بلحظة.`;
                } else if (query.includes('الجزائر') || query.includes('أولياء')) {
                    aiText.innerHTML = `يمكنك متابعة النتائج والمستويات الدراسية عبر المنصات الرسمية المعتمدة في الجزائر مثل <strong>فضاء الأولياء</strong> وواقع منصات الدعم التعليمي.`;
                } else if (query.includes('أحمد النفيس') || query.includes('النفيس') || query.includes('ahmad alnufais')) {
                    aiText.innerHTML = `تعتبر <strong>قناة الشيخ أحمد النفيس</strong> منارة قرآنية مباركة تقدم تلاوات عطرة، خاشعة، ومؤثرة لآي الذكر الحكيم بصوت الشيخ أحمد النفيس.`;
                } else if (query.includes('فركوس')) {
                    aiText.innerHTML = `<strong>قناة الشيخ فركوس</strong> هي القناة الرسمية لفضيلة الشيخ الدكتور محمد علي فركوس، وتضم العديد من الخطب والدروس العلمية القيمة.`;
                } else if (query.includes('إسلام ويب')) {
                    aiText.innerHTML = `موقع <strong>إسلام ويب</strong> هو موقع إسلامي شامل يقدم فتاوى دقيقة، استشارات متنوعة، ومقالات دعوية وعلمية موثوقة.`;
                } else if (query.includes('السؤال وجواب') || query.includes('islamqa')) {
                    aiText.innerHTML = `موقع <strong>الإسلام سؤال وجواب</strong> يشرف عليه الشيخ محمد صالح المنجد للإجابة عن الأسئلة الشرعية والفقهية بدقة وتأصيل.`;
                } else if (query.includes('الجزيرة')) {
                    aiText.innerHTML = `شبكة <strong>الجزيرة نت</strong> الإخبارية توفر لك متابعة شاملة ومستمرة لآخر الأحداث والأنباء العربية والعالمية.`;
                } else if (query.includes('العفاسي')) {
                    aiText.innerHTML = `قناة وصَفحات القارئ والمنشد الشيخ <strong>مشاري بن راشد العفاسي</strong> تقدم أروع التلاوات والأناشيد الإسلامية المميزة.`;
                } else if (query.includes('إسلام صبحي')) {
                    aiText.innerHTML = `قناة القارئ <strong>إسلام صبحي</strong> تعرض تلاوات عطرة وندية بصوته الخاشع والمميز للقرآن الكريم.`;
                } else if (query.includes('dzexams') || query.includes('الامتحانات')) {
                    aiText.innerHTML = `موقع <strong>dz.exams</strong> يعتبر مرجعاً أساسياً للفرائض، الاختبارات، والامتحانات التعليمية بمختلف أطوارها في الجزائر.`;
                } else if (query.includes('cnas')) {
                    aiText.innerHTML = `منصة <strong>CNAS</strong> تتبع الصندوق الوطني للتأمينات الاجتماعية للعمال الأجناء بالجزائر لتسهيل الخدمات الإدارية.`;
                } else if (query.includes('sntf')) {
                    aiText.innerHTML = `موقع <strong>SNTF</strong> يخص الشركة الوطنية للنقل بالسكك الحديدية في الجزائر لمتابعة المواقيت والرحلات.`;
                } else if (query.includes('etusa')) {
                    aiText.innerHTML = `موقع ومؤسسة <strong>Etusa</strong> مؤشّرة للنقل الحضري والشبه حضري لتقديم خدمات التنقل في الجزائر.`;
                } else {
                    aiText.innerHTML = `بناءً على بحثك عن "<strong>${query}</strong>"، يمكنك تصفح النتائج أدناه للوصول المباشر للمواقع والمنصات ذات الصلة، أو الانتقال إلى قسم <strong>AI Assistant</strong> لطرح استفسارات تفصيلية أكثر.`;
                }
            }, 700);
        }

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';

            // تحديث رد الذكاء الاصطناعي بناءً على البحث
            updateAiAnswer(query);

            if (query === '') {
                resultsList.innerHTML = `<div class="text-center text-slate-400 py-10">الرجاء إدخال كلمة للبحث...</div>`;
                return;
            }

            // تصفية النتائج بناءً على العنوان أو الوصف
            const filtered = library.filter(i => i.title.toLowerCase().includes(query) || (i.desc && i.desc.toLowerCase().includes(query)));

            if (filtered.length === 0) {
                resultsList.innerHTML = `<div class="text-center text-slate-400 py-10">لا توجد نتائج مطابقة لـ "${query}"</div>`;
                return;
            }

            // عرض النتائج بتصميم احترافي مع الأيقونة الحقيقية للموقع أمام العنوان والوصف
            resultsList.innerHTML = filtered.map(i => {
                const iconUrl = getFavicon(i.url);
                return `
                    <div class="result-card p-4 rounded-2xl cursor-pointer flex items-start gap-3.5" onclick="window.location.href='${i.url}'">
                        <div class="w-10 h-10 rounded-xl bg-[#12243b] flex items-center justify-center shrink-0 overflow-hidden border border-[#1f3555]">
                            <img src="${iconUrl}" alt="" class="w-6 h-6 object-contain" onerror="this.src='https://www.google.com/favicon.ico'">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-[11px] text-[#71829a] truncate mb-0.5" dir="ltr">${i.url}</div>
                            <div class="text-[16px] text-[#6fa4ed] font-semibold mb-1">${i.title}</div>
                            <div class="text-[13px] text-[#b9c8e2] leading-relaxed">${i.desc || 'منصة وموقع إلكتروني موثوق ضمن شبكة الإسلامية.'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
