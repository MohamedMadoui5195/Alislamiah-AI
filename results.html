<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الإسلامية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* أجبر الصفحة على أخذ كامل الطول */
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* الشريط الثابت (Header) */
        #main-header { flex-shrink: 0; z-index: 10; }
        
        /* منطقة المحتوى تبدأ من تحت الشريط مباشرة */
        #content-wrapper { flex-grow: 1; overflow: hidden; position: relative; }
        
        /* iframe يأخذ كل المساحة المتوفرة تحت الشريط */
        #site-frame { width: 100%; height: 100%; border: none; display: none; }
        #list-container { width: 100%; height: 100%; overflow-y: auto; }
    </style>
</head>
<body class="bg-slate-900">

    <!-- شريط التنقل (يأخذ مساحته ولا يغطي المحتوى) -->
    <header id="main-header" class="bg-emerald-700 p-4 rounded-b-3xl shadow-lg">
        <div class="flex items-center justify-between mb-3 text-white">
            <button onclick="goBack()" class="p-2"><i class="fas fa-arrow-right text-xl"></i></button>
            <h1 class="font-bold text-lg">دليل الإسلامية</h1>
            <div class="w-8"></div>
        </div>
        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ابحث هنا..." 
               class="w-full py-2 px-4 rounded-xl shadow-inner focus:outline-none text-gray-900">
    </header>

    <!-- منطقة العرض (تبدأ تحت الشريط مباشرة) -->
    <div id="content-wrapper">
        <main id="list-container" class="p-4 space-y-4"></main>
        <iframe id="site-frame"></iframe>
    </div>

    <script>
        const data = [
            { title: "فضاء الأولياء", type: "أساسية", theme: "light", url: "https://awlya.education.gov.dz/" },
            { title: "موقع الإسلامية نت", type: "أساسية", theme: "light", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net/" },
            { title: "قناة القرآن الكريم", type: "منصات", theme: "dark", url: "https://www.youtube.com/@quran_kariem" }
        ];

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            
            const filtered = data.filter(i => i.title.toLowerCase().includes(query));

            // عرض النتائج بناءً على الفلترة
            filtered.forEach(i => {
                container.innerHTML += `
                    <div class="${i.theme === 'light' ? 'bg-white' : 'bg-slate-800'} p-4 rounded-2xl flex justify-between items-center shadow-md">
                        <span class="${i.theme === 'light' ? 'text-gray-900' : 'text-white'} font-bold">${i.title}</span>
                        <button onclick="openSite('${i.url}')" class="bg-blue-600 text-white px-4 py-1 rounded-lg text-sm font-bold">زيارة</button>
                    </div>
                `;
            });
        }

        function openSite(url) {
            document.getElementById('list-container').style.display = 'none';
            const frame = document.getElementById('site-frame');
            frame.src = url;
            frame.style.display = 'block';
        }

        function goBack() {
            const frame = document.getElementById('site-frame');
            if (frame.style.display === 'block') {
                frame.style.display = 'none';
                frame.src = '';
                document.getElementById('list-container').style.display = 'block';
            } else {
                window.history.back();
            }
        }

        applyFilters();
    </script>
</body>
</html>
