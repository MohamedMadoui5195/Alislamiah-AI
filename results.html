<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الإسلامية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background-color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <!-- شريط البحث والتنقل -->
    <div class="sticky top-0 z-50 bg-emerald-700 p-4 rounded-b-3xl shadow-xl">
        <div class="flex items-center justify-between mb-3 text-white">
            <button onclick="window.history.back()" class="p-2"><i class="fas fa-arrow-right text-xl"></i></button>
            <h1 class="font-bold text-lg">دليل الإسلامية</h1>
            <div class="w-8"></div>
        </div>
        
        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ابحث هنا..." 
               class="w-full py-2.5 px-4 rounded-xl shadow-inner focus:outline-none mb-3 text-gray-900">

        <div class="flex gap-2 overflow-x-auto hide-scrollbar">
            <button onclick="setCategory('الكل')" class="bg-white text-emerald-800 px-4 py-1 rounded-full text-sm font-bold">الكل</button>
            <button onclick="setCategory('أساسية')" class="bg-emerald-900 text-white px-4 py-1 rounded-full text-sm">أساسية</button>
            <button onclick="setCategory('منصات')" class="bg-emerald-900 text-white px-4 py-1 rounded-full text-sm">منصات</button>
        </div>
    </div>

    <main id="container" class="p-4 space-y-6"></main>

    <script>
        const data = [
            // استخدمت روابط مباشرة وتأكدت من صيغتها
            { title: "فضاء الأولياء", type: "أساسية", theme: "light", url: "https://awlya.education.gov.dz/" },
            { title: "موقع الإسلامية نت", type: "أساسية", theme: "light", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net/" },
            { title: "متجر الإسلامية", type: "أساسية", theme: "light", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net-store" },
            { title: "قناة القرآن الكريم", type: "منصات", theme: "dark", url: "https://www.youtube.com/@quran_kariem" },
            { title: "قناة الشيخ عثمان الخميس", type: "منصات", theme: "dark", url: "https://www.youtube.com/@othmanalkamees" }
        ];

        let currentCat = 'الكل';

        function setCategory(cat) {
            currentCat = cat;
            applyFilters();
        }

        // دالة فتح الروابط بطريقة تضمن عملها
        function openLink(url) {
            // نقوم بالتحويل المباشر للرابط
            window.location.href = url;
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('container');
            container.innerHTML = '';

            const filtered = data.filter(item => {
                const matchQuery = item.title.toLowerCase().includes(query);
                const matchCat = (currentCat === 'الكل' || item.type === currentCat);
                return matchQuery && matchCat;
            });

            // عرض القسم الأساسي
            const mainItems = filtered.filter(i => i.theme === 'light');
            if (mainItems.length > 0) {
                container.innerHTML += `
                    <div class="bg-emerald-800 p-4 rounded-3xl">
                        <h2 class="text-white mb-3 font-bold text-sm">المواقع الأساسية</h2>
                        ${mainItems.map(i => `
                            <div class="bg-white p-4 rounded-2xl flex justify-between items-center mb-2 shadow-sm">
                                <span class="font-bold text-gray-800">${i.title}</span>
                                <button onclick="openLink('${i.url}')" class="bg-emerald-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold">زيارة</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // عرض القسم الداكن
            const darkItems = filtered.filter(i => i.theme === 'dark');
            if (darkItems.length > 0) {
                container.innerHTML += `
                    <h2 class="text-gray-400 font-bold px-1 text-sm mb-2">منصات ومواقع دينية</h2>
                    ${darkItems.map(i => `
                        <div class="bg-slate-800 border border-slate-700 p-4 rounded-3xl mb-3 shadow-lg">
                            <h3 class="text-white font-bold mb-3">${i.title}</h3>
                            <button onclick="openLink('${i.url}')" class="block text-center w-full bg-blue-600 text-white py-2 rounded-xl font-bold">زيارة القناة</button>
                        </div>
                    `).join('')}
                `;
            }
        }

        applyFilters();
    </script>
</body>
</html>
