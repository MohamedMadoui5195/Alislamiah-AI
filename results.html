<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alislamiah AI - Results</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:70px 20px 20px;
font-family:Arial,sans-serif;
background:#fff;
}

.topButtons{
position:fixed;
top:0;
left:0;
right:0;
height:58px;
display:flex;
align-items:center;
gap:10px;
padding:0 15px;
background:#1565C0;
box-shadow:0 2px 8px rgba(0,0,0,.15);
z-index:9999;
}

.navBtn{
display:flex;
align-items:center;
gap:6px;
padding:8px 16px;
background:#1976D2;
color:#fff;
border:none;
border-radius:999px;
font-size:14px;
font-weight:600;
cursor:pointer;
transition:.25s;
}

.navBtn:hover{
background:#0D47A1;
}

.navBtn svg{
flex-shrink:0;
}

#results{
max-width:900px;
margin:auto;
}

.result{
padding:16px 0;
border-bottom:1px solid #ddd;
}

.result h3{
margin:0 0 8px;
}

.result p{
margin:0 0 8px;
color:#555;
}

.result a{
color:green;
text-decoration:none;
word-break:break-word;
}

</style>

</head>

<body>

<div class="topButtons">

<button class="navBtn" onclick="history.back()">

<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
<path fill-rule="evenodd" d="M15 8a.75.75 0 0 1-.75.75H3.56l3.22 3.22a.75.75 0 1 1-1.06 1.06L1.22 8.53a.75.75 0 0 1 0-1.06l4.5-4.5a.75.75 0 1 1 1.06 1.06L3.56 7.25h10.69A.75.75 0 0 1 15 8Z"/>
</svg>

<span>رجوع</span>

</button>

<button class="navBtn" onclick="window.location.href='index.html'">

<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
<path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 2 8h1v6a1 1 0 0 0 1 1h3V10h2v5h3a1 1 0 0 0 1-1V8h1a.5.5 0 0 0 .354-.854l-6-6z"/>
</svg>

<span>الرئيسية</span>

</button>

</div>
<div id="results"></div>

<script type="module" src="results.js"></script>

</body>

</html>
