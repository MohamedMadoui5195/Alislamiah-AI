<!DOCTYPE html>

<head>

    <title>نتائج البحث - Alislamiah Search Engine</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; padding-top: 140px; background-color: #060c16; color: #fff; font-family: sans-serif; }
        #app-header { position: fixed; top: 0; left: 0; width: 100%; z-index: 50; }
        .result-card { background: #0a1525; border: 1px solid #17283e; transition: .2s; }
        .result-card:hover { border-color: #214f8f; background: #0f1e31; }

        .ai-answer-box {
            background: linear-gradient(145deg, rgba(8, 127, 255, 0.12), rgba(8, 185, 239, 0.05));
            border: 1px solid rgba(8, 127, 255, 0.3);
            border-radius: 20px;
            padding: 20px 22px;
            margin-bottom: 16px;
            direction: rtl;
            text-align: right;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .ai-answer-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: 700;
            color: #08b9ef;
            font-size: 16px;
        }

        .ai-answer-header span {
            background: #087fff;
            color: #ffffff;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .ai-answer-content {
            color: #e2e8f0;
            font-size: 14.5px;
            line-height: 1.8;
        }
    </style>
</head>

    <header id="app-header" class="bg-[#081321] border-b border-[#17283e] p-4 shadow-lg">

            <button onclick="window.history.back()" class="p-2"><i class="fas fa-arrow-right text-xl"></i></button>

                   class="w-full py-3 px-4 rounded-xl bg-white text-slate-900 focus:outline-none shadow-inner text-sm">
        </div>
    </header>

        ];
        function getFavicon(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
            } catch (e) {
                return 'https://www.google.com/favicon.ico';
            }
        }

        function render() {
            const searchInput = document.getElementById('searchInput');
            const query = searchInput.value.trim();
            const resultsList = document.getElementById('resultsList');
            const aiContainer = document.getElementById('aiAnswerContainer');
            const aiText = document.getElementById('aiAnswerText');

            if (!query) {
                aiContainer.style.display = 'none';
            } else {
                aiContainer.style.display = 'block';
                const q = query.toLowerCase();

                if (q.includes('الإسلامية') || q.includes('alislamiah')) {
                    aiText.innerHTML = `تعتبر منصة <strong>الإسلامية</strong> شبكة رقمية متكاملة تقدم خدمات متنوعة تشمل المنصات التعليمية، المتاجر الرقمية، ومساعد الذكاء الاصطناعي لتسهيل الوصول للمحتوى الهادف.`;
                } else if (q.includes('متجر')) {
                    aiText.innerHTML = `موقع <strong>متجر الإسلامية</strong> يوفر لك أحدث التطبيقات والمنصات الرقمية الخاصة بشبكة الإسلامية للتحميل والاستخدام المباشر.`;
                } else if (q.includes('العربية')) {
                    aiText.innerHTML = `موقع <strong>العربية.نت</strong> هو بوابة إخبارية رائدة لتغطية الأخبار العربية، العالمية، السياسية، والرياضية لحظة بلحظة.`;
                } else if (q.includes('الجزائر') || q.includes('أولياء')) {
                    aiText.innerHTML = `يمكنك متابعة النتائج والمستويات الدراسية عبر المنصات الرسمية المعتمدة في الجزائر مثل <strong>فضاء الأولياء</strong> وواقع منصات الدعم التعليمي.`;
                } else if (q.includes('أحمد النفيس') || q.includes('النفيس') || q.includes('ahmad alnufais')) {
                    aiText.innerHTML = `تعتبر <strong>قناة الشيخ أحمد النفيس</strong> منارة قرآنية مباركة تقدم تلاوات عطرة، خاشعة، ومؤثرة لآي الذكر الحكيم بصوت الشيخ أحمد النفيس.`;
                } else if (q.includes('فركوس')) {
                    aiText.innerHTML = `<strong>قناة الشيخ فركوس</strong> هي القناة الرسمية لفضيلة الشيخ الدكتور محمد علي فركوس، وتضم العديد من الخطب والدروس العلمية القيمة.`;
                } else if (q.includes('إسلام ويب')) {
                    aiText.innerHTML = `موقع <strong>إسلام ويب</strong> هو موقع إسلامي شامل يقدم فتاوى دقيقة، استشارات متنوعة، ومقالات دعوية وعلمية موثوقة.`;
                } else if (q.includes('السؤال وجواب') || q.includes('islamqa')) {
                    aiText.innerHTML = `موقع <strong>الإسلام سؤال وجواب</strong> يشرف عليه الشيخ محمد صالح المنجد للإجابة عن الأسئلة الشرعية والفقهية بدقة وتأصيل.`;
                } else if (q.includes('الجزيرة')) {
                    aiText.innerHTML = `شبكة <strong>الجزيرة نت</strong> الإخبارية توفر لك متابعة شاملة ومستمرة لآخر الأحداث والأنباء العربية والعالمية.`;
                } else if (q.includes('العفاسي')) {
                    aiText.innerHTML = `قناة وصفحات القارئ والمنشد الشيخ <strong>مشاري بن راشد العفاسي</strong> تقدم أروع التلاوات والأناشيد الإسلامية المميزة.`;
                } else if (q.includes('إسلام صبحي')) {
                    aiText.innerHTML = `قناة القارئ <strong>إسلام صبحي</strong> تعرض تلاوات عطرة وندية بصوته الخاشع والمميز للقرآن الكريم.`;
                } else if (q.includes('dzexams') || q.includes('الامتحانات')) {
                    aiText.innerHTML = `موقع <strong>dz.exams</strong> يعتبر مرجعاً أساسياً للفرائض، الاختبارات، والامتحانات التعليمية بمختلف أطوارها في الجزائر.`;
                } else if (q.includes('cnas')) {
                    aiText.innerHTML = `منصة <strong>CNAS</strong> تتبع الصندوق الوطني للتأمينات الاجتماعية للعمال الأجناء بالجزائر لتسهيل الخدمات الإدارية.`;
                } else if (q.includes('sntf')) {
                    aiText.innerHTML = `موقع <strong>SNTF</strong> يخص الشركة الوطنية للنقل بالسكك الحديدية في الجزائر لمتابعة المواقيت والرحلات.`;
                } else if (q.includes('etusa')) {
                    aiText.innerHTML = `موقع ومؤسسة <strong>Etusa</strong> مخصصة للنقل الحضري وشبه الحضري لتقديم خدمات التنقل في الجزائر.`;
                } else if (q.includes('ويكيبيديا') || q.includes('wikipedia')) {
                    aiText.innerHTML = `موقع <strong>ويكيبيديا</strong> هو موسوعة عالمية حرة ومتعددة اللغات يساهم في إثرائها وتعديل محتواتها متطوعون من جميع أنحاء العالم.`;
                } else {
                    aiText.innerHTML = `بناءً على بحثك عن "<strong>${query}</strong>"، قمنا بعرض النتائج المطابقة من المنصات والمواقع المتاحة في قاعدة بيانات شبكة الإسلامية.`;
                }
            }

            const filtered = library.filter(item => {
                const q = query.toLowerCase();
                return item.title.toLowerCase().includes(q) || 
                       item.desc.toLowerCase().includes(q) || 
                       item.url.toLowerCase().includes(q);
            });

            if (filtered.length === 0) {
                resultsList.innerHTML = `
                    <div class="result-card p-6 rounded-2xl text-center text-slate-400">
                        <i class="fas fa-search text-3xl mb-2 text-slate-500"></i>
                        <p>عذراً، لم نتمكن من العثور على نتائج مطابقة لبحثك.</p>
                    </div>`;
                return;
            }

            resultsList.innerHTML = filtered.map(item => `
                <a href="${item.url}" target="_blank" class="result-card p-4 rounded-2xl flex items-start gap-4 block">
                    <img src="${getFavicon(item.url)}" class="w-10 h-10 rounded-xl bg-white/5 p-1 flex-shrink-0 object-contain" onerror="this.src='https://www.google.com/favicon.ico'">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs bg-[#17283e] text-[#08b9ef] px-2 py-0.5 rounded-md font-medium">${item.type || 'موقع'}</span>
                            <span class="text-xs text-slate-400 truncate">${item.url}</span>
                        </div>
                        <h2 class="font-bold text-base text-white mb-1 truncate">${item.title}</h2>
                        <p class="text-sm text-slate-300 line-clamp-2">${item.desc}</p>
                    </div>
                </a>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            const searchInput = document.getElementById('searchInput');
            
            if (query) {
                searchInput.value = query;
            }
            
            searchInput.addEventListener('input', render);
            render();
        });
    </script>
