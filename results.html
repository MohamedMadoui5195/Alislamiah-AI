<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل المواقع الإسلامية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-10">

    <!-- الشريط العلوي (الأخضر) كما في الصورة -->
    <div class="bg-emerald-700 p-4 rounded-b-3xl shadow-lg sticky top-0 z-50">
        <h1 class="text-white font-bold text-xl mb-4">دليل المواقع الإسلامية</h1>
        
        <!-- البحث -->
        <div class="relative mb-4">
            <input type="text" id="searchInput" oninput="render()" placeholder="ابحث عن موقع، كتاب، أو قسم..." 
                   class="w-full py-3 pr-4 pl-10 rounded-xl focus:outline-none">
            <i class="fas fa-search absolute left-4 top-4 text-gray-400"></i>
        </div>

        <!-- أزرار التصنيفات -->
        <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
            <button onclick="setCat('الكل')" class="cat-btn bg-white text-emerald-800 px-4 py-1.5 rounded-full font-bold text-sm whitespace-nowrap">الكل</button>
            <button onclick="setCat('القرآن الكريم')" class="cat-btn bg-emerald-600 text-white px-4 py-1.5 rounded-full text-sm whitespace-nowrap">القرآن الكريم</button>
            <button onclick="setCat('السنة النبوية')" class="cat-btn bg-emerald-600 text-white px-4 py-1.5 rounded-full text-sm whitespace-nowrap">السنة النبوية</button>
            <button onclick="setCat('الفتاوى')" class="cat-btn bg-emerald-600 text-white px-4 py-1.5 rounded-full text-sm whitespace-nowrap">الفتاوى</button>
        </div>
    </div>

    <!-- منطقة عرض المواقع -->
    <main id="container" class="p-4 space-y-4 max-w-lg mx-auto"></main>

    <script>
        const data = [
            // المواقع الأساسية (تظهر دائماً في الصفحة الخضراء/البيضاء)
            { title: "القرآن الكريم", category: "القرآن الكريم", theme: "islamic", url: "https://quran.com" },
            { title: "موقع الإسلام سؤال وجواب", category: "الفتاوى", theme: "islamic", url: "https://islamqa.info" },
            { title: "موسوعة السنة النبوية", category: "السنة النبوية", theme: "islamic", url: "https://sunnah.com" },
            { title: "فضاء الأولياء", category: "أساسية", theme: "islamic", url: "https://awlya.education.gov.dz/" },
            
            // منصات التواصل (تظهر في الصفحة الداكنة)
            { title: "يوتيوب قنوات دينية", category: "منصات", theme: "dark", url: "https://youtube.com" },
            { title: "منصة فايربيز", category: "منصات", theme: "dark", url: "https://firebase.google.com" }
        ];

        let activeCat = 'الكل';
        function setCat(cat) { activeCat = cat; render(); }

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('container');
            container.innerHTML = '';

            const filtered = data.filter(i => 
                (activeCat === 'الكل' || i.category === activeCat) && 
                i.title.toLowerCase().includes(query)
            );

            // المنطق: إذا كان البحث يخص المنصات فقط، لا تظهر القسم الإسلامي والعكس صحيح
            const islamicItems = filtered.filter(i => i.theme === 'islamic');
            const darkItems = filtered.filter(i => i.theme === 'dark');

            if (islamicItems.length > 0) {
                islamicItems.forEach(i => {
                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                            <div>
                                <span class="block text-emerald-600 text-xs font-bold mb-1">${i.category}</span>
                                <span class="font-bold text-gray-800">${i.title}</span>
                            </div>
                            <button onclick="window.location.href='${i.url}'" class="bg-emerald-100 text-emerald-700 px-4 py-2 rounded-xl text-sm font-bold">زيارة الموقع</button>
                        </div>
                    `;
                });
            }

            if (darkItems.length > 0) {
                darkItems.forEach(i => {
                    container.innerHTML += `
                        <div class="bg-slate-800 p-5 rounded-2xl shadow-lg mt-6">
                            <h3 class="text-white font-bold mb-3">${i.title}</h3>
                            <button onclick="window.location.href='${i.url}'" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">زيارة</button>
                        </div>
                    `;
                });
            }
        }
        render();
    </script>
</body>
</html>
