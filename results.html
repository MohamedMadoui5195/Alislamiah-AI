<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الإسلامية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background-color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-20">

    <!-- شريط البحث والتنقل الثابت -->
    <div class="sticky top-0 z-50 bg-emerald-700 p-4 rounded-b-3xl shadow-xl">
        <div class="flex items-center justify-between mb-3 text-white">
            <button onclick="window.history.back()" class="p-2"><i class="fas fa-arrow-right text-xl"></i></button>
            <h1 class="font-bold text-lg">دليل الإسلامية الشامل</h1>
            <div class="w-8"></div>
        </div>
        <input type="text" id="searchInput" oninput="filterContent()" placeholder="ابحث هنا..." 
               class="w-full py-2.5 px-4 rounded-xl shadow-inner focus:outline-none">
    </div>

    <!-- حاوية النتائج -->
    <main id="container" class="p-4 space-y-6"></main>

    <script>
        const allItems = [
            // القسم الأساسي (أبيض وأخضر)
            { title: "فضاء الأولياء", url: "https://example.com/parents", type: "أساسية", theme: "light" },
            { title: "موقع الإسلامية نت", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net/", type: "أساسية", theme: "light" },
            { title: "متجر الإسلامية", url: "https://mohamedmadoui5195.github.io/Alislamiah-_net-store", type: "أساسية", theme: "light" },
            
            // القسم الداكن (منصات)
            { title: "يوتيوب (قنوات دينية)", url: "https://www.youtube.com", type: "منصات", theme: "dark" },
            { title: "منصة فايربيز", url: "https://firebase.google.com", type: "منصات", theme: "dark" }
        ];

        function filterContent() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('container');
            container.innerHTML = '';

            const filtered = allItems.filter(i => i.title.toLowerCase().includes(searchText));

            // عرض القسم الأساسي إذا وجد نتائج
            const main = filtered.filter(i => i.theme === 'light');
            if(main.length > 0) {
                let html = `<div class="bg-emerald-800 p-4 rounded-3xl"><h2 class="text-white mb-3 font-bold">القسم الأساسي</h2>`;
                main.forEach(i => html += `<div class="bg-white p-4 rounded-2xl flex justify-between mb-2"><span>${i.title}</span><button onclick="window.location.href='${i.url}'" class="bg-emerald-600 text-white px-4 py-1 rounded-lg">زيارة</button></div>`);
                container.innerHTML += html + `</div>`;
            }

            // عرض القسم الداكن إذا وجد نتائج
            const dark = filtered.filter(i => i.theme === 'dark');
            if(dark.length > 0) {
                let html = `<h2 class="text-gray-400 font-bold px-1">المنصات والمواقع الأخرى</h2>`;
                dark.forEach(i => html += `<div class="bg-slate-800 border border-slate-700 p-4 rounded-3xl mb-3"><h3 class="text-white mb-2">${i.title}</h3><button onclick="window.location.href='${i.url}'" class="w-full bg-blue-600 text-white py-2 rounded-xl">زيارة</button></div>`);
                container.innerHTML += html;
            }
        }

        filterContent();
    </script>
</body>
</html>
