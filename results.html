<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج البحث - Alislamiah AI Browser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        
        body { 
            background: #0b1020; 
            color: white; 
            padding-top: 60px; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* شريط أزرار التنقل الثابت الذي لا يختفي أبداً */
        .top-nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #0b1020;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 9999;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: 0.3s;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .page-title {
            font-size: 15px;
            color: #c7d7ff;
        }

        #results-container { 
            max-width: 800px; 
            width: 100%; 
            margin: 20px auto; 
            padding: 0 20px;
            overflow-y: auto;
            flex: 1;
        }

        .result-card { 
            background: rgba(255, 255, 255, 0.08); 
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }

        .result-card h3 { color: #00c3ff; margin-bottom: 8px; }
        .result-card p { color: #c7d7ff; font-size: 14px; margin-bottom: 10px; }
        
        .result-card button { 
            cursor: pointer;
            color: #fff; 
            background: #0077ff;
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
        }

        .result-card button:hover {
            background: #005bb5;
        }

        #browser-frame {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
            display: none;
            background: white;
        }
    </style>
</head>
<body>

<div class="top-nav-bar">
    <div>
        <a href="index.html" class="nav-btn">🏠 الرئيسية</a>
        <button onclick="goBackToResults()" class="nav-btn" id="back-results-btn" style="display:none;">⬅ رجوع للنتائج</button>
    </div>
    <div class="page-title" id="bar-title">Alislamiah Browser</div>
</div>

<div id="results-container"></div>
<iframe id="browser-frame"></iframe>

<script>
    const sitesDatabase = {
        "News": [
            { title: "Alarabiya.net", description: "أهم الأخبار العاجلة من العالم العربي والعالم.", url: "https://www.alarabiya.net" },
            { title: "Al Jazeera Arabic", description: "تغطية حيّة لأبرز الأحداث والسياسة.", url: "https://www.aljazeera.net" }
        ],
        "Quran": [
            { title: "القرآن الكريم - مجمع الملك فهد", description: "تصفح وقراءة المصحف الشريف.", url: "https://quran.com" }
        ],
        "YouTube": [
            // استخدمنا رابط يوتيوب المخصص للموبايل والنسخة المتوافقة لكي تفتح داخل التطبيق بلا مشاكل
            { title: "YouTube", description: "منصة مقاطع الفيديو الشهيرة (تصفح مباشر داخل التطبيق).", url: "https://www.youtube.com/embed?autoplay=1" }
        ]
    };

    function showResults() {
        const query = new URLSearchParams(window.location.search).get('q');
        const container = document.getElementById("results-container");
        container.innerHTML = "";

        let results = sitesDatabase[query] || [
            { title: query ? `نتيجة البحث: ${query}` : "البحث العام", description: "تصفح النتائج عبر الويب.", url: "https://lite.duckduckgo.com/lite/?q=" + encodeURIComponent(query || "") }
        ];

        results.forEach(site => {
            container.innerHTML += `
                <div class="result-card">
                    <h3>${site.title}</h3>
                    <p>${site.description}</p>
                    <button onclick="openInApp('${site.url}', '${site.title}')">تصفح داخل التطبيق</button>
                </div>`;
        });
    }

    function openInApp(url, title) {
        document.getElementById("results-container").style.display = "none";
        let frame = document.getElementById("browser-frame");
        frame.style.display = "block";
        frame.src = url;
        
        document.getElementById("bar-title").innerText = title;
        document.getElementById("back-results-btn").style.display = "inline-block";
    }

    function goBackToResults() {
        let frame = document.getElementById("browser-frame");
        frame.src = "";
        frame.style.display = "none";
        document.getElementById("results-container").style.display = "block";
        
        document.getElementById("bar-title").innerText = "Alislamiah Browser";
        document.getElementById("back-results-btn").style.display = "none";
    }

    window.onload = showResults;
</script>

</body>
</html>
