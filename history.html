<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>History | Alislamiah</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#060c16;
    color:white;
    min-height:100vh;
}


/* ================= HEADER ================= */

.header{
    height:68px;

    background:#081321;

    border-bottom:1px solid #17283e;

    display:flex;
    align-items:center;

    padding:0 18px;

    position:sticky;
    top:0;

    z-index:10;
}

.back{
    width:42px;
    height:42px;

    border:0;
    background:none;

    color:white;

    font-size:34px;

    cursor:pointer;

    margin-right:15px;
}

.header h1{
    font-size:22px;
    font-weight:500;
}


/* ================= MAIN ================= */

.container{
    width:94%;
    max-width:700px;

    margin:25px auto 60px;
}


/* ================= TOP ================= */

.top{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:12px;
}

.title{
    color:#7187a5;

    font-size:13px;
    font-weight:bold;

    letter-spacing:1px;
}

.clear-button{
    border:0;

    background:transparent;

    color:#6fa4ed;

    font-size:13px;

    cursor:pointer;

    padding:7px 5px;
}

.clear-button:hover{
    color:#9bc5ff;
}


/* ================= HISTORY BOX ================= */

.history-box{
    background:#0a1525;

    border:1px solid #17283e;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 15px 45px rgba(0,0,0,.4);
}


/* ================= HISTORY ITEM ================= */

.history-item{
    min-height:76px;

    padding:13px 17px;

    display:flex;
    align-items:center;

    gap:14px;

    border-bottom:1px solid #16263b;

    cursor:pointer;

    transition:.2s;
}

.history-item:last-child{
    border-bottom:none;
}

.history-item:hover{
    background:#0f1e31;
}

.history-item:active{
    background:#142840;
}


/* ================= SITE ICON ================= */

.site-icon{
    width:43px;
    height:43px;

    border-radius:12px;

    background:#12243b;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    flex-shrink:0;

    color:#9bb4d5;

    font-size:18px;
}

.site-icon img{
    width:25px;
    height:25px;

    object-fit:contain;
}


/* ================= HISTORY TEXT ================= */

.history-info{
    min-width:0;

    flex:1;
}

.history-title{
    font-size:15px;

    color:#f2f5f9;

    margin-bottom:5px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.history-url{
    font-size:12px;

    color:#71829a;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.history-time{
    font-size:11px;

    color:#596a82;

    margin-top:4px;
}


/* ================= EMPTY ================= */

.empty{
    display:none;

    padding:70px 20px;

    text-align:center;
}

.empty-icon{
    width:70px;
    height:70px;

    border-radius:22px;

    background:#12243b;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

    margin:0 auto 18px;
}

.empty h2{
    font-size:18px;

    font-weight:500;

    margin-bottom:8px;
}

.empty p{
    color:#71829a;

    font-size:13px;

    line-height:1.6;
}


/* ================= CONFIRM POPUP ================= */

.popup{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:100;
}

.popup-box{
    width:100%;
    max-width:400px;

    background:#0a1525;

    border:1px solid #1a2d45;

    border-radius:20px;

    padding:24px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.6);
}

.popup-box h2{
    font-size:19px;

    font-weight:500;

    margin-bottom:10px;
}

.popup-box p{
    color:#8292a8;

    font-size:13px;

    line-height:1.6;

    margin-bottom:22px;
}

.popup-buttons{
    display:flex;

    gap:10px;
}

.popup-buttons button{
    flex:1;

    padding:13px;

    border:0;

    border-radius:11px;

    font-size:14px;

    cursor:pointer;
}

.cancel{
    background:#17263a;

    color:white;
}

.confirm{
    background:#214f8f;

    color:white;
}

.confirm:hover{
    background:#285fa7;
}


/* ================= MOBILE ================= */

@media(max-width:500px){

    .header{
        height:64px;

        padding:0 15px;
    }

    .header h1{
        font-size:21px;
    }

    .container{
        width:94%;

        margin-top:22px;
    }

    .history-item{
        min-height:72px;

        padding:12px 14px;

        gap:12px;
    }

    .site-icon{
        width:40px;
        height:40px;
    }

    .history-title{
        font-size:14px;
    }

    .history-url{
        font-size:11px;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <button
        class="back"
        onclick="history.back()">

        ‹

    </button>


    <h1>
        History
    </h1>

</header>



<!-- ================= MAIN ================= -->

<main class="container">


    <div class="top">

        <div class="title">
            BROWSING HISTORY
        </div>


        <button
            class="clear-button"
            onclick="openClearPopup()">

            Clear browsing history

        </button>

    </div>



    <!-- HISTORY -->

    <div
        class="history-box"
        id="historyBox">
    </div>



    <!-- EMPTY -->

    <div
        class="empty"
        id="emptyHistory">

        <div class="empty-icon">
            🕘
        </div>

        <h2>
            No history
        </h2>

        <p>
            Pages you visit will appear here.
        </p>

    </div>

</main>



<!-- ================= CLEAR POPUP ================= -->

<div
    class="popup"
    id="clearPopup">

    <div class="popup-box">

        <h2>
            Clear browsing history?
        </h2>

        <p>
            This will remove all pages from your browsing history.
        </p>


        <div class="popup-buttons">

            <button
                class="cancel"
                onclick="closeClearPopup()">

                Cancel

            </button>


            <button
                class="confirm"
                onclick="clearHistory()">

                Clear

            </button>

        </div>

    </div>

</div>



<script>


/* =========================================
   HISTORY STORAGE KEY
========================================= */

const HISTORY_KEY = "alislamiah_history";



/* =========================================
   GET HISTORY
========================================= */

function getHistory(){

    try{

        const data =
            localStorage.getItem(
                HISTORY_KEY
            );

        if(!data){
            return [];
        }

        const history =
            JSON.parse(data);

        return Array.isArray(history)
            ? history
            : [];

    }

    catch(error){

        return [];

    }

}



/* =========================================
   SAVE HISTORY
========================================= */

function saveHistory(history){

    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history)
    );

}



/* =========================================
   DISPLAY HISTORY
========================================= */

function displayHistory(){

    const history =
        getHistory();


    const box =
        document.getElementById(
            "historyBox"
        );


    const empty =
        document.getElementById(
            "emptyHistory"
        );


    box.innerHTML = "";


    if(history.length === 0){

        box.style.display = "none";

        empty.style.display = "block";

        return;

    }


    box.style.display = "block";

    empty.style.display = "none";


    history.forEach(function(item,index){

        const element =
            document.createElement(
                "div"
            );

        element.className =
            "history-item";


        /* ICON */

        const icon =
            document.createElement(
                "div"
            );

        icon.className =
            "site-icon";


        if(item.icon){

            const image =
                document.createElement(
                    "img"
                );

            image.src =
                item.icon;

            image.alt = "";

            image.onerror =
                function(){

                    icon.innerHTML =
                        "🌐";

                };

            icon.appendChild(image);

        }

        else{

            icon.textContent =
                "🌐";

        }



        /* INFO */

        const info =
            document.createElement(
                "div"
            );

        info.className =
            "history-info";


        const title =
            document.createElement(
                "div"
            );

        title.className =
            "history-title";

        title.textContent =
            item.title ||
            item.url ||
            "Untitled";


        const url =
            document.createElement(
                "div"
            );

        url.className =
            "history-url";

        url.textContent =
            item.url || "";


        const time =
            document.createElement(
                "div"
            );

        time.className =
            "history-time";

        time.textContent =
            formatTime(
                item.time
            );


        info.appendChild(title);

        info.appendChild(url);

        info.appendChild(time);


        element.appendChild(icon);

        element.appendChild(info);


        /* OPEN PAGE */

        element.onclick =
            function(){

                if(item.url){

                    window.location.href =
                        item.url;

                }

            };


        box.appendChild(element);

    });

}



/* =========================================
   FORMAT TIME
========================================= */

function formatTime(timestamp){

    if(!timestamp){
        return "";
    }


    const date =
        new Date(timestamp);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return "";

    }


    const now =
        new Date();


    const today =
        date.toDateString() ===
        now.toDateString();


    if(today){

        return date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }


    return date.toLocaleDateString(
        [],
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    )
    +
    " • "
    +
    date.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}



/* =========================================
   CLEAR POPUP
========================================= */

function openClearPopup(){

    document.getElementById(
        "clearPopup"
    ).style.display = "flex";

}


function closeClearPopup(){

    document.getElementById(
        "clearPopup"
    ).style.display = "none";

}



/* =========================================
   CLEAR HISTORY
========================================= */

function clearHistory(){

    localStorage.removeItem(
        HISTORY_KEY
    );


    closeClearPopup();


    displayHistory();

}



/* =========================================
   UPDATE WHEN STORAGE CHANGES
========================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key === HISTORY_KEY
        ){

            displayHistory();

        }

    }
);



/* =========================================
   LOAD
========================================= */

displayHistory();

</script>


</body>
</html>
