<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alislamiah AI - Sign Up</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#061a3a;
font-family:Arial;
}

.box{
width:330px;
padding:30px;
background:#0b2a5b;
border-radius:15px;
color:white;
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:0;
outline:none;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:0;
border-radius:8px;
cursor:pointer;
font-size:16px;
background:#1e90ff;
color:white;
}

.links{
text-align:center;
margin-top:18px;
}

.links a{
color:#4db8ff;
text-decoration:none;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Create Account</h2>

<input
id="fullname"
type="text"
placeholder="Full Name">

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<input
id="confirmPassword"
type="password"
placeholder="Confirm Password">

<button id="signupBtn">
Create Account
</button>

<div class="links">

Already have an account?

<a href="signin.html">
Sign In
</a>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
createUserWithEmailAndPassword,
updateProfile

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyBFPwbDSeMzI5eOL8DeXNZovcr47JtlZnU",

authDomain: "alislamiah-ai.firebaseapp.com",

projectId: "alislamiah-ai",

storageBucket: "alislamiah-ai.firebasestorage.app",

messagingSenderId: "956902867596",

appId: "1:956902867596:web:0e99d136f745655535f1a9",

measurementId: "G-MV3BQG10T2"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
// ==========================
// Create Account
// ==========================

document.getElementById("signupBtn").addEventListener("click", async ()=>{

const fullname=document.getElementById("fullname").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const confirmPassword=document.getElementById("confirmPassword").value;

if(fullname===""){
alert("Please enter your full name.");
return;
}

if(email===""){
alert("Please enter your email.");
return;
}

if(password===""){
alert("Please enter a password.");
return;
}

if(password.length<6){
alert("Password must be at least 6 characters.");
return;
}

if(password!==confirmPassword){
alert("Passwords do not match.");
return;
}

try{

const userCredential=await createUserWithEmailAndPassword(
auth,
email,
password
);

await updateProfile(userCredential.user,{
displayName:fullname
});

alert("Account created successfully.");

window.location.href="index.html";

}catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
