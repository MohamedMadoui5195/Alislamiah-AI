<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alislamiah-AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{font-family:Arial,sans-serif;background:#060c16;color:#222;overflow:hidden;display:flex;flex-direction:column;}

.header{height:68px;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#833ab4,#c13584,#e1306c,#f77737);color:white;z-index:10;flex-shrink:0;}
.header-title{font-size:23px;font-weight:bold;}

.chat{flex:1;overflow-y:auto;padding:22px 14px;background:#060c16;}
.message{max-width:85%;padding:14px 17px;margin:13px auto;font-size:15px;line-height:1.8;border-radius:21px;word-wrap:break-word;white-space:pre-line;}
.user{margin-right:auto;margin-left:0;color:white;background:linear-gradient(135deg,#fa7e1e,#e1306c,#833ab4);border-bottom-right-radius:5px;}
.ai{margin-left:auto;margin-right:0;background:#ffffff;color:#202020;border-bottom-left-radius:5px;}

.welcome{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.welcome h1{font-size:32px;margin-bottom:8px;color:#fff;}
.welcome p{color:#888;font-size:15px;}

.input-area{height:82px;padding:13px 12px;background:#060c16;border-top:1px solid #17283e;flex-shrink:0;}
.input-box{width:100%;max-width:800px;margin:0 auto;height:55px;display:flex;align-items:center;border-radius:30px;background:#fff;padding:4px;}
textarea{flex:1;height:45px;resize:none;border:none;outline:none;background:transparent;padding:11px 16px;font-size:16px;color:#222;direction:rtl;}
.send{width:45px;height:45px;border:none;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,#833ab4,#e1306c);color:white;font-size:14px;font-weight:bold;flex-shrink:0;}
</style>
</head>
<body>

<div class="header">
    <div class="header-title">Alislamiah-AI</div>
</div>

<div class="chat" id="chat">
    <div class="welcome" id="welcome">
        <h1>Alislamiah-AI</h1>
        <p>مرحباً بك! أنا مساعدك الذكي، إسألني في الفقه، أو اطلب حساباً أو ترجمة.</p>
    </div>
</div>

<div class="input-area">
    <div class="input-box">
        <textarea id="message" placeholder="اكتب سؤالك، حساباً، أو ترجمة..." rows="1"></textarea>
        <button class="send" id="sendBtn">إرسال</button>
    </div>
</div>

<script>
// قاعدة جذور ذكية ومركزة لتغطية أهم المسائل دون إطالة
const smartKnowledge = [
    { roots: ["تسويق", "هرمي", "شبكي", "n vision"], reply: "التسويق الهرمي والشبكي (مثل N Vision) محرم شرعاً لأنه يعتمد على أخذ أموال الناس بالباطل والتجنيد لا على بيع منتج حقيقي." },
    { roots: ["صلاة", "صلاتي"], reply: "الصلاة عماد الدين وهي أعظم العبادات بعد الشهادتين، ويجب المحافظة عليها في أوقاتها." },
    { roots: ["صيام", "رمضان"], reply: "الصيام جنة وهي عبادة عظيمة لتطهير النفس وتقوى الله، وأعظمه صيام شهر رمضان المبارك." },
    { roots: ["ميراث", "تركة", "فرائض"], reply: "علم الفرائض والمواريث نظمه الله بنفسه في القرآن الكريم بدقة بالغة لعدم حدوث نزاعات بين الورثة." },
    { roots: ["زكاة", "مال"], reply: "الزكاة ركن من أركان الإسلام، وتجب في الأموال التي بلغت النصاب وحال عليها الحول بنسبة 2.5%." },
    { roots: ["جهاد", "قتال"], reply: "الجهاد مشروع للدفاع عن الدين والأرض والنفس، وله أخلاق وضوابط صارمة في الشريعة." },
    { roots: ["ربا", "قمار", "ميسر"], reply: "الربا والميسر من كبائر الذنوب وممحقتا البركة في الأموال، وقد حاربها الإسلام بكل صورها." },
    { roots: ["سلام", "مرحبا", "أهلاً"], reply: "وعليكم السلام ورحمة الله وبركاته! أهلاً بك، كيف يمكنني مساعدتك اليوم؟" }
];

function handleUserMessage() {
    const inputField = document.getElementById("message");
    const chatContainer = document.getElementById("chat");
    const welcomeScreen = document.getElementById("welcome");
    const userText = inputField.value.trim();

    if (!userText) return;

    if (welcomeScreen) {
        welcomeScreen.remove();
    }

    const userDiv = document.createElement("div");
    userDiv.className = "message user";
    userDiv.textContent = userText;
    chatContainer.appendChild(userDiv);

    inputField.value = "";
    chatContainer.scrollTop = chatContainer.scrollHeight;

    setTimeout(() => {
        let aiReply = "";
        const lowerText = userText.toLowerCase();

        // 1. ميزة الترجمة العفوية
        if (lowerText.includes("ترجم") || lowerText.includes("translate")) {
            let cleanText = userText.replace(/ترجم/gi, '').replace(/translate/gi, '').replace(/إلى الإنجليزية/gi, '').replace(/to english/gi, '').trim();
            aiReply = cleanText.length > 0 ? `🌐 **الترجمة الفورية:**\n"${cleanText}"` : "يرجى كتابة النص المراد ترجمته بعد كلمة ترجم.";
        } 
        // 2. ميزة الحسابات العفوية (إذا كتب أرقام وعمليات حسابية مثل 5+5 أو 20*4)
        else if (/^[\d\s\+\-\*\/\(\)\.\%\^\=]+$/.test(userText) && /\d/.test(userText)) {
            try {
                let calcResult = Function('"use strict";return (' + userText + ')')();
                aiReply = `🧮 **النتيجة الحسابية:** ${calcResult}`;
            } catch (e) {
                aiReply = "عذراً، لمأستطع حساب هذه العملية، تأكد من كتابتها بشكل صحيح.";
            }
        } 
        // 3. البحث بالبصمة والجذور في المعرفة الإسلامية
        else {
            aiReply = "عذراً، لم أجد إجابة دقيقة في قاعدة المعرفة المختصرة، يمكنك السؤال عن: الصلاة، الصيام، الزكاة، الميراث، أو التسويق الهرمي.";
            for (let item of smartKnowledge) {
                for (let root of item.roots) {
                    if (lowerText.includes(root)) {
                        aiReply = item.reply;
                        break;
                    }
                }
                if (aiReply.startsWith("عذراً") === false) break;
            }
        }

        const aiDiv = document.createElement("div");
        aiDiv.className = "message ai";
        aiDiv.textContent = aiReply;
        chatContainer.appendChild(aiDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }, 300);
}

document.getElementById("sendBtn").addEventListener("click", handleUserMessage);
document.getElementById("message").addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        handleUserMessage();
    }
});
</script>
</body>
</html>
