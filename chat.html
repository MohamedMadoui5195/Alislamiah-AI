<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alislamiah-AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{font-family:Arial,sans-serif;background:#060c16;color:#222;overflow:hidden;display:flex;flex-direction:column;}

.header{height:68px;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#833ab4,#c13584,#e1306c,#f77737);color:white;z-index:10;flex-shrink:0;}
.header-title{font-size:23px;font-weight:bold;}

.chat{flex:1;overflow-y:auto;padding:22px 14px;background:#060c16;}
.message{max-width:85%;padding:14px 17px;margin:13px auto;font-size:15px;line-height:1.8;border-radius:21px;word-wrap:break-word;white-space:pre-line;}
.user{margin-right:auto;margin-left:0;color:white;background:linear-gradient(135deg,#fa7e1e,#e1306c,#833ab4);border-bottom-right-radius:5px;}
.ai{margin-left:auto;margin-right:0;background:#ffffff;color:#202020;border-bottom-left-radius:5px;}

.welcome{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.welcome h1{font-size:32px;margin-bottom:8px;color:#fff;}
.welcome p{color:#888;font-size:15px;}

.input-area{height:82px;padding:13px 12px;background:#060c16;border-top:1px solid #17283e;flex-shrink:0;}
.input-box{width:100%;max-width:800px;margin:0 auto;height:55px;display:flex;align-items:center;border-radius:30px;background:#fff;padding:4px;}
textarea{flex:1;height:45px;resize:none;border:none;outline:none;background:transparent;padding:11px 16px;font-size:16px;color:#222;direction:rtl;}
.send{width:45px;height:45px;border:none;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,#833ab4,#e1306c);color:white;font-size:14px;font-weight:bold;flex-shrink:0;}
</style>
</head>
<body>

<div class="header">
    <div class="header-title">Alislamiah-AI</div>
</div>

<div class="chat" id="chat">
    <div class="welcome" id="welcome">
        <h1>Alislamiah-AI</h1>
        <p>كيف يمكنني مساعدتك؟</p>
    </div>
</div>

<div class="input-area">
    <div class="input-box">
        <textarea id="message" placeholder="اكتب سؤالك هنا..." rows="1"></textarea>
        <button class="send" onclick="handleUserMessage()">إرسال</button>
    </div>
</div>

<script>
const supportedFieldsList = "العلوم الإسلامية، القرآن، الحديث، الفقه، والرياضيات";

const massiveKnowledgeBase = [
    // الوداعيات والردود الدقيقة
    { keywords: ["مع السلامة", "إلى اللقاء", "وداعا", "سلامة", "باي"], reply: "مع السلامة وفي حفظ الله ورعايته. نتمنى أن نكون قد أفدناك، ويسعدنا دائماً استقبال استفساراتك!" },
    { keywords: ["مرحبا", "أهلاً", "السلام عليكم", "صباح الخير", "مساء الخير", "هلا"], reply: "وعليكم السلام ورحمة الله وبركاته! أنا مساعدك الذكي Alislamiah-AI. كيف يمكنني دعمك اليوم في العلوم الإسلامية والمعارف المختلفة؟" },
    { keywords: ["من أنت", "ما هو أنت", "تعريف", "اسمك"], reply: "أنا Alislamiah-AI، نموذج ذكاء اصطناعي محلي مصمم لتقديم إجابات دقيقة وحلول منهجية للمسائل الدينية والعلمية." },
    
    // قسم القرآن الكريم وعلومه
    { keywords: ["قرآن", "مصحف", "تلاوة", "آية", "سور"], reply: "القرآن الكريم هو كلام الله المنزل على نبيه محمد صلى الله عليه وسلم، العبادة بتلاوته، والمبدوء بسورة الفاتحة والمختوم بسورة الناس." },
    { keywords: ["تفسير", "معنى الآية", "تأويل"], reply: "علم التفسير هو العلم الذي يُعرف به فهم كتاب الله المنزل على نبيه محمد صلى الله عليه وسلم وبيان معانيه واستخراج أحكامه." },
    { keywords: ["سورة الكهف", "جمعة", "سنن يوم الجمعة"], reply: "قراءة سورة الكهف يوم الجمعة تنير ما بين الجمعتين، وهي من السنن المؤكدة المستحبة." },
    { keywords: ["تدبر", "حفظ القرآن"], reply: "تدبر القرآن الكريم وفهم معانيه والعمل بأحكامه هو الغاية العظمى من إنزاله على العباد." },

    // قسم الحديث والسنة
    { keywords: ["حديث", "سنة", "رواية", "البخاري", "مسلم"], reply: "السنة النبوية هي كل ما أُضيف إلى النبي صلى الله عليه وسلم من قول أو فعل أو تقرير أو صفة خلقة أو خلق." },
    { keywords: ["الأربعين النووية", "حديث شريف"], reply: "الأربعين النووية مجموعة مباركة من الأحاديث النبوية الشريفة التي تجمع جوامع الكلم للإمام النووي رحمه الله." },

    // قسم العقيدة والتوحيد
    { keywords: ["عقيدة", "توحيد", "إيمان", "الله"], reply: "العقيدة الإسلامية تقوم على توحيد الله سبحانه وتعالى بأسمائه وصفاته وربوبيته وألوهيته، والإيمان بأركان الإيمان الستة." },
    { keywords: ["أركان الإيمان", "الإيمان بالله"], reply: "أركان الإيمان ستة: أن تؤمن بالله وملائكته كتبه ورسله واليوم الآخر وتؤمن بالقدر خيره وشره." },
    { keywords: ["حسن الظن", "التوكل على الله"], reply: "حسن الظن بالله تعالى من كمال التوحيد، والتوكل يجمع بين الأخذ بالأسباب والاعتماد القلبي على الله." },

    // قسم العبادات (صلاة، طهارة، زكاة، صيام، حج)
    { keywords: ["صلاة", "صلي", "الصلوات", "أوقات الصلاة"], reply: "الصلاة هي عماد الدين، وهي الركن الثاني من أركان الإسلام بعد الشهادتين، فرضت خمس صلوات في اليوم والليلة." },
    { keywords: ["صلاة الليل", "تهجد", "وتر", "قيام"], reply: "قيام الليل وصلاة الوتر من أعظم الطاعات تقرباً لله تعالى، وشرف المؤمن قيامه بالليل." },
    { keywords: ["وضوء", "طهارة", "غسل", "نجاسة"], reply: "الطهارة شرط لصحة الصلاة، وتشمل الوضوء للأصغر، والغسل للأكبر، وإزالة النجاسة عن البدن والثوب والمكان." },
    { keywords: ["زكاة", "صدقة", "اموال", "نصاب"], reply: "الزكاة هي الركن الثالث من أركان الإسلام، وهي فريضة مالية تؤخذ من أغنياء المسلمين وترد على فقرائهم وفق ضوابطها الشرعية." },
    { keywords: ["صدقة جارية", "وقف", "عمل صالح"], reply: "الصدقة الجارية هي التي ينفع الله بها العبد بعد موته، كبناء مسجد أو حفر بئر أو علم ينتفع به." },
    { keywords: ["صيام", "رمضان", "صوم", "فطور"], reply: "الصيام هو الإمساك عن المفطرات من طلوع الفجر الصادق إلى غروب الشمس تعبداً لله تعالى، وهو الركن الرابع من أركان الإسلام." },
    { keywords: ["حج", "عمرة", "طواف", "سعي", "إحرام"], reply: "الحج هو الركن الخامس من أركان الإسلام لمن استطاع إليه سبيلاً، ويطوف الحاج بالبيت الحرام ويقف بعرفة." },
    { keywords: ["الاعتكاف", "العشر الأواخر"], reply: "الاعتكاف لزوم المسجد طاعةً لله تعالى، وهو سنة مؤكدة سيما في العشر الأواخر من شهر رمضان المبارك." },

    // قسم الأخلاق والآداب والرقائق
    { keywords: ["دعاء", "ذكر", "استغفار", "تسبيح"], reply: "الدعاء هو مخ العبادة، وأفضل الذكر لا إله إلا الله، وينبغي للمسلم ملازمة الاستغفار والأذكار اليومية الصباحية والمسائية." },
    { keywords: ["سيد الاستغفار"], reply: "سيد الاستغفار: اللهم أنت ربي لا إله إلا أنت خلقتني وأنا عبدك، ومن قالها موقناً بها مات فدخل الجنة." },
    { keywords: ["بر الوالدين", "أبناء", "صلة الرحم"], reply: "بر الوالدين وصلة الرحم من أعظم القربات إلى الله تعالى، وقرنهما الله سبحانه بتوحيده في مواضع كثيرة." },
    { keywords: ["أخلاق", "صدق", "أمانة", "صبر"], reply: "الأخلاق الحسنة والصدق والأمانة والوفاء بالعهد والصبر على الأقدار من سمات المؤمن الحق." },
    { keywords: ["توبة", "استغفار", "ذنب", "معصية"], reply: "التوبة النصوح تجب ما قبلها، وبابها مفتوح للمسلم طالما لم يغرغر أو تطلع الشمس من مغربها." },
    { keywords: ["الرضا", "القناعة"], reply: "القناعة كنز لا يفنى، والرضا بقضاء الله وقدره يورث طمأنينة القلب وراحة البال في السراء والضراء." },
    { keywords: ["غض البصر", "الحياء"], reply: "الحياء شُعبة من الإيمان، وغض البصر حفظ للفروج والقلوب من وساوس الشيطان." },
    { keywords: ["الإخلاص", "الرياء"], reply: "الإخلاص هو إفراد الله سبحانه وتعالى بالقصد في الطاعة، والرياء هو إبطال الأعمال بابتغاء مدح الناس." },
    { keywords: ["الحسد", "العين", "الرقية الشرعية"], reply: "الرقية الشرعية بالقرآن الكريم والأذكار الصحيحة هي الحصن الحصين من شر الحسد والعين والمس." },
    { keywords: ["شكر النعم", "الحمد"], reply: "شكر النعم يكون بالقلب تعظيماً، وباللسان حمداً وثثناءً، وبالجوارح طاعةً واستعمالاً فيما يرضي الله." },

    // قسم الفقه والمعاملات والسيرة
    { keywords: ["فقه", "حلال", "حرام", "فتوى"], reply: "علم الفقه يبين الأحكام العملية المكتسبة من أدلتها التفصيلية، ويميز الحلال عن الحرام في معاملات المسلم وعباداته." },
    { keywords: ["معاملات", "تجارة", "بيع", "ربا"], reply: "المعاملات المالية الإسلامية تقوم على أساس العدل وتحريم الربا والغرر والجهالة والغش." },
    { keywords: ["الكبائر", "الموبقات"], reply: "الكبائر كل ذنب عُدّ في الشريعة عظيماً وتوعد عليه الشارع بالعذاب أو اللعنة، وأعظمها الشرك بالله." },
    { keywords: ["سيرة", "نبي", "محمد", "غزوة", "هجرة"], reply: "السيرة النبوية العطرة تمثل التطبيق العملي لأحكام الإسلام، وتاريخ حياة النبي صلى الله عليه وسلم منذ ولادته وحتى وفاته." },
    { keywords: ["صحابة", "رضوان الله عليهم", "أبو بكر", "عمر"], reply: "الصحابة الكرام رضوان الله عليهم هم الرعيل الأول الذين حملوا راية الإسلام ونقلوا لنا الدين غضاً طرياً." },
    { keywords: ["صبر", "ابتلاء", "قضاء وقدر"], reply: "الابتلاء سنة من سنن الله في الكون، والمؤمن يؤمن بالقدر خيره وشره ويصبر عند البلاء ويشكر عند السراء." },

    // الرياضيات والعلوم الأساسية
    { keywords: ["رياضيات", "معادلة", "حساب", "جبر"], reply: "الرياضيات هي علم البنيات والكميات:\n• لحل المعادلات: نعزل المتغيرات في طرف والأعداد في الطرف الآخر.\n• أرسل مسألتك المحددة وسأحلها لك." }
];

function handleUserMessage(){
    const inputField = document.getElementById("message");
    const userText = inputField.value.trim();
    if(!userText) return;

    const welcomeScreen = document.getElementById("welcome");
    if(welcomeScreen) welcomeScreen.remove();

    appendMsg(userText, "user");
    inputField.value = "";

    setTimeout(() => {
        let finalReply = "";
        let lowerInput = userText.toLowerCase();
        let matched = false;

        // منع الصور والتصميم بدقة تامة
        if(lowerInput.includes("صورة") || lowerInput.includes("ارسم") || lowerInput.includes("image") || lowerInput.includes("photo") || lowerInput.includes("تعديل") || lowerInput.includes("تصميم") || lowerInput.includes("أنشئ") || lowerInput.includes("انشئ")){
            finalReply = "أنا نموذج ذكاء اصطناعي نصي من تطوير Alislamiah لايمكنني إنشاء صور وتعديلها إن كنت تريدني لكي أساعدك في مجال ما مرحباً غير هكذا لا يمكنني مساعدتك";
        } 
        else {
            // البحث الذكي في قاعدة المعرفة المكثفة
            for(let item of massiveKnowledgeBase){
                for(let kw of item.keywords){
                    if(lowerInput === kw || (lowerInput.includes(kw) && kw.length > 2)){
                        finalReply = item.reply;
                        matched = true;
                        break;
                    }
                }
                if(matched) break;
            }

            // حل الحسابات التلقائي
            if(!matched && isMathQuery(userText)){
                finalReply = solveMathProblem(userText);
                matched = true;
            }

            // الرفض الافتراضي الدقيق للمجالات الخارجية
            if(!matched){
                finalReply = `أنا نموذج ذكاء اصطناعي بإمكاني مساعدتك في المجالات (${supportedFieldsList}) لكنني لا أستطيع مساعدتك في هذا المجال.\n\nإن كنت تريد أن أساعدك في (${supportedFieldsList}) أهلا وسهلا، غير هذا لايمكنني مساعدتك.`;
            }
        }

        appendMsg(finalReply, "ai");
    }, 400);
}

function isMathQuery(text){
    return /\d/.test(text) || text.includes("+") || text.includes("-") || text.includes("*") || text.includes("/");
}

function solveMathProblem(text){
    try {
        let cleaned = text.replace(/[^\d\+\-\*\/\.\(\)]/g, '');
        if(cleaned.length > 0){
            let result = Function('"use strict";return (' + cleaned + ')')();
            if(!isNaN(result)){
                return `بناءً على معطيات مسألتك الحسابية:\n• النتيجة النهائية: ${result}`;
            }
        }
    } catch(e) {}
    return `تم تحليل المسألة، وتتطلب القواعد الرياضية للوصول للحل السليم.`;
}

function appendMsg(text, sender){
    const chatBox = document.getElementById("chat");
    const bubbleDiv = document.createElement("div");
    bubbleDiv.className = "message " + sender;
    bubbleDiv.textContent = text;
    chatBox.appendChild(bubbleDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById("message").addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        handleUserMessage();
    }
});
</script>

</body>
</html>
