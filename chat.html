<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alislamiah-AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{font-family:Arial,sans-serif;background:#060c16;color:#222;overflow:hidden;display:flex;flex-direction:column;}

.header{height:68px;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#833ab4,#c13584,#e1306c,#f77737);color:white;z-index:10;flex-shrink:0;}
.header-title{font-size:23px;font-weight:bold;}

.chat{flex:1;overflow-y:auto;padding:22px 14px;background:#060c16;}
.message{max-width:85%;padding:14px 17px;margin:13px auto;font-size:15px;line-height:1.8;border-radius:21px;word-wrap:break-word;white-space:pre-line;}
.user{margin-right:auto;margin-left:0;color:white;background:linear-gradient(135deg,#fa7e1e,#e1306c,#833ab4);border-bottom-right-radius:5px;}
.ai{margin-left:auto;margin-right:0;background:#ffffff;color:#202020;border-bottom-left-radius:5px;}

.welcome{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.welcome h1{font-size:32px;margin-bottom:8px;color:#fff;}
.welcome p{color:#888;font-size:15px;}

.input-area{height:82px;padding:13px 12px;background:#060c16;border-top:1px solid #17283e;flex-shrink:0;}
.input-box{width:100%;max-width:800px;margin:0 auto;height:55px;display:flex;align-items:center;border-radius:30px;background:#fff;padding:4px;}
textarea{flex:1;height:45px;resize:none;border:none;outline:none;background:transparent;padding:11px 16px;font-size:16px;color:#222;direction:rtl;}
.send{width:45px;height:45px;border:none;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,#833ab4,#e1306c);color:white;font-size:14px;font-weight:bold;flex-shrink:0;}
</style>
</head>
<body>

<div class="header">
    <div class="header-title">Alislamiah-AI</div>
</div>

<div class="chat" id="chat">
    <div class="welcome" id="welcome">
        <h1>Alislamiah-AI</h1>
        <p>كيف يمكنك مساعدتك؟</p>
    </div>
</div>

<div class="input-area">
    <div class="input-box">
        <textarea id="message" placeholder="اكتب سؤالك هنا..." rows="1"></textarea>
        <button class="send" id="sendBtn">إرسال</button>
    </div>
</div>

<script>
const smartKnowledge = [
    { roots: ["أحكام سجدتي السهو", "سجود السهو"], reply: "سجود السهو مشروع لجبر ما حصل في الصلاة من زيادة أو نقص، ويكون قبل السلام أو بعده." },
    { roots: ["أحكام سجود التلاوة", "سجدة القرآن"], reply: "يسجد القارئ والمستمع سجود التلاوة عند مروره بآية سجود، ويكبر لها دون تشهد أو تسليم." },
    { roots: ["أحكام سجود الشكر", "سجدة الشكر لله"], reply: "يسن سجود الشكر لله تعالى عند تجدد نعمة عظيمة أو اندفاع نقمة، وهو سجدة واحدة." },
    { roots: ["أحكام قصر الصلاة", "رخصة السفر"], reply: "يشرع للمسافر قصر الصلاة الرباعية إلى ركعتين، وجمع الظهر والعصر أو المغرب والعشاء." },
    { roots: ["أحكام صلاة الخوف", "كيفية صلاة الحرب"], reply: "تشرع صلاة الخوف في المعارك بكيفيات متعددة وردت في السنة النبوية لحفظ الأمن." },
    { roots: ["أحكام صلاة الجمعة", "التخلف عن الجمعة"], reply: "تجب صلاة الجمعة على كل مسلم بالغ عاقل مقيم، ومن تركها ثلاث جمع طبع الله على قلبه." },
    { roots: ["أحكام صلاة العيدين", "تكبيرات العيد"], reply: "صلاة العيدين سنة مؤكدة، ويُسن فيها التكبير الزائد والخطبة بعدها لإدخال الفرح." },
    { roots: ["أحكام صلاة الاستسقاء", "طلب الغيث"], reply: "تشرع صلاة الاستسقاء جماعة في المصلى عند احتضار المطر وتأخر الغيث مع التذلل والافتقار." },
    { roots: ["أحكام صلاة الكسوف والخسوف", "الفزع إلى الصلاة"], reply: "تستحب صلاة الكسوف والخسوف بركعتين في كل ركعة قيامان وركوعان وسجودان." },
    { roots: ["أحكام صلاة الجنازة", "التكبيرات الأربع"], reply: "صلاة الجنازة فرض كفاية، وأركانها أربع تكبيرات تقرأ فيها الفاتحة والصلاة والدعاء." },
    { roots: ["أحكام تغسيل الميت", "تجهيز الميت المسلم"], reply: "تغسيل الميت وتكفينه والصلاة عليه ودفنه فروض كفاية على المجتمع المسلم." },
    { roots: ["أحكام دفن الميت", "استقبال القبلة بالميت"], reply: "يُسن دفن الميت في لحد مقبرة المسلمين موجهاً لقبلة الكعبة على شقه الأيمن." },
    { roots: ["أحكام التعزية", "تسكين المصيبة"], reply: "تشرع التعزية لأهل الميت لتسلية مصيبتهم ودعوتهم للصبر والاحتساب دون إحداث مآتم." },
    { roots: ["أحكام زيارة القبور", "السلام عليكم دار قوم"], reply: "تشرع زيارة القبور للرجال والنساء للاتعاظ بالآخرة والدعاء للموتى بالسلام والمغفرة." },
    { roots: ["أحكام الصيام", "الإمساك عن الشهوات"], reply: "الصيام ركن من أركان الإسلام، وشروطه الإسلام والبلوغ والعقل والإقامة والصحة." },
    { roots: ["أحكام المفطرات", "مبطلات الصيام"], reply: "يبطل الصيام بالأكل والشرب عمداً والجماع والاستقاءة العمد ونزول دم الحيض والنفاس." },
    { roots: ["أحكام قضاء الصيام", "تتابع القضاء"], reply: "يجب قضاء الأيام المفطرة من رمضان قبل حلول رمضان التالي، ويجوز التفريق والتتابع." },
    { roots: ["أحكام فدية الصيام", "إطعام مسكين"], reply: "من عجز عن الصيام لكبر أو مرض مزمن لزمته الفدية بإطعام مسكين عن كل يوم أفطره." },
    { roots: ["أحكام صيام الحامل والمرضع", "خوف الحامل"], reply: "الحامل والمرضع إن خافتا على ولديهما أفطرتتا وقاضتا، وبعضهم أوجب مع القضاء الإطعام." },
    { roots: ["أحكام صيام التطوع", "صيام داود"], reply: "أفضل الصيام تطوعاً صيام يوم وإفطار يوم، وصيام الإثنين والخميس وثلاثة أيام من كل شهر." },
    { roots: ["أحكام الأيام البيض", "الثالث عشر والرابع عشر"], reply: "يُسن صيام الأيام البيض وهي الثالث عشر والرابع عشر والخامس عشر من كل شهر قَمَري." },
    { roots: ["أحكام زكاة الفطر", "صاع من طعام"], reply: "تجب زكاة الفطر على كل مسلم يملِك قوت يومه، ومقدارها صاع من تمر أو شعير أو طعام." },
    { roots: ["أحكام زكاة الأموال", "بلوغ النصاب"], reply: "تجب زكاة المال إذا بلغ النصاب الشرعي (قدر 85 جرام ذهب) وحال عليه الحول القمري." },
    { roots: ["أحكام زكاة الذهب والفضة", "نسبة الزكاة"], reply: "تجب الزكاة في الذهب والفضة والأوراق النقدية بنسبة ربع العشر (2.5 بالمئة)." },
    { roots: ["أحكام عروض التجارة", "تقويم البضائع"], reply: "تقوم عروض التجارة بسعر السوق وقت الحول، ويخرج منها 2.5 بالمئة زكاة مالية." },
    { roots: ["أحكام زكاة الزروع", "خمسة أوسق"], reply: "تجب زكاة الزروع والثمار فيما يكطال ويدخر إذا بلغ خمسة أوسق، ومقدارها العشر أو نصفه." },
    { roots: ["أحكام زكاة المعادن والركاز", "الركاز المدفون"], reply: "الركاز المستخرج من دفن الجاهلية فيه الخمس مباشرة، والمعادن فيها الزكاة بشروطها." },
    { roots: ["أحكام مصارف الزكاة", "إنما الصدقات للفقراء"], reply: "تُصرف الزكاة للأصناف الثمانية المذكورة في سورة التوبة كفقراء والمساكين." },
    { roots: ["أحكام الحج", "استطاعة السبيل"], reply: "الحج فرض على كل مسلم مستطيع في عمره مرة، وأركانه الإحرام والطواف والسعي والوقوف بعرفة." },
    { roots: ["أحكام العمرة", "العمرة كفارة"], reply: "العمرة سنة مؤكدة أو واجبة في العمر مرة، وتكفر ما بينها وبين العمرة الأخرى لمن أتمها." },
    { roots: ["أحكام الإحرام والميقات", "ميقات أهل الآفاق"], reply: "يجب الإحرام من الميقات المحدد لمن أراد الحج أو العمرة، ومن جاوزه بلا إحرام لزمه دم." },
    { roots: ["أحكام محظورات الإحرام", "لبس المخيط"], reply: "يحرم على المحرم لبس المخيط للرجل، وتغطية الرأس، وقص الأظافر، وحلق الشعر، والطيب." },
    { roots: ["أحكام طواف الإفاضة", "طواف الوداع"], reply: "طواف الإفاضة ركن من أركان الحج، وطواف الوداع واجب على الآفاقي قبل مغادرة مكة." },
    { roots: ["أحكام السعي", "الصفا والمروة"], reply: "يبدأ السعي من الصفا وينتهي بالمروة سبعة أشواط تامة بعد طواف صحيح في الحج أو العمرة." },
    { roots: ["أحكام الوقوف بعرفة", "المبيت بمزدلفة"], reply: "الوقوف بعرفة ركن الحج الأعظم، والمبيت بمزدلفة ومِنا من واجبات الحج اللازمة." },
    { roots: ["أحكام رمي الجمرات", "أيام التشريق"], reply: "يجب رمي الجمرات الثلاث أيام التشريق حصاة حصاة مع التكبير لقول النبي صلى الله عليه وسلم." },
    { roots: ["أحكام الأضحية والهدي", "شروط الأضحية"], reply: "الأضحية سنة مؤكدة لمن استطاع، ويشترط فيها السلامة والسن المعتبرة في الأنعام." },
    { roots: ["أحكام العقيقة", "شاة الغلام"], reply: "العقيقة سنة مؤكدة تذبح عن المولود يوم سابعه، شاتان عن الغلام وشاة عن الجارية." },
    { roots: ["أحكام البيع والشراء", "الإيجاب والقبول"], reply: "يقوم البيع على الإيجاب والقبول ورضا المتبايعين، وخلوه من الربا والغرر المحرم." },
    { roots: ["أحكام البيوع المحرمة", "الغرر والربا"], reply: "تحرم بيوع الغرر والمجهول والمعدوم والربا بأنواعه لما تسبب من أكل أموال الناس بالباطل." },
    { roots: ["أحكام الإجارة", "أعطوا الأجير أجره"], reply: "الإجارة عقد جائز على المنافع أو الأعمال بأعمال معلومة وأجور محددة غير مجهولة." },
    { roots: ["أحكام الشركة", "شركة العنان"], reply: "الشركة والمضاربة جائزتان لتنمية الأموال بالشروط الشرعية وتوزيع الأرباح بالاتفاق." },
    { roots: ["أحكام الرهن والكفالة", "توثيق الديون"], reply: "الرهن وثيقة بالدين لاستيفائه عند التعذر، والكفالة التزام بالنفس والضمان بالمال." },
    { roots: ["أحكام الوكالة", "التوكيل في الحقوق"], reply: "تجوز الوكالة في كل حق يقبل النيابة كالبيع والشراء والخصومة وقبض الديون." },
    { roots: ["أحكام اللقطة", "تعريف اللقطة سنة"], reply: "اللقطة تُعَرّف سنة كاملة، واللقيط نفس معصومة يجب رعايتها والإنفاق عليها." },
    { roots: ["أحكام الوقف", "حبس الأصل"], reply: "الوقف قربة عظيمة يحبس فيها الواقف أصل المال ويسپل منفعته في وجوه الخير والبر." },
    { roots: ["أحكام الميراث", "أصحاب الفروض"], reply: "الميراث نظام عادل يوزع التركة على أصحاب الفروض والعصبات بحسب الأنصباء القرآنية." },
    { roots: ["أحكام الوصية", "حدود الثلث"], reply: "تجوز الوصية لغير الوارث بحدود ثلث التركة فقط، ولا وصية لوارث إلا بإجازة الورثة." },
    { roots: ["أحكام النكاح", "إيجاب وقبول وولي"], reply: "يقوم النكاح الصحيح على الإيجاب والقبول، ووجود الولي، والشهود، وخلو الزوجين من الموانع." },
    { roots: ["أحكام الخلع والطلاق", "الفرقة بعوض"], reply: "الخلع فرقة بعوض تأخذه الزوجة لتباري به زوجها، والطلاق بائن والعدة تحصين للرحم." },
    { roots: ["أحكام الرضاع", "خمس رضعات"], reply: "يحرم من الرضاع ما يحرم من النسب بشرط خمس رضعات مشبعات في سن الحولين الأولين." },
    { roots: ["أحكام الحضانة", "حضانة الأم"], reply: "الأم أحق بحضانة طفلها ما لم تتزوج بأجنبي، وحقها يسقط بالزواج أو بوجود مانع شرعي." },
    { roots: ["أحكام الجنايات والقصاص", "النفس بالنفس"], reply: "الجنايات توجب القصاص في العمد، والدية والكفارة في الخطأ لحفظ دماء البشر." },
    { roots: ["أحكام الحدود الشرعية", "حد السرقة والزنا"], reply: "الحدود عقوبات مقدرة شرعاً لحفظ الدين والأعراض والأموال كحد السرقة والزنا." },
    { roots: ["أحكام التعزير", "عقوبات القاضي"], reply: "التعزير عقوبات غير مقدرة شرعاً يجتهد فيها ولي الأمر والقاضي لدفع الجرائم وحماية المجتمع." },
    { roots: ["أحكام الجهاد والهدنة", "معاهدات السلام"], reply: "يُشرع الجهاد للدفاع عن الدين، وتجوز الهدنة والعهود مع الكفار إذا وجدت مصلحة راجحة." },
    { roots: ["أحكام أهل الذمة", "حقوق غير المسلمين"], reply: "أهل الذمة لهم ما للمسلمين من حقوق الحماية والرعاية مقابل الجزية وحفظ النظام." },
    { roots: ["أحكام الآداب العامة", "حسن الخلق"], reply: "أمر الإسلام بححسن الخلق، والصدق، والأمانة، والوفاء، وحرم الكذب والغيبة والنميمة." },
    { roots: ["أحكام صلة الرحم", "بر الوالدين"], reply: "بر الوالدين وصلة الرحم من أعظم القربات الموجبة للجنة، وعقوقهما من أكبر الكبائر." },
    { roots: ["أحكام إكرام الجار والضيف", "حق الجار"], reply: "يجب كف الأذى عن الجار وإكرامه، وإكرام الضيف من خصال الإيمان والتقوى لله تعالى." },
    { roots: ["أحكام الرفق بالحيوان", "الرحمة بالبهائم"], reply: "أمر الإسلام بالإحسان للحيوان وحرم تعذيبه، وحث على غرس الأشجار وإماطة الأذى." },
    { roots: ["أحكام التوكل", "اليقين بالله"], reply: "التوكل الحق يجمع بين صدق الاعتماد على الله وفعل الأسباب، والرضا بالقدر يورث الطمأنينة." },
    { roots: ["أحكام الإخلاص", "العمل لله"], reply: "الإخلاص شرط لقبول الأعمال، والمراقبة استشعار نظر الله في السر والعلن دائماً وأبداً." },
    { roots: ["أحكام التوبة النصوح", "الندم توبة"], reply: "التوبة تجب ما قبلها، وشرائطها: الإقلاع عن الذنب، والندم، والعزم على عدم العودة." },
    { roots: ["أحكام ذكر الله", "استغفار ودعاء"], reply: "ذكر الله يجلو القلوب، والاستغفار يفتح الأقفال، والدعاء مخ العبادة وأعظم أسباب الإجابة." },
    { roots: ["أحكام قيام الليل", "شرف المؤمن"], reply: "قيام الليل دأب الصالحين ومطردة للداء عن الجسد، وأفضلها صلاة جوف الليل الآخر." },
    { roots: ["أحكام صيام التطوع المطلق", "صيام الهواجر"], reply: "يُسن صيام التطوع في الأيام الفاضلة كعاشوراء وعرفة وست شوال والاثنين والخميس." },
    { roots: ["أحكام الصدقة الخفية", "حتى لا تعلم يمينه"], reply: "الصدقة الخفية تطفئ غضب الرب، وتظل صاحبها في ظل عرشه يوم لا ظل إلا ظله." },
    { roots: ["أحكام الإصلاح", "إصلاح ذات البين"], reply: "إصلاح ذات البين أفضل من درجة الصيام والصلاة، وفساد ذات البين هي الحالقة." },
    { roots: ["أحكام كفالة اليتامى", "كافل اليتيم"], reply: "كافل اليتيم رفيق النبي صلى الله عليه وسلم في الجنة كهاتين وأشار بإصبعيه." },
    { roots: ["أحكام كف اللسان", "حصائد الألسنة"], reply: "حفظ اللسان من الغيبة والنميمة والبهتان من أعظم وسائل النجاة من عذاب النار." },
    { roots: ["أحكام ستر المسلم", "من ستر مسلماً"], reply: "من ستر مسلماً في الدنيا ستره الله في الدنيا والآخرة، والجزاء من جنس العمل." },
    { roots: ["أحكام الظلم", "إن الظلم ظلمات"], reply: "اتقوا الظلم فإن الظلم ظلمات يوم القيامة، وادعوا لنصرة المظلوم وردع الظالم." },
    { roots: ["أحكام الحسد", "الحسد يأكل الحسنات"], reply: "إياكم والحسد فإن الحسد يأكل الحسنات كما تأكل النار الحطب اليابس." },
    { roots: ["أحكام الكبر", "لا يدخل الجنة"], reply: "الكبر بطر الحق وغمط الناس، وهو مانع من قبول الحق ودخول الجنة مع الأتقياء." },
    { roots: ["أحكام الغيبة والنميمة", "أيحب أحدكم"], reply: "الغيبة والنميمة من الكبائر المحرمة التي تفسد المجتمعات وتورث عذاب القبر." },
    { roots: ["أحكام الرشوة والربا", "أكل أموال الناس بالباطل"], reply: "الرشوة والربا من أكبر الكبائر الموبقة المهلكة لصاحبها في الدنيا والآخرة." },
    { roots: ["أحكام السحر والكهانة", "أتى كاهناً"], reply: "من أتى كاهناً أو عرافاً فصدقه بما يقول فقد كفر بما أنزل على محمد صلى الله عليه وسلم." },
    { roots: ["أحكام شهادة الزور", "عدل شهادة الزور"], reply: "شهادة الزور من أكبر الكبائر المهلكة بعد الإشراك بالله وعقوق الوالدين." },
    { roots: ["أحكام اليمين الغموس", "اقتطاع مال المسلم"], reply: "اليمين الغموس هي التي يقتطع بها مال امرئ مسلم بغير حق، وتغمس صاحبها بالنار." },
    { roots: ["أحكام قطيعة الرحم", "لا يدخل الجنة قاطع"], reply: "لا يدخل الجنة قاطع رحم لحديث البخاري الصحيح، وصلتها تزيد في الأجل والرزق." },
    { roots: ["أحكام عقوق الوالدين", "أكبر الكبائر"], reply: "عقوق الوالدين من أكبر الكبائر المهلكة، وبرهما من أحب الأعمال إلى الله تعالى." },
    { roots: ["أحكام تشبه الجنسين", "المتشبهين بالنساء"], reply: "لعن النبي صلى الله عليه وسلم المتشبهين من الرجال بالنساء والمتشبهات بالرجال." },
    { roots: ["أحكام النياحة", "نياحة الجاهلية"], reply: "النياحة ورفع الصوت بالويل والثبور على الميت من أعمال الجاهلية المحرمة." },
    { roots: ["أحكام هجر المسلم", "فوق ثلاث ليال"], reply: "لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال وخيرهما يبدأ بالسلام." },
    { roots: ["أحكام الغضب", "لا تغضب"], reply: "ليس الشديد بالصرعة، بل الشديد الذي يملك نفسه عند الغضب، ولا تغضب ولك الجنة." },
    { roots: ["أحكام الرياء", "الشرك الأصغر"], reply: "أخوف ما أخاف عليكم الشرك الأصغر وهو الرياء الذي يحبط صالح الأعمال يوم القيامة." },
    { roots: ["أحكام الأمر بالمعروف", "تغيير المنكر"], reply: "تغيير المنكر باليد أو اللسان أو القلب من أصول الدين وإصلاح المجتمع المسلم." },
    { roots: ["أحكام النصيحة", "الدين النصيحة"], reply: "الدين النصيحة لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم بطلب الخير لهم." },
    { roots: ["أحكام بر الأصدقاء", "الوفاء بالعهد"], reply: "الوفاء بالعهد وحفظ ود الأصدقاء وصلة المودة من شيم الكرام الأبرار الصالحين." },
    { roots: ["أحكام إكرام الضيف", "جائزة الضيف"], reply: "إكرام الضيف يوم وليلة، والضيافة ثلاثة أيام، وما زاد فهو صدقة تؤجر عليها." },
    { roots: ["أحكام صلة الأرحام", "الصلة بالقطيعة"], reply: "ليس الواصل بالمكافئ، بل الواصل الذي إذا قطعت رحمه وصلها بالعفو والصفح." },
    { roots: ["أحكام الرفق بالخدم", "إخوانكم خولكم"], reply: "الرفق بالخدم والمماليك وإطعامهم مما تأكلون وتلبسون من توجيهات الإسلام السامية." },
    { roots: ["أحكام الرحمة بالصغير", "توقير الكبير"], reply: "توقير الكبير ورحمة الصغير من آداب الإسلام الرفيعة لحفظ تماسك المجتمع وأخلاقه." },
    { roots: ["أحكام الحلم والأناة", "الأناة من الله"], reply: "الحلم والأناة صفات نبيلة يحبها الله، والتعجل من الشيطان في تصريف الأمور." },
    { roots: ["أحكام الصبر الجميل", "فصبر جميل"], reply: "الصبر الجميل هو الذي لا شكوى فيه لغير الله، والرضا التام بالقدر المقدر بحكمة." },
    { roots: ["أحكام الرضا بقضاء الله", "أمر المؤمن كله خير"], reply: "عجباً لأمر المؤمن إن أمره كله خير، إن أصابته سرّاء شكر فكان خيراً له." },
    { roots: ["أحكام الزكاة التجارية", "زكاة التجارة"], reply: "تجب الزكاة في عروض التجارة إذا بلغت النصاب وحال عليها الحول، وتُقوّم بسعر السوق." },
    { roots: ["أحكام زكاة الحبوب", "نصاب الحبوب"], reply: "تجب زكاة الزروع والثمار فيما يكْتَال ويَدْخَر إذا بلغ النصاب، ومقدارها العشر أو نصفه." },
    { roots: ["أحكام الركاز والمعادن", "الركاز المدفون"], reply: "الركاز وهو دفن الجاهلية فيه الخمس مباشرة، والمعادن المستخرجة فيها الزكاة بشروطها." },
    { roots: ["أحكام صيام السفر", "الفطر في السفر"], reply: "يجوز للمسافر الفطر في رمضان وقضاء عدّة من أيام أخر، والصيام في السفر جائز." }
];

const chat = document.getElementById('chat');
const messageInput = document.getElementById('message');
const sendBtn = document.getElementById('sendBtn');
const welcome = document.getElementById('welcome');

function addMessage(text, sender) {
    if (welcome) welcome.style.display = 'none';
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function getBotReply(userText) {
    userText = userText.trim().toLowerCase();
    for (let item of smartKnowledge) {
        for (let root of item.roots) {
            if (userText.includes(root.toLowerCase())) {
                return item.reply;
            }
        }
    }
    return "عذراً، لم أتمكن من العثور على إجابة دقيقة لسؤالك في القاعدة المعرفية الحالية، يرجى إعادة صياغة السؤال.";
}

function handleSend() {
    const text = messageInput.value;
    if (!text.trim()) return;
    addMessage(text, 'user');
    messageInput.value = '';
    
    setTimeout(() => {
        const reply = getBotReply(text);
        addMessage(reply, 'ai');
    }, 400);
}

sendBtn.addEventListener('click', handleSend);
messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
    }
});
</script>
