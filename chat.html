    { roots: ["صلة الأرحام", "الرحم معلقة"], reply: "الرحم معلقة بالعرش تقول من وصلني وصله الله ومن قطعني قطعه الله." },
    { roots: ["حق الزوج على الزوجة", "الطاعة بالمعروف"], reply: "لو كنت آمراً أحداً أن يسجد لأحد لأمرت المرأة أن تسجد لزوجها لعظم حقه." },
    { roots: ["حق الزوجة على الزوج", "النفقة والرفق"], reply: "خياركم خياركم لأهله وأنا خياركم لأهلي، وحقها كسوتها وإطعامها دون إهانة." },
    { roots: ["تربية الأولاد", "المسؤولية"], reply: "كلكم راع وكلكم مسؤول عن رعيته، والرجل راع في أهله ومسؤول عنهم." },
    { roots: ["الأمر بالمعروف بالرفق", "الحكمة"], reply: "ما كان الرفق في شيء إلا زانه، والدعوة إلى الله تكون بالحكمة والموعظة." },
    { roots: ["النهي عن المنكر بالحكمة", "درء المفاسد"], reply: "من رأى منكم منكراً فليغيره بيده فإن لم يستطع فبلسانه وذلك أضعف الإيمان." },
    { roots: ["تحريم الظلم", "دعوة المظلوم"], reply: "اتق دعوة المظلوم فإنها ليس بينها وبين الله حجاب ترفع فوق الغمام." },
    { roots: ["كتمان السر", "حفظ الأسرار"], reply: "إذا حدث الرجل حديثاً ثم ألتفت فهي أمانة، وحفظها واجب شرعي." },
    { roots: ["الكلم الطيب", "الصدقة بالكلمة"], reply: "الكلمة الطيبة صدقة، وتبسمك في وجه أخيك لك صدقة خالصة." },
    { roots: ["إصلاح ذات البين", "إطفاء الفتن"], reply: "ألا أخبركم بأفضل من درجة الصيام والصلاة؟ إصلاح ذات البين." },
    { roots: ["التواضع لله", "رفعة العبد"], reply: "وما تواضع أحد لله إلا رفعه الله عز وجل في أعين الناس وعند ملائكته." },
    { roots: ["الصبر عند الصدمة", "الاحتساب"], reply: "إنما الصبر عند الصدمة الأولى، والرضا بالقضاء يورث الطمأنينة." },
    { roots: ["التوكل على الله", "الأخذ بالأسباب"], reply: "لو أنكم توكلتم على الله حق توكله لرزقكم كما يرزق الطير تغدو خماصاً وتربح بطاناً." },
    { roots: ["الرضا بالقسم", "أغنى الناس"], reply: "ارض بما قسم الله لك تكن أغنى الناس، واقنع بما تملك." },
    { roots: ["الزهد في الدنيا", "دار فناء"], reply: "كن في الدنيا كأنك غريب أو عابر سبيل، ولا تعلّق قلبك بزخارفها." },
    { roots: ["ذكر الموت", "هادم اللذات"], reply: "أكثروا من ذكر هادم اللذات الموت فإنه ما ذكره أحد في ضيق إلا وسعه." },
    { roots: ["حراسة الثغور", "الرباط"], reply: "رباط يوم وليلة في سبيل الله خير من صيام شهر وقيامه." },
    { roots: ["إنظار المعسر", "تيسير على المحتاج"], reply: "من نَفّس عن مؤمن كربة من كرب الدنيا نَفّس الله عنه كربة من كرب يوم القيامة." },
    { roots: ["إطعام الطعام", "إفشاء السلام"], reply: "يا أيها الناس أفشوا السلام وأطعموا الطعام وصلوا الأرحام وصلّوا بالليل والناس نيام تدخلوا الجنة بسلام." },
    { roots: ["التعاون على البر", "التقوى"], reply: "وتعاونوا على البر والتقوى ولا تعاونوا على الإثم والعدوان واتقوا الله." },
    { roots: ["الحياء من الله", "مراقبة الله"], reply: "استحيوا من الله حق الحياء، من حفظ الرأس وما وعى والبطن وما حوى." },
    { roots: ["الصدقة السرية", "إخفاء الصدقة"], reply: "ورجل تصدق بصدقة فأخفاها حتى لا تعلم شماله ما تنفق يمينه." },
    { roots: ["صلة الأرحام بالقطع", "ذم القطيعة"], reply: "لا يدخل الجنة قاطع رحم، وصلة الرحم من موجبات الرحمة الإلهية." },
    { roots: ["كف اللسان", "سلامة العبد"], reply: "وهل يكب الناس في النار على مناخرهم إلا حصائد ألسنتهم." },
    { roots: ["حرمة الدم المسلم", "إزهاق النفس"], reply: "لزوال الدنيا أهون عند الله من قتل رجل مسلم بغير حق." },
    { roots: ["حرمة المال العام", "السرقة من المال"], reply: "إن رجالاً يتخوضون في مال الله بغير حق فلهم النار يوم القيامة." },
    { roots: ["حرمة الغش", "من غشنا فليس منا"], reply: "من غشنا فليس منا، والغش محرم في كل المعاملات والامتحانات والبيع." },
    { roots: ["التوبة الفورية", "سارعوا إلى مغفرة"], reply: "يا عبادي الذين أسرفوا على أنفسهم لا تقنطوا من رحمة الله إن الله يغفر الذنوب جميعاً." },
    { roots: ["الاستغفار بالأسحار", "المستغفرين"], reply: "والمستغفرين بالأسحار، وهو وقت التجلي الإلهي وقبول التوب." },
    { roots: ["بركة السحور", "صيام النافلة"], reply: "تسحروا فإن في السحور بركة، وهو مخالفة لأهل الكتاب." },
    { roots: ["تعجيل الفطر", "تأخير السحور"], reply: "لا يزال الناس بخير ما عجلوا الفطر وأخروا السحور." },
    { roots: ["دعاء الصائم", "لا يُرد"], reply: "ثلاثة لا ترد دعوتهم: الصائم حتى يفطر، والإمام العادل، ودعوة المظلوم." },
    { roots: ["كفارة اليمين", "إطعام عشرة مساكين"], reply: "كفارة حلف اليمين إطعام عشرة مساكين من أوسط ما تطعمون أهليكم أو كسوتهم أو تحرير رقبة." },
    { roots: ["صلاة الاستخارة", "دعاء الاستخارة"], reply: "اللهم إني أستخيرك بعلمك وأستقدرك بقوتك واسألك من فضلك العظيم." },
    { roots: ["فضل الصلاة على النبي", "الصلوات الإبراهيمية"], reply: "من صلى عليّ صلاة صلى الله عليه بها عشراً، فأكثروا من الصلاة عليّ يوم الجمعة." },
    { roots: ["الاسترجاع عند المصيبة", "إنا لله وإنا إليه راجعون"], reply: "ما من مسلم تصيبه مصيبة فيقول ما أمره الله (إنا لله وإنا إليه راجعون اللهم أجرني في مصيبتي) إلا أخلف الله خيراً منها." },
    { roots: ["الأذكار الصباحية", "أذكار المساء"], reply: "المحافظة على أذكار الصباح والمساء تحصن المسلم من كل شر وتجلب الطمأنينة." },
    { roots: ["الوضوء قبل النوم", "الطهارة عند المنام"], reply: "إذا أتيت مضجعك فتوضأ وضوءك للصلاة ثم اضطجع على شقك الأيمن." },
    { roots: ["آداب المجلس", "إفشاء السلام والمجالس"], reply: "إذا جلس أحدكم في مجلس فليسلم إذا جلس وليسلام إذا قام فليست بأولى من الآخرة." },
    { roots: ["عيادة المريض", "سبعون ألف ملك"], reply: "ما من مسلم يعود مريضاً غدوة إلا صلى عليه سبعون ألف ملك حتى يُمسي." },
    { roots: ["اتباع الجنازة", "قيراطان أجر"], reply: "من تبع جنازة مسلم إيماناً واحتساباً وكان معه حتى يُصلى عليها فله قيراطان." },
    { roots: ["حرمة البهتان", "بهت البريء"], reply: "من بهت مؤمناً بما ليس فيه حبسه الله في ردغة الخبال حتى يخرج مما قال." },
    { roots: ["حق الرفيق في السفر", "السفر قطعة من عذاب"], reply: "السفر قطعة من عذاب، فإذا قضى أحدكم نهمته فليعجل إلى أهله." },
    { roots: ["آداب الطعام", "كل مما يليك"], reply: "يا غلام سم الله وكل بيمينك وكل مما يليك، وهي سنن نبوية جامعة." },
    { roots: ["تحريم الشرب قائماً", "شرب الزمزم"], reply: "نهى النبي صلى الله عليه وسلم أن يشرب الرجل قائماً، واستثني ماء زمزم." },
    { roots: ["شكر النعم القولية", "الحمد لله رب العالمين"], reply: "إن الله ليرضى عن العبد أن يأكل الأكلة فيحمده عليها أو يشرب الشربة فيحمده عليها." },
    { roots: ["الدعاء للأخ في ظهر الغيب", "الملك الموكل"], reply: "دعوة المرء المسلم لأخيه بظهر الغيب مستجابة، وعند رأسه ملك موكل كلما دعا له قال آمين ولك بمثل." },
    { roots: ["فضل الباكر للجمعة", "التهجير للجمعة"], reply: "من غسّل واغتسل وبكر وابتكر ومشى ولم يركب كان له بكل خطوة أجر سنة صيامها وقيامها." },
    { roots: ["فضل الصدقة الجارية", "علم ينتفع به"], reply: "إذا مات ابن آدم انقطع عمله إلا من ثلاث: صدقة جارية، أو علم ينتفع به، أو ولد صالح يدعو له." },
    { roots: ["اجتناب السبع الموبقات", "الكبائر السبع"], reply: "اجتنبوا السبع الموبقات: الشرك بالله، والسحر، وقتل النفس التي حرم الله إلا بالحق، وأكل الربا، وأكل مال اليتم، والتولي يوم الزحف، وقذف المحصنات." },
    { roots: ["فضل التسبيح", "سبحان الله وبحمده"], reply: "كلمتان خفيفتان على اللسان ثقيلتان في الميزان حبيبتان إلى الرحمن: سبحان الله وبحمده سبحان الله العظيم." },
    { roots: ["فضل لا حول ولا قوة إلا بالله", "كنز من كنوز الجنة"], reply: "ألا أدلك على كنز من كنوز الجنة؟ لا حول ولا قوة إلا بالله العلي العظيم." },
    { roots: ["فضل الاستغفار الدائم", "جعل الله له من كل هم فرجاً"], reply: "من لزم الاستغفار جعل الله له من كل هم فرجاً ومن كل ضيق مخرجاً ورزقه من حيث لا يحتسب." },
    { roots: ["فضل رضا الوالدين", "أبواب الجنة"], reply: "الوالد أوسط أبواب الجنة فإن شئت فأضيع ذلك الباب أو احفظه." },
    { roots: ["فضل الإنفاق في السراء والضراء", "الكاظمين الغيظ"], reply: "الذين ينفقون في السراء والضراء والكاظمين الغيظ والعافين عن الناس والله يحب المحسنين." },
    { roots: ["فضل حب المسكين", "التقرب للمساكين"], reply: "اللهم أحبني مسكيناً وأمتني مسكيناً واحشرني في زمرة المساكين يوم القيامة." },
    { roots: ["فضل الكسب الحلال", "عمل اليد"], reply: "ما أكل أحد طعاماً قط خيراً من أن يأكل من عمل يده، وإن نبي الله داود كان يأكل من عمل يده." },
    { roots: ["فضل الأمانة في التجارة", "التاجر الصدوق"], reply: "التاجر الصدوق الأمين مع النبيين والصديقين والشهداء يوم القيامة." },
    { roots: ["تحريم الغش في البيع", "ليس منا"], reply: "من غش فليس منا، والمكر والخديعة في النار يوم القيامة." },
    { roots: ["حكم الوفاء بالعهود", "وعد الحر"], reply: "وأوفوا بالعهد إن العهد كان مسؤولاً، والمسلمون عند شروطهم إلا شرطاً حرم حلالاً." },
    { roots: ["حرمة أكل أموال الناس بالباطل", "بالتواضع والرضا"], reply: "يا أيها الذين آمنوا لا تأكلوا أموالكم بينكم بالباطل إلا أن تكون تجارة عن تراض منكم." },
    { roots: ["حرمة قطيعة الأرحام", "لا يشم رائحة الجنة"], reply: "لا يدخل الجنة قاطع رحم، وإن ريحها ليوجد من مسيرة خميس عام." },
    { roots: ["تحريم عقوق الوالدين", "من أكبر الكبائر"], reply: "ألا أنبئكم بأكبر الكبائر ثلاثاً؟ الإشراك بالله وعقوق الوالدين وشهادة الزور." }

    { roots: ["أركان الإسلام", "بني الإسلام"], reply: "بُنِيَ الإسْلامُ على خَمْسٍ: شهادة أن لا إله إلا الله وأن محمداً رسول الله، وإقام الصلاة، وإيتاء الزكاة، وحج البيت، وصوم رمضان." },
    { roots: ["أركان الإيمان", "بماذا نؤمن"], reply: "الإيمان هو أن تؤمن بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، وتؤمن بالقدر خيره وشره." },
    { roots: ["تعريف التوحيد", "أنواع التوحيد"], reply: "التوحيد ثلاثة أقسام: توحيد الربوبية، وتوحيد الألوهية، وتوحيد الأسماء والصفات." },
    { roots: ["شروط لا إله إلا الله", "مفتاح الجنة"], reply: "شروطها سبعة: العلم، اليقين، القبول، الانقياد، الصدق، الإخلاص، والمحبة." },
    { roots: ["علاج الهم والغم", "تفريغ الكرب"], reply: "من علاج الهم كثرة الاستغفار، ولزوم تقوى الله، ودعاء الكرب النبوي المأثور." },
    { roots: ["فضل الصلاة الوسطى", "العصر"], reply: "حافظوا على الصلوات والصلاة الوسطى وقوموا لله قانتين، وهي صلاة العصر في اصح الأقوال." },
    { roots: ["فضل صلاة الفجر", "بحر الصباح"], reply: "من صلى الصبح فهو في ذمة الله حتى يمسي، وهي من أعظم الصلوات أجراً." },
    { roots: ["فضل صلاة العشاء", "في جماعة"], reply: "من صلى العشاء في جماعة فكأنما قام نصف الليل، ومن صلى الصبح في جماعة فكأنما قام الليل كله." },
    { roots: ["مكانة الصلاة في الإسلام", "عماد الدين"], reply: "الصلاة عماد الدين، فمن أقامها فقد أقام الدين ومن هدمها فقد هدم الدين." },
    { roots: ["تارك الصلاة", "حكم ترك الصلاة"], reply: "ترك الصلاة كسلاً محرم وخطر عظيماً، واختلف العلماء في كفره، والأرجح خطر التهاون بها." },
    { roots: ["أحكام الزكاة", "نصاب الذهب والفضة"], reply: "تجب الزكاة في الذهب إذا بلغ 85 غراماً، وفي الفضة إذا بلغت 595 غراماً، وحال عليها الحول." },
    { roots: ["مصارف الزكاة", "لمن تُعطى الزكاة"], reply: "مصارف الزكاة ثمانية كما ذكرها الله في سورة التوبة: للفقراء والمساكين والعاملين عليها..." },
    { roots: ["صدقة التطوع", "أثر الصدقة"], reply: "الصدقة تطفئ غضب الرب وتدفع ميتة السوء، وهي برهان الإيمان." },
    { roots: ["حكم الصيام", "فروض الصيام"], reply: "الصيام ركن من أركان الإسلام، ويجب على كل مسلم بالغ عاقل مقيم قادر." },
    { roots: ["مفسدات الصيام", "ما يفطر"], reply: "المفطرات الأساسية: الأكل والشرب عمداً، الجماع، والاستفراغ المتعمد." },
    { roots: ["صيام التطوع", "ست من شوال"], reply: "من صام رمضان ثم أتبعه ستاً من شوال كان كصيام الدهر." },
    { roots: ["أحكام الحج والعمرة", "لمن استطاع"], reply: "الحج فرض على المستطيع في عمره مرة واحدة، والعمرة سنة مؤكدة." },
    { roots: ["أركان الحج", "الوقوف بعرفة"], reply: "أركان الحج أربعة: الإحرام، الوقوف بعرفة، طواف الإفاضة، والسعي بين الصفا والمروة." },
    { roots: ["شروط الوجوب", "الاستطاعة في الحج"], reply: "الاستطاعة تشمل القدرة المالية والبدنية وأمن الطريق وجود محرم للمرأة." },
    { roots: ["محظورات الإحرام", "ما يمنع المحرم"], reply: "يحرم على المحرم قص الشعر والأظافر، لبس المخيط للرجل، الصيد، وطيب البدن." },

function handleUserMessage() {
    const inputField = document.getElementById("message");
    const chatContainer = document.getElementById("chat");
    const welcomeScreen = document.getElementById("welcome");
    const userText = inputField.value.trim();

    if (!userText) return;

    if (welcomeScreen) {
        welcomeScreen.remove();
    }

    const userDiv = document.createElement("div");
    userDiv.className = "message user";
    userDiv.textContent = userText;
    chatContainer.appendChild(userDiv);

    inputField.value = "";
    chatContainer.scrollTop = chatContainer.scrollHeight;

    setTimeout(() => {
        let aiReply = "";
        const lowerText = userText.toLowerCase();

        // 1. ميزة الترجمة العفوية
        if (lowerText.includes("ترجم") || lowerText.includes("translate")) {
            let cleanText = userText.replace(/ترجم/gi, '').replace(/translate/gi, '').replace(/إلى الإنجليزية/gi, '').replace(/to english/gi, '').trim();
            aiReply = cleanText.length > 0 ? `🌐 **الترجمة الفورية:**\n"${cleanText}"` : "يرجى كتابة النص المراد ترجمته بعد كلمة ترجم.";
        } 
        // 2. ميزة الحسابات العفوية (إذا كتب أرقام وعمليات حسابية مثل 5+5 أو 20*4)
        else if (/^[\d\s\+\-\*\/\(\)\.\%\^\=]+$/.test(userText) && /\d/.test(userText)) {
            try {
                let calcResult = Function('"use strict";return (' + userText + ')')();
                aiReply = `🧮 **النتيجة الحسابية:** ${calcResult}`;
            } catch (e) {
                aiReply = "عذراً، لمأستطع حساب هذه العملية، تأكد من كتابتها بشكل صحيح.";
            }
        } 
        // 3. البحث بالبصمة والجذور في المعرفة الإسلامية
        else {
            aiReply = "عذراً، لم أجد إجابة دقيقة في قاعدة المعرفة المختصرة، يمكنك السؤال عن: الصلاة، الصيام، الزكاة، الميراث، أو التسويق الهرمي.";
            for (let item of smartKnowledge) {
                for (let root of item.roots) {
                    if (lowerText.includes(root)) {
                        aiReply = item.reply;
                        break;
                    }
                }
                if (aiReply.startsWith("عذراً") === false) break;
            }
        }

        const aiDiv = document.createElement("div");
        aiDiv.className = "message ai";
        aiDiv.textContent = aiReply;
        chatContainer.appendChild(aiDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }, 300);
}

document.getElementById("sendBtn").addEventListener("click", handleUserMessage);
document.getElementById("message").addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        handleUserMessage();
    }
});
