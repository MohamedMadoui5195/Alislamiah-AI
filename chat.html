<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alislamiah AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #fafafa;
    color: #222;
    min-height: 100vh;
}

/* HEADER */
header {
    height: 65px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 10;
}

.logo {
    font-size: 22px;
    font-weight: bold;

    /* Instagram-like gradient */
    background: linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.status {
    font-size: 13px;
    color: #777;
}

/* CHAT */
#chat {
    padding: 90px 15px 100px;
    max-width: 900px;
    margin: auto;
}

/* BUBBLES */
.message {
    max-width: 78%;
    padding: 13px 16px;
    margin: 12px 0;
    border-radius: 20px;
    line-height: 1.7;
    font-size: 16px;

    /* منع أي حركة */
    animation: none !important;
    transition: none !important;
}

.user {
    margin-right: auto;

    background: linear-gradient(
        135deg,
        #833ab4,
        #e1306c,
        #f77737
    );

    color: white;
    border-bottom-right-radius: 5px;
}

.ai {
    margin-left: auto;

    background: white;
    color: #222;

    border: 1px solid #e5e5e5;

    box-shadow: 0 3px 12px rgba(0,0,0,0.07);

    border-bottom-left-radius: 5px;
}

/* INPUT AREA */
.input-area {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;

    background: white;
    border-top: 1px solid #ddd;

    padding: 12px;
}

.input-box {
    max-width: 900px;
    margin: auto;

    display: flex;
    gap: 8px;
}

textarea {
    flex: 1;

    resize: none;

    height: 50px;

    border: 1px solid #ddd;
    border-radius: 25px;

    padding: 13px 18px;

    font-size: 16px;
    outline: none;

    font-family: inherit;
}

textarea:focus {
    border-color: #c13584;
}

button {
    width: 50px;
    height: 50px;

    border: none;
    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #833ab4,
        #e1306c,
        #f77737
    );

    color: white;

    font-size: 20px;

    cursor: pointer;

    /* لا توجد حركة */
    animation: none !important;
    transition: none !important;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* WELCOME */
.welcome {
    text-align: center;
    margin-top: 100px;
    color: #777;
}

.welcome h1 {
    font-size: 30px;
    margin-bottom: 10px;

    background: linear-gradient(
        45deg,
        #833ab4,
        #e1306c,
        #f77737
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.welcome p {
    font-size: 15px;
}
</style>
</head>

<body>

<header>
    <div class="logo">Alislamiah AI</div>
    <div class="status" id="status">متصل</div>
</header>

<div id="chat">

    <div class="welcome" id="welcome">
        <h1>Alislamiah AI</h1>
        <p>مرحبًا بك، كيف يمكنني مساعدتك؟</p>
    </div>

</div>

<div class="input-area">

    <div class="input-box">

        <textarea
            id="message"
            placeholder="اكتب رسالتك..."
            onkeydown="handleKey(event)"
        ></textarea>

        <button id="sendButton" onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>

<script>

/* ==================================================
   إعدادات Alislamiah AI API
   ================================================== */

/* رابط API الخاص بك */
const API_URL = "YOUR_API_URL_HERE";

/* مفتاح API الخاص بك */
const API_KEY = "YOUR_API_KEY_HERE";

/* اسم النموذج */
const MODEL = "YOUR_MODEL_NAME";


/* ==================================================
   إرسال الرسالة
   ================================================== */

async function sendMessage() {

    const input = document.getElementById("message");
    const button = document.getElementById("sendButton");
    const status = document.getElementById("status");

    const message = input.value.trim();

    if (!message) return;

    /* إزالة الترحيب */
    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    /* عرض رسالة المستخدم */
    addMessage(message, "user");

    input.value = "";

    button.disabled = true;
    status.textContent = "يفكر...";

    try {

        /*
        إرسال الطلب إلى API الخاص بك
        */

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json",

                /*
                إذا كان API الخاص بك يستخدم API Key
                */

                "Authorization": "Bearer " + API_KEY
            },

            body: JSON.stringify({

                model: MODEL,

                message: message

            })

        });


        if (!response.ok) {

            throw new Error(
                "API Error: " + response.status
            );

        }


        const data = await response.json();


        /*
        هنا نقرأ إجابة الذكاء الاصطناعي

        غيّر اسم الخاصية إذا كان API الخاص بك
        يرجع الإجابة باسم مختلف.
        */

        const answer =
            data.answer ||
            data.response ||
            data.message ||
            data.content;


        if (!answer) {

            throw new Error(
                "لم يتم العثور على إجابة من API"
            );

        }


        /* عرض الإجابة */

        addMessage(answer, "ai");

        status.textContent = "متصل";


    } catch (error) {

        console.error(error);

        addMessage(
            "حدث خطأ أثناء الاتصال بـ Alislamiah AI. تأكد من إعدادات API.",
            "ai"
        );

        status.textContent = "خطأ في الاتصال";

    }


    button.disabled = false;

}


/* ==================================================
   إنشاء الفقاعات
   ================================================== */

function addMessage(text, type) {

    const chat = document.getElementById("chat");

    const bubble = document.createElement("div");

    bubble.className =
        "message " + type;

    /*
    textContent لحماية الصفحة من HTML
    */

    bubble.textContent = text;

    chat.appendChild(bubble);

    /*
    النزول إلى آخر رسالة
    */

    window.scrollTo(
        0,
        document.body.scrollHeight
    );

}


/* ==================================================
   إرسال بواسطة Enter
   ================================================== */

function handleKey(event) {

    /*
    Enter = إرسال
    Shift + Enter = سطر جديد
    */

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}

</script>

</body>
</html>
