<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alislamiah-AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,"Tahoma",sans-serif;
    background:#ffffff;
    color:#222;
    overflow:hidden;
}

/* =========================
   HEADER
========================= */

.header{
    height:68px;
    position:fixed;
    top:0;
    right:0;
    left:0;
    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        120deg,
        #833ab4 0%,
        #c13584 28%,
        #e1306c 52%,
        #fd1d1d 72%,
        #f77737 100%
    );

    color:white;
}

.header-title{
    font-size:23px;
    font-weight:bold;
    letter-spacing:.2px;
}

/* =========================
   CHAT
========================= */

.chat{
    position:absolute;
    top:68px;
    bottom:82px;
    right:0;
    left:0;

    overflow-y:auto;
    padding:22px 14px 25px;

    background:#ffffff;
}

/* إزالة شكل scrollbar المزعج */

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:#d62976;
    border-radius:10px;
}

/* =========================
   MESSAGES
========================= */

.message{
    max-width:82%;
    padding:14px 17px;
    margin:13px 0;

    font-size:16px;
    line-height:1.75;

    border-radius:21px;

    /* لا توجد أي حركة */
    animation:none !important;
    transition:none !important;

    word-wrap:break-word;
}

/* رسالة المستخدم */

.user{
    margin-right:auto;
    margin-left:0;

    color:white;

    background:linear-gradient(
        135deg,
        #feda75 0%,
        #fa7e1e 22%,
        #f56040 42%,
        #e1306c 65%,
        #c13584 82%,
        #833ab4 100%
    );

    border-bottom-right-radius:5px;

    box-shadow:
        0 5px 15px rgba(225,48,108,.20);
}

/* رسالة الذكاء الاصطناعي */

.ai{
    margin-left:auto;
    margin-right:0;

    background:#ffffff;

    color:#202020;

    border:2px solid transparent;

    background-image:
        linear-gradient(#ffffff,#ffffff),
        linear-gradient(
            135deg,
            #feda75,
            #fa7e1e,
            #e1306c,
            #c13584,
            #833ab4
        );

    background-origin:border-box;
    background-clip:padding-box,border-box;

    border-bottom-left-radius:5px;

    box-shadow:
        0 4px 16px rgba(131,58,180,.10);
}

/* =========================
   WELCOME
========================= */

.welcome{
    height:100%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
}

.welcome h1{
    font-size:32px;
    margin-bottom:8px;

    background:linear-gradient(
        90deg,
        #833ab4,
        #e1306c,
        #f77737
    );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;
}

.welcome p{
    color:#888;
    font-size:15px;
}

/* =========================
   INPUT
========================= */

.input-area{
    position:fixed;

    bottom:0;
    right:0;
    left:0;

    height:82px;

    padding:13px 12px;

    background:white;

    border-top:1px solid #eee;

    z-index:20;
}

.input-box{
    width:100%;
    height:55px;

    display:flex;
    align-items:center;

    border:2px solid transparent;

    border-radius:30px;

    background-image:
        linear-gradient(#fff,#fff),
        linear-gradient(
            90deg,
            #833ab4,
            #c13584,
            #e1306c,
            #fd1d1d,
            #f77737
        );

    background-origin:border-box;
    background-clip:padding-box,border-box;

    padding:4px;
}

/* حقل الكتابة */

textarea{
    flex:1;

    height:45px;

    resize:none;

    border:none;
    outline:none;

    background:transparent;

    padding:11px 16px;

    font-family:Arial,"Tahoma",sans-serif;

    font-size:16px;

    color:#222;

    direction:rtl;
}

textarea::placeholder{
    color:#aaa;
}

/* زر الإرسال */

.send{
    width:45px;
    height:45px;

    border:none;
    border-radius:50%;

    cursor:pointer;

    background:linear-gradient(
        135deg,
        #833ab4,
        #c13584,
        #e1306c,
        #f77737
    );

    color:white;

    font-size:15px;
    font-weight:bold;

    flex-shrink:0;

    /* ثابت */
    animation:none !important;
    transition:none !important;
}

.send:disabled{
    opacity:.55;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        height:62px;
    }

    .header-title{
        font-size:21px;
    }

    .chat{
        top:62px;
        bottom:78px;
        padding:18px 10px;
    }

    .message{
        max-width:86%;
        font-size:15.5px;
        padding:12px 15px;
    }

    .input-area{
        height:78px;
        padding:11px 9px;
    }

    .input-box{
        height:54px;
    }

    textarea{
        font-size:15px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">
    <div class="header-title">
        Alislamiah-AI
    </div>
</div>


<!-- CHAT -->

<div class="chat" id="chat">

    <div class="welcome" id="welcome">
        <h1>Alislamiah-AI</h1>
        <p>كيف يمكنني مساعدتك؟</p>
    </div>

</div>


<!-- INPUT -->

<div class="input-area">

    <div class="input-box">

        <textarea
            id="message"
            placeholder="اكتب رسالتك..."
            rows="1"
        ></textarea>

        <button
            class="send"
            id="sendButton"
            onclick="sendMessage()"
        >
            إرسال
        </button>

    </div>

</div>


<script>

/* =========================================
   إعدادات API
========================================= */

const API_URL = "YOUR_API_URL_HERE";

const API_KEY = "YOUR_API_KEY_HERE";

const MODEL = "YOUR_MODEL_NAME";


/* =========================================
   إرسال الرسالة
========================================= */

async function sendMessage(){

    const input =
        document.getElementById("message");

    const button =
        document.getElementById("sendButton");

    const text =
        input.value.trim();

    if(!text) return;


    /* حذف شاشة الترحيب */

    const welcome =
        document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }


    /* إضافة رسالة المستخدم */

    addMessage(text,"user");


    input.value="";

    button.disabled=true;


    try{

        const response =
            await fetch(API_URL,{

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer "+API_KEY
                },

                body:JSON.stringify({

                    model:MODEL,

                    message:text

                })

            });


        if(!response.ok){

            throw new Error(
                "API Error "+response.status
            );

        }


        const data =
            await response.json();


        /*
           يمكن تعديل هذه الخاصية
           حسب API الخاص بك لاحقًا
        */

        const answer =
            data.answer ||
            data.response ||
            data.message ||
            data.content;


        if(!answer){

            throw new Error(
                "API لم يرجع إجابة"
            );

        }


        /* إضافة إجابة AI */

        addMessage(answer,"ai");


    }catch(error){

        console.error(error);

        addMessage(
            "تعذر الاتصال بـ Alislamiah-AI حاليًا.",
            "ai"
        );

    }


    button.disabled=false;

}


/* =========================================
   إنشاء فقاعة
========================================= */

function addMessage(text,type){

    const chat =
        document.getElementById("chat");

    const bubble =
        document.createElement("div");

    bubble.className =
        "message "+type;

    bubble.textContent=text;

    chat.appendChild(bubble);


    /* الانتقال لآخر رسالة */

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================
   Enter للإرسال
   Shift + Enter = سطر جديد
========================================= */

document
.getElementById("message")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key==="Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>

</body>
</html>
