<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alislamiah-AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{font-family:Arial,sans-serif;background:#060c16;color:#222;overflow:hidden;}
.header{height:68px;position:fixed;top:0;right:0;left:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#833ab4,#c13584,#e1306c,#f77737);color:white;}
.header-title{font-size:23px;font-weight:bold;}
.chat{position:absolute;top:68px;bottom:82px;right:0;left:0;overflow-y:auto;padding:22px 14px;background:#060c16;}
.message{max-width:82%;padding:14px 17px;margin:13px 0;font-size:16px;line-height:1.75;border-radius:21px;word-wrap:break-word;}
.user{margin-right:auto;margin-left:0;color:white;background:linear-gradient(135deg,#fa7e1e,#e1306c,#833ab4);border-bottom-right-radius:5px;}
.ai{margin-left:auto;margin-right:0;background:#ffffff;color:#202020;border-bottom-left-radius:5px;}
.welcome{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.welcome h1{font-size:32px;margin-bottom:8px;color:#fff;}
.welcome p{color:#888;font-size:15px;}
.input-area{position:fixed;bottom:0;right:0;left:0;height:82px;padding:13px 12px;background:#060c16;border-top:1px solid #17283e;}
.input-box{width:100%;height:55px;display:flex;align-items:center;border-radius:30px;background:#fff;padding:4px;}
textarea{flex:1;height:45px;resize:none;border:none;outline:none;background:transparent;padding:11px 16px;font-size:16px;color:#222;direction:rtl;}
.send{width:45px;height:45px;border:none;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,#833ab4,#e1306c);color:white;font-size:15px;font-weight:bold;}
</style>
</head>
<body>

<div class="header">
    <div class="header-title">Alislamiah-AI</div>
</div>

<div class="chat" id="chat">
    <div class="welcome" id="welcome">
        <h1>Alislamiah-AI</h1>
        <p>كيف يمكنني مساعدتك؟</p>
    </div>
</div>

<div class="input-area">
    <div class="input-box">
        <textarea id="message" placeholder="اكتب سؤالك هنا..." rows="1"></textarea>
        <button class="send" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
// قاعدة البيانات الشاملة
const knowledgeBase = [
    { keywords: ["سلام", "مرحباً", "السلام", "اهلا", "حيّاك", "صباح", "مساء"], answer: "وعليكم السلام ورحمة الله وبركاته! أهلاً بك في منصة Alislamiah-AI." },
    { keywords: ["من أنت", "اسمك", "ما هو أنت"], answer: "أنا مساعد Alislamiah-AI الذكي المدمج لخدمة الزوار." },
    { keywords: ["كيف حالك", "شلونك", "أخبارك"], answer: "الحمد لله بخير ونعمة، كيف يمكنني مساعدتك اليوم؟" },
    { keywords: ["قرآن", "آية", "سورة", "تلاوة", "القرآن"], answer: "قال الله تعالى في محكم تنزيله: (وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ)." },
    { keywords: ["سورة البقرة", "البقرة"], answer: "سورة البقرة سنام القرآن وذروته، أخذها بركة وتركها حسرة." },
    { keywords: ["آية الكرسي"], answer: "قال الله تعالى: (اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...) وهي أعظم آية في كتاب الله." },
    { keywords: ["صلاة", "اوقات", "الصلوات", "الصلاة"], answer: "الصلاة عماد الدين، من أقامها فقد أقام الدين ومن هدمها فقد هدم الدين." },
    { keywords: ["صيام", "رمضان"], answer: "الصيام جُنة، وهو عبادة عظيمة تربي النفس على الصبر وتقوى الله." },
    { keywords: ["استغفار", "استغفر", "ذنب"], answer: "أستغفر الله العظيم وأتوب إليه. أكثر من الاستغفار ليجعل الله لك من كل هم فرجاً." },
    { keywords: ["دعاء", "ادعية"], answer: "أفضل الدعاء هو ما وافق خشوع القلب وحضوره." },
    { keywords: ["صبر", "ابتلاء", "هم"], answer: "اعلم أن مع العسر يسراً، وأن الصبر مفتاح الفرج." },
    { keywords: ["شكرا", "جزاك الله", "مشكور"], answer: "وجزاك خيراً وبارك فيك! يسعدني جداً تقديم المساعدة لك." },
    { keywords: ["مع السلامة", "وداعا"], answer: "في أمان الله ورعايته! ننتظر زيارتك القادمة." }
];

function sendMessage(){
    const input = document.getElementById("message");
    const text = input.value.trim();
    if(!text) return;

    const welcome = document.getElementById("welcome");
    if(welcome) welcome.remove();

    addMessage(text, "user");
    input.value = "";

    setTimeout(() => {
        let reply = "عذراً، لم أجد إجابة مطابقة في قاعدة البيانات.";
        for(let item of knowledgeBase){
            for(let kw of item.keywords){
                if(text.toLowerCase().includes(kw.toLowerCase())){
                    reply = item.answer;
                    break;
                }
            }
        }
        addMessage(reply, "ai");
    }, 200);
}

function addMessage(text, type){
    const chat = document.getElementById("chat");
    const bubble = document.createElement("div");
    bubble.className = "message " + type;
    bubble.textContent = text;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
}

document.getElementById("message").addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendMessage();
    }
});
</script>

</body>
</html>
