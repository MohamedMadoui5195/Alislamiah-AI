 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alislamiah-AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{font-family:Arial,sans-serif;background:#060c16;color:#222;overflow:hidden;display:flex;flex-direction:column;}

.header{height:68px;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#833ab4,#c13584,#e1306c,#f77737);color:white;z-index:10;flex-shrink:0;}
.header-title{font-size:23px;font-weight:bold;}

.chat{flex:1;overflow-y:auto;padding:22px 14px;background:#060c16;}
.message{max-width:85%;padding:14px 17px;margin:13px auto;font-size:15px;line-height:1.8;border-radius:21px;word-wrap:break-word;white-space:pre-line;}
.user{margin-right:auto;margin-left:0;color:white;background:linear-gradient(135deg,#fa7e1e,#e1306c,#833ab4);border-bottom-right-radius:5px;}
.ai{margin-left:auto;margin-right:0;background:#ffffff;color:#202020;border-bottom-left-radius:5px;}

.welcome{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.welcome h1{font-size:32px;margin-bottom:8px;color:#fff;}
.welcome p{color:#888;font-size:15px;}

.input-area{height:82px;padding:13px 12px;background:#060c16;border-top:1px solid #17283e;flex-shrink:0;}
.input-box{width:100%;max-width:800px;margin:0 auto;height:55px;display:flex;align-items:center;border-radius:30px;background:#fff;padding:4px;}
textarea{flex:1;height:45px;resize:none;border:none;outline:none;background:transparent;padding:11px 16px;font-size:16px;color:#222;direction:rtl;}
.send{width:45px;height:45px;border:none;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,#833ab4,#e1306c);color:white;font-size:14px;font-weight:bold;flex-shrink:0;}
</style>
</head>
<body>

<div class="header">
    <div class="header-title">Alislamiah-AI</div>
</div>

<div class="chat" id="chat">
    <div class="welcome" id="welcome">
        <h1>Alislamiah-AI</h1>
        <p>كيف يمكنني مساعدتك؟</p>
    </div>
</div>

<div class="input-area">
    <div class="input-box">
        <textarea id="message" placeholder="اكتب سؤالك أو اطلب ترجمة هنا..." rows="1"></textarea>
        <button class="send" id="sendBtn">إرسال</button>
    </div>
</div>

    { roots: ["دعاء", "ابتهال"], intent: "آداب وشروط إجابة الدعاء.", reply: "ادعوا الله وأنتم موقنون بالاستجابة، واعلموا أن الله لا يستجيب دعاء من قلب غافل لاهٍ." },
    { roots: ["قرآن", "تدبر القرآن"], intent: "فضل تدبر القرآن الكريم.", reply: "أفلا يتدبرون القرآن أم على قلوب أقفالها، وتدبر آيات الله يورث خشوع القلب وصلاح البصيرة." },
    { roots: ["مسجد", "بيوت الله"], intent: "آداب بناء المساجد ودخولها.", reply: "بيوت الله أذن الله أن ترفع ويذكر فيها اسمه، وتحية المسجد ركعتان قبل الجلوس." },
    { roots: ["أذان", "إجابة المؤذن"], intent: "فضل ترديد الأذان ودعائه.", reply: "من قال مثل ما يقول المؤذن دبر فراغه من قلبه دخل الجنة، ويُسن الصلاة على النبي بعده." },
    { roots: ["إمامة", "شروط الإمام"], intent: "أحكام إمامة الصلاة.", reply: "يؤم القوم أقرؤهم لكتاب الله، فإن كانوا في القراءة سواء فأعلمهم بالسنة." },
    { roots: ["صفوف", "تسوية الصفوف"], intent: "أهمية تسوية صفوف الصلاة.", reply: "سوا صفوفكم فإن تسوية الصفوف من إقامة الصلاة، ولا تختلفوا فيختلف قلوبكم." },
    { roots: ["خشوع", "طمأنينة الصلاة"], intent: "أهمية الخشوع في الصلاة.", reply: "قد أفلح المؤمنون الذين هم في صلاتهم خاشعون، والطمأنينة ركن أساسي لا تصح الصلاة بدونها." },
    { roots: ["سجود السهو", "سهو الصلاة"], intent: "أحكام سجود السهو.", reply: "سجود السهو مشروع لجبر النقص أو الزيادة غير العمدية في الصلاة، وهو سجدتان قبل السلام أو بعده." },
    { roots: ["سجود التلاوة", "آية سجدة"], intent: "أحكام سجود التلاوة والشكر.", reply: "إذا قرأ المسلم آية سجدة استحب له أن يسجد سجدة واحدة تلاوة ويكبر لها دون تشهد ولا تسليم." },
    { roots: ["قصر الصلاة", "جمع الصلاة للمسافر"], intent: "أحكام السفر الفقهية بدقة.", reply: "يباح للمسافر قصر الصلاة الرباعية والجمع بين الصلوات بمسافة تقارب واحد وثمانين كيلومتراً فأكثر." },
    { roots: ["حيض", "نفاس", "استحاضة"], intent: "أحكام الدماء الطبيعية للنساء.", reply: "الحيض دم طبيعي تكتفي فيه المرأة عن الصلاة والصيام حتى تطهر وتغتسل، والنفاس دم ولادة." },
    { roots: ["جنابة", "غسل الجنابة"], intent: "أحكام الطهارة الكبرى.", reply: "يجب الغسل بتعميم الماء على الجسد كله عند الجنابة والحيض والنفاس وخروج المني بشهوة." },
    { roots: ["تيمم", "فقد الماء"], intent: "أحكام التيمم والصعيد الطيب.", reply: "التيمم بديل طاهر عن الوضوء والغسل عند عدم وجود الماء أو العجز عن استعماله بمرض." },
    { roots: ["نجاسة", "إزالة النجاسة"], intent: "كيفية تطهير النجاسات.", reply: "تزال النجاسة عن البدن والثوب والمكان بغسلها بالماء الطهور حتى يزول أثرها وعينها." },
    { roots: ["صيام التطوع", "ايام الست"], intent: "صيام التطوع وفضله.", reply: "صيام ست من شوال بعد رمضان كصيام الدهر، وصيام عرفة يكفر السنة الماضية والباقية." },
    { roots: ["اعتکاف", "العشر الأواخر"], intent: "أحكام الاعتكاف في المسجد.", reply: "الاعتكاف سنة مؤكدة لا سيما في العشر الأواخر من رمضان للتفرغ لطاعة الله وابتغاء ليلة القدر." },
    { roots: ["عمرة", "محظورات الإحرام"], intent: "أحكام المحرم بالعمرة والحج.", reply: "يحرم على المحرم قص الشعر والأظافر ولبس المخيط للرجل والطيب وقتل الصيد وخاطبة النكاح." },
    { roots: ["هدي", "أضحية الهدي"], intent: "أحكام الهدي والفدية.", reply: "الهدي ما يهدى إلى الحرم تقرباً لله من أنعام، وفدية الأذى تكون لترك واجب أو فعل محظور." },
    { roots: ["جهاد النفس", "مجادلة"], intent: "جهاد النفس والهوى.", reply: "المجاهد من جاهد نفسه في طاعة الله، وجهاد الهوى هو أساس النصر الحقيقي وصلاح الباطن." },
    { roots: ["امرأة صالحة", "زوجة"], intent: "مواصفات الزوجة الصالحة.", reply: "الدنيا متاع وخير متاع الدنيا المرأة الصالحة التي إذا نظرت إليها سرتك وإذا أمرتها أطاعتك." },
    { roots: ["تربية الأبناء", "حق الأولاد"], intent: "مسؤولية تربية الأبناء.", reply: "مروا أبناءكم بالصلاة لسبع واضربوهم عليها لعشر وفرقوا بينهم في المضاجع." },
    { roots: ["صلة الرحم", "قطيعة الرحم"], intent: "عقوبة قطيعة الرحم وفضل صلتها.", reply: "لا يدخل الجنة قاطع رحم، وصلة الرحم تزيد في الرزق وتنسأ في الأثر وتصل العبد بالله." },
    { roots: ["حق الضيف", "الضيف"], intent: "إكرام الضيف في الإسلام.", reply: "من كان يؤمن بالله واليوم الآخر فليكرم ضيفه جائزته يوم وليلة وما زاد فهو صدقة." },
    { roots: ["حسن الخلق", "الأخلاق"], intent: "أهمية حسن الخلق.", reply: "إنما بعثت لأتمم مكارم الأخلاق، وما من شيء أثقل في ميزان المؤمن يوم القيامة من حسن الخلق." },
    { roots: ["ستر المسلم", "فضيحة"], intent: "فضل ستر عيوب الناس.", reply: "من ستر مسلماً ستره الله في الدنيا والآخرة، والتجسس وتتبع العورات محرم شرعاً." },
    { roots: ["كلمة طيبة", "صدقة"], intent: "فضل الكلمة الطيبة.", reply: "الكلمة الطيبة صدقة، وتبسمك في وجه أخيك لك صدقة، والقول الحسن يطفئ غضب الخصوم." },
    { roots: ["إصلاح ذات البين", "خصومة"], intent: "فضل الإصلاح بين المتخاصمين.", reply: "ألا أخبركم بأفضل من درجة الصيام والصلاة والصدقة؟ إصلاح ذات البين فإن فساد ذات البين هي الحالقة." },
    { roots: ["رفق بالحيوان", "رحمة بالبهائم"], intent: "الرفق بالحيوان في الإسلام.", reply: "دخلت امرأة النار في هرة حبستها، ودخل رجل الجنة في كلب سقاه لعطشه، فالرحمة عامة لكل حي." },
    { roots: ["نظافة", "طهارة البدن"], intent: "الحث على النظافة الشخصية.", reply: "التنظيف والتشطيط من سنن الفطرة كتقليم الأظافر ونتف الإبط وحلق العانة وقص الشارب." },
    { roots: ["اقتصاد في المعيشة", "إسراف"], intent: "النهي عن الإسراف والتبذير.", reply: "كلوا واشربوا ولا تسرفوا إنه لا يحب المسرفين، والاعتدال في المعيشة حفظ للمال." },
    { roots: ["حفظ اللسان", "الصمت"], intent: "أهمية حفظ اللسان وصمته.", reply: "من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت، وسلامة العبد في حفظ لسانه." },
    { roots: ["موعظة حسنة", "نصيحة"], intent: "آداب تقديم النصيحة.", reply: "الدين النصيحة، وتكون بالحكمة والموعظة الحسنة وبسر لا علانية لكي تقبل." },
    { roots: ["احتساب الأجر", "نية"], intent: "أهمية النية الخالصة.", reply: "إنما الأعمال بالنيات وإنما لكل امرئ ما نوى، والنية الصالحة تحول العادات العادية إلى عبادات." },
    { roots: ["صبر عند البلاء", "رضا بالقضاء"], intent: "الرضا بالقضاء والقدر.", reply: "عجباً لأمر المؤمن إن أمره كله له خير، إن أصابته سرّاء شكر فكان خيراً له، وإن أصابته ضراء صبر فكان خيراً له." },
    { roots: ["استغفار السحر", "الاستغفار بالأسحار"], intent: "فضل الاستغفار وقت السحر.", reply: "وبالأسحار هم يستغفرون، وهو وقت مبارك تنزل فيه الرحمات وتستجاب فيه الدعوات." },
    { roots: ["حفظ العهد", "الوفاء بالعهود"], intent: "وجوب الوفاء بالعهود والعقود.", reply: "وأوفوا بعهد الله إذا عاهدتم ولا تنقضوا الأيمان بعد توكيدها وقد جعلتم الله عليكم كفيلاً."
