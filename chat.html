<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alislamiah-AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{font-family:Arial,sans-serif;background:#060c16;color:#222;overflow:hidden;display:flex;flex-direction:column;}

.header{height:68px;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#833ab4,#c13584,#e1306c,#f77737);color:white;z-index:10;flex-shrink:0;}
.header-title{font-size:23px;font-weight:bold;}

.chat{flex:1;overflow-y:auto;padding:22px 14px;background:#060c16;}
.message{max-width:85%;padding:14px 17px;margin:13px auto;font-size:15px;line-height:1.8;border-radius:21px;word-wrap:break-word;white-space:pre-line;}
.user{margin-right:auto;margin-left:0;color:white;background:linear-gradient(135deg,#fa7e1e,#e1306c,#833ab4);border-bottom-right-radius:5px;}
.ai{margin-left:auto;margin-right:0;background:#ffffff;color:#202020;border-bottom-left-radius:5px;}

.welcome{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.welcome h1{font-size:32px;margin-bottom:8px;color:#fff;}
.welcome p{color:#888;font-size:15px;}

.input-area{height:82px;padding:13px 12px;background:#060c16;border-top:1px solid #17283e;flex-shrink:0;}
.input-box{width:100%;max-width:800px;margin:0 auto;height:55px;display:flex;align-items:center;border-radius:30px;background:#fff;padding:4px;}
textarea{flex:1;height:45px;resize:none;border:none;outline:none;background:transparent;padding:11px 16px;font-size:16px;color:#222;direction:rtl;}
.send{width:45px;height:45px;border:none;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,#833ab4,#e1306c);color:white;font-size:14px;font-weight:bold;flex-shrink:0;}
</style>
</head>
<body>

<div class="header">
    <div class="header-title">Alislamiah-AI</div>
</div>

<div class="chat" id="chat">
    <div class="welcome" id="welcome">
        <h1>Alislamiah-AI</h1>
        <p>مرحباً بك! أنا مساعدك الذكي، إسألني في الفقه، أو اطلب حساباً أو ترجمة.</p>
    </div>
</div>

<div class="input-area">
    <div class="input-box">
        <textarea id="message" placeholder="اكتب سؤالك، حساباً، أو ترجمة..." rows="1"></textarea>
        <button class="send" id="sendBtn">إرسال</button>
    </div>
</div>

<script>
// قاعدة جذور ذكية ومركزة لتغطية أهم المسائل دون إطالة
const smartKnowledge = [


    { roots: ["فضل صلاة الجماعة", "تفضيل صلاة الفذ"], reply: "صلاة الجماعة تفضل صلاة الفذ بخمس وعشرين درجة، وقيل بسبع وعشرين درجة." },
    { roots: ["أحكام الأذان والإقامة", "شعار الإسلام"], reply: "الأذان والإقامة فرض كفاية على الجماعات في الحضر، وهما إعلان بدخول وقت الصلاة ودعوة إليها." },
    { roots: ["ستر العورة في الصلاة", "شروط صحة الصلاة"], reply: "ستر العورة شرط أساسي لصحة الصلاة، وعورة الرجل ما بين السرة والركبة، وعورة المرأة البالغ كل بدنها ما عدا الوجه والكفين." },

    { roots: ["صلاة الكسوف والخسوف", "آيتان عظيمتان"], reply: "صلاة الكسوف والخسوف سنة مؤكدة جماعة، وتطال القراءة فيها والركوع والسجود." },
    { roots: ["أحكام الاستحاضة", "دم غير الحيض"], reply: "المستحاضة هي التي يرتفع عنها الدم حيضاً ويستمر نزوله لمرض، وعليها الوضوء لكل صلاة بعد دخول وقتها." },
    { roots: ["أحكام صلاة الجمعة", "فرض عين"], reply: "صلاة الجمعة فرض عين على كل مسلم بالغ عاقل مقيم صحيح، وتصلي ركعتين جهرياً بعد خطبتين." },
    { roots: ["آحكام صلاة العيدين", "تكبيرات العيد"], reply: "صلاة العيدين سنة مؤكدة، ويكبر في الأولى سبعاً وفي الثانية خمساً من غير أذان ولا إقامة." },
    { roots: ["فضل صيام ست شوال", "كصيام الدهر"], reply: "من صام رمضان ثم أتبعه ستاً من شوال كان كصيام الدهر كله تفضلاً من الله." },
    { roots: ["أحكام زكاة الفطر", "طُهرة للصائم"], reply: "تجب زكاة الفطر على كل مسلم يملك قوت يومه وليلته، وتخرج صاعاً من طعام قبل صلاة العيد." },
    { roots: ["أحكام هبة الوالد لولده", "العدل بين الأبناء"], reply: "يجب العدل بين الأبناء في العطايا والهبات، وتفضيل بعضهم بغير مبرر محرم شرعاً." },
    { roots: ["أحكام الوصية للوارث", "لا وصية لوارث"], reply: "لا تجوز الوصية لوارث إلا إذا أجازها بقية الورثة بعد موت الموصي." },
    { roots: ["أحكام الحضانة وسقوطها", "زواج الأم"], reply: "تسقط حضانة الأم لطفلها إذا تزوجت برجل أجنبي عن الطفل إلا برضا ولي الطفل الحقيقي." },
    { roots: ["أحكام الرضاع المحرم", "خمس رضعات"], reply: "يحرم من الرضاع ما يحرم من النسب، ويشترط خمس رضعات معلومات محرمات في الحولين الأولين." },
    { roots: ["أحكام النفقة الزوجية", "واجبة على الزوج"], reply: "النفقة الواجبة تشمل الطعام والكسوة والسكن والعلاج بالمعروف حسب إمكانيات الزوج." },
    { roots: ["أحكام النشوز", "تعالي الزوجة"], reply: "النشوز هو عصيان الزوجة زوجها فيما يجب لها فيه الطاعة، وعلاجه يبدأ بالنصح ثم الهجر ثم الضرب غير المبرح." },
    { roots: ["أحكام الخلع", "افتداء الزوجة"], reply: "الخلع فرقة بين الزوجين بعوض ترد به الزوجة المهر أو بعضه برضا زوجها والقاضي." },
    { roots: ["أحكام الظهار", "كفارة الظهار"], reply: "الظهار أن يقول الرجل لزوجته أنت عليّ كظهر أمي، وحكمه محرم وتجب فيه كفارة صيام شهرين متتابعين." },
    { roots: ["أحكام الإيلاء", "الامتناع عن الجماع"], reply: "الإيلاء حلف الزوج ألا يقرب زوجته فوق أربعة أشهر، وعليه الفيئة أو الطلاق." },
    { roots: ["أحكام اللعان", "تلاعن الزوجين"], reply: "اللععان اتهام الزوج زوجته بالزنا مع عدم البينة، فيحلف أربع شهادات بالله ويكفر الخامسة." },
    { roots: ["أحكام اليمين المنعقدة", "كفارة اليمين"], reply: "من حلف على أمر في المستقبل وحنث فيه تجب عليه كفارة إطعام عشرة مساكين أو كسوتهم." },
    { roots: ["أحكام النذر المعلق", "الوفاء بالنذر"], reply: "من نذر طاعة لله وجب عليه الوفاء بها، ومن نذر معصية حرم عليه الوفاء وكفر كفارة يمين." },
    { roots: ["أحكام اللقطة واللقيط", "حفظ حقوق العباد"], reply: "اللقيط طمطم منبوذ يجب حفظه وكفالته، واللقطة مال ضائع يُعرف سنة كاملة قبل تملكه." },
    { roots: ["أحكام الأوقاف الخيرية", "صدقة جارية"],ق: "الوقف حبس الأصل وتسبيل المنفعة، وهو صدقة جارية يبقى أجرها حتى بعد موت الواقف." },
    { roots: ["أحكام الهبة والهدية", "تثبت المحبة"], reply: "الهبة تمليك المال في الحياة بلا عوض، وتجوز بين الأحياء وتلزم بالقبض." },
    { roots: ["أحكام العارية", "رد الماعون"], reply: "العارية استعارة عين الانتفاع بها وردها لصاحبها بعد الاستعمال، وضمانها على المستعير." },
    { roots: ["أحكام الوديعة", "رد الأمانات"], reply: "الوديعة مال يحفظه الإنسان لأخيه أمانة، ولا ضمان على الأمين إلا بالتعدي أو التفريط." },
    { roots: ["أحكام الغصب والتعدي", "رد المغصوب"], reply: "الغصب أخذ مال الغير ظُلماً وعدواناً، ويجب رد العين المغصوبة وضمان نقصها وتلفها." },
    { roots: ["أحكام الشفعة في العقار", "أولى بالشفعة"], reply: "الشفعة حق تملك العقار المبيع بثمنه لمن كان شريكاً فيه لدفع الضرر." },
    { roots: ["أحكام القسمة في الأموال", "قسمة التراضي"], reply: "قسمة الأموال المشتركة إما قسمة تراضي أو قسمة إجبار بمعرفة القاضي وأهل الخبرة." },
    { roots: ["أحكام إحياء الموات", "من أحيى أرضاً"], reply: "من أحيى أرضاً ميتة ليست لمسلم ولا معاهد فهي له ملكاً بإذن ولي الأمر." },
    { roots: ["أحكام صيد الحيوان", "التسمية عند الرمي"], reply: "يحل صيد الحيوان البري المباح بآلة حادة أو كلب معلم مع التسمية عند الإرسال." },
    { roots: ["أحكام اللباس والزينة", "كشف العورة"], reply: "يجبستر العورة وتحرم التشبه بالنساء للرجال وبالعكس، ويكره لبس الشهرة." },
    { roots: ["أحكام التصوير الفوتوغرافي", "خلاف العلماء"], reply: "أجاز أكثر علماء العصر التصوير الفوتوغرافي لحاجة التوثيق والتعريف لخلوه من المضاهاة." },
    { roots: ["أحكام التهنئة بالأعياد", "تبادل التهاني"], reply: "تجوز التهنئة بالأعياد والمناسبات الشرعية بالعبارات الطيبة التي لا محرم فيها." },

    { roots: ["أحكام عيادة المريض", "حق المسلم"], reply: "عيادة المريض حق مستحب ومؤكد، وفيه أجر عظيم وخوض في الرحمة حتى يرجع." },
    { roots: ["أحكام اتباع الجنائز", "حق الميت"], reply: "اتّباع الجنائز حتى تدفن من حقوق المسلم على المسلم، وفيه قيراطان من الأجر." },

    { roots: ["أحكام زيارة القبور", "تذكر الآخرة"], reply: "زيارة القبور مستحبة للرجال والنساء للاتعاظ وتذكر الآخرة والدعاء للأموات." },
    { roots: ["أحكام الاستغفار للأموات", "ينتفعون به"], reply: "يشرع الدعاء والاستغفار للأموات المسلمين، وينتفع الميت بدعاء ولده الصالح والصدقة عنه." },

    { roots: ["أحكام السحر والشعوذة", "كفر مبين"], reply: "السحر حرام شرعاً وهو من الكبائر المهلكة، وتعلمه وتطبيقه كفر بالله العظيم." },

    { roots: ["أحكام حلف اليمين", "لا تحلفوا إلا بالله"], reply: "يحرم الحلف بغير الله كالآباء والأجداد والأمانة، لأن الحلف بغير الله شرك." },
    { roots: ["أحكام الوفاء بالنذر", "أداء الأمانة"], reply: "يجب الوفاء بالنذر إذا كان طاعة لله، ولا يجوز الوفاء به إذا كان معصية." },
    { roots: ["أحكام التوبة النصوح", "ندم واستغفار"], reply: "التوبة النصوح واجبة من كل ذنب، وشروطها الندم، والإقلاع، والعزم على عدم العودة." },

    { roots: ["أحكام النميمة والفتنة", "نقل الكلام"], reply: "النميمة نقل كلام الناس للإفساد بينهم، وهي من الكبائر التي تمنع دخول الجنة." },
    { roots: ["أحكام البغض والحسد", "سلامة الصدر"], reply: "الحسد يتمنى زنع النعمة عن الغير، وهو مرض قلبي يأكل الحسنات كما تأكل النار الحطب." },
    { roots: ["أحكام الكبر والخيلاء", "بطر الحق"], reply: "الكبر بطر الحق وغمط الناس، وصاحبه لا يدخل الجنة ولو كان في قلبه مثقَالَ ذرة." },

    { roots: ["أحكام الرضا بالقضاء", "درجة الصابرين"], reply: "الرضا بالقضاء والقدر يورث طمأنينة القلب وانشراح الصدر ونيل الدرجات العالية." },
    { roots: ["أحكام شكر النعم", "المزيد من الخير"], reply: "شكر النعم يكون بالقلب اعترافاً، وباللسان حمداً، وبالجوارح طاعة واستعمالاً في المرضاة." },
    { roots: ["أحكام الصبر الجميل", "بغير جزع"], reply: "الصبر الجميل هو الذي لا شكوى فيه لغير الله ولا جزع ولا تسخط على القدر." },
    { roots: ["أحكام الخوف والرجاء", "جناحان للمؤمن"], reply: "المؤمن يسير إلى الله بين خوف من عقابه ورجاء لرحمته كالجائر للطائر." },

    { roots: ["أحكام الخلفاء الراشدين", "منهاج النبوة"], reply: "خلافة الراشدين الأربعة امتداد لمنهاج النبوة في العدل والشورى وإقامة الحق." },

    { roots: ["أحكام الفتوى وضوابطها", "لا تفت بغير علم"], reply: "الفتوى خطيرة وتوقيع عن رب العالمين، ويحرم الإفتاء بغير علم أو هوى." },
    { roots: ["أحكام الخلاف الفقهي", "سعة الفقه الإسلامي"], reply: "الخلاف الفقهي السائغ المبني على الدليل المعتبر لا ينكر فيه على المخطئ المجتهد." },
    { roots: ["أحكام الضرورات الفقهية", "المحظورات تبيحها"], reply: "الضرورات تبيح المحظورات بشرط تقديرها بقدرها وعدم مجاوزة الحد." },
    { roots: ["أحكام العرف والعادة", "معتبرة شرعاً"], reply: "العرف المعتبر هو ما استقر في النفوس وتلقته الطبائع بالقبول ولم يخالف الشرع." },
    { roots: ["أحكام الاستصحاب", "بقاء ما كان على ما كان"], reply: "الاستصحاب أصل فقهي عظيم يقضي ببقاء الأحكام والصفات حتى يثبت ما يغيرها." },
    { roots: ["أحكام المصالح المرسلة", "جلب المنافع"], reply: "المصالح المرسلة ما شرع لحفظ مصالح العباد بلا نص معين ولا إلغاء صريح." },
    { roots: ["أحكام سد الذرائع", "منع وسائل الفساد"], reply: "سد الذرائع أصل يقضي بمنع الفعل الجائز إذا كان يؤدي إلى مفسدة محققة." },
    { roots: ["أحكام الاستحسان", "العدول عن الدليل"], reply: "الاستحسان عدول المجتهد عن حكم كلي إلى حكم استثنائي لدليل أقوى." },
    { roots: ["أحكام مقاصد الشريعة", "الكليات الخمس"], reply: "مقاصد الشريعة حفظ الدين والنفس والعقل والنسل والمال." },
    { roots: ["أحكام التيسير ورفع الحرج", "ما جعل عليكم في الدين من حرج"], reply: "الشريعة الإسلامية مبنية على التيسير ورفع الحرج والمشقة عن المكلفين." },
    { roots: ["أحكام التدرج في التشريع", "حكمة بالغة"], reply: "التدرج في التشريع سياسة حكيمة اتبعتها الشريعة لترسيخ العقيدة والأحكام في النفوس." },
    { roots: ["أحكام حفظ البيئة", "إعمار الأرض"], reply: "أمر الإسلام بحفظ البيئة وعدم الإفساد فيها وغراس الأشجار والرفق بالحيوان." },
    { roots: ["أحكام النظافة الشخصية", "شطر الإيمان"], reply: "النظافة والطهارة من الإيمان، وحث الإسلام على تقليم الأظافر وحلق العانة ونتف الإبط." },
    { roots: ["أحكام آداب الطعام والشراب", "التسمية واليمين"], reply: "يستحب التسمية قبل الطعام والأكل باليمين ومما يليك، والحمد بعد الفراغ." },
    { roots: ["أحكام آداب النوم", "الوضوء والاضطجاع"], reply: "يُسن الوضوء قبل النوم والاضطجاع على الشق الأيمن وقراءة أيات الحفظ والمعوذتين." },
    { roots: ["أحكام آداب السفر", "دعاء الركوب"], reply: "يُسن توديع الأهل، ودعاء الركوب، وتكبير السفر، وجمع الصلاة عند المشقة." },
    { roots: ["أحكام آداب المجالس", "عدم إقامة الجالس"], reply: "يحرم إقامة الجالس ليجلس مكانه، ويُسن كفارة المجلس وختمه بالاستغفار والتسبيح." },
    { roots: ["أحكام آداب المزاح", "الصدق في المزاح"], reply: "يجوز المزاح الهادف بشرط خلوه من الكذب أو ترويع المسلمين أو الاستهزاء بهم." },
    { roots: ["أحكام آداب اللباس", "التستر الكامل"], reply: "يجبستر العورة بلباس واسع غير شفاف ولا يصف البشرة ولا يشبه لباس الجنس الآخر." },
    { roots: ["أحكام آداب الكلام", "قل خيراً أو اصمت"], reply: "يجب حفظ اللسان عن الكذب والغيبة والنميمة، ولا يتكلم المسلم إلا بخير." },
    { roots: ["أحكام آداب البيع والشراء", "الصدق والأمانة"], reply: "يُسن للمسلم السماحة في البيع والشراء وعدم الحلف الكاذب لإذاعة السلعة." },
    { roots: ["أحكام آداب الجوار", "إحسان الجوار"], reply: "يجب كف الأذى عن الجار وإحسان معاملته، والتحذير الشديد من إزعاجه." }
    { roots: ["أحكام الزكاة في العروض التجارية", "زكاة التجارة"], reply: "تجب الزكاة في عروض التجارة إذا بلغت النصاب وحال عليها الحول، وتُقوّم بسعر السوق وقت وجوبها." },
    { roots: ["أحكام زكاة الزروع والثمار", "نصاب الحبوب"], reply: "تجب زكاة الزروع والثمار فيما يكْتَال ويَدْخَر إذا بلغ النصاب وهو خمسة أوسق، ومقدارها العشر أو نصف العشر بحسب السقي." },
    { roots: ["أحكام زكاة المعادن والركاز", "الركاز المدفون"], reply: "الركاز وهو دفن الجاهلية فيه الخمس مباشرة، والمعادن المستخرجة من الأرض فيها الزكاة بحسب شروطها." },
    { roots: ["أحكام صيام التطوع في السفر", "الفطر في السفر"], reply: "يجوز للمسافر الفطر في رمضان وقضاء عدّة من أيام أخر، والصيام في السفر جائز لمن لم يضره." },
    { roots: ["أحكام صيام الحائض والنفساء", "قضاء الصيام ولا الصلاة"], reply: "تقضي الحائض والنفساء صيام الأيام التي أفطرنها في رمضان، ولا تقضي الصلاة تسبيحاً للتخفيف." },
    { roots: ["أحكام المعتكف في المسجد", "شروط الاعتكاف"], reply: "يشترط لصحة الاعتكاف كونه في مسجد تقام فيه الجماعة، والخروج إلا لحاجة الإنسان محبط له." },
    { roots: ["أحكام الهدي والأضحية والاضحية", "سنان الأنعام"], reply: "يشترط في سن الأضحية والهدي أن تكون ثنية في الإبل والبقر، وجذعة في الضأن، وتنيّة في المعز." },
    { roots: ["أحكام صيد البحر", "حل الميتة البحرية"], reply: "أحل لكم صيد البحر طعامه متاعاً لكم وللسيارة، وميتة البحر كلها حلال طيبة لا تحتاج إلى ذكاة." },
    { roots: ["أحكام ذبح الأخرس", "التسمية بالإشارة"], reply: "تصح ذكاة الأخرس بالإشارة المفهمة واسم الله القلبي أو المكتوب إن عجز عن النطق." },
    { roots: ["أحكام الأكل من ذبائح أهل الكتاب", "طعامهم حل لكم"], reply: "طعام أهل الكتاب من اليهود والنصارى حلال للمسلمين بشرط أن تكون ذبحت بالطريقة الشرعية." },
    { roots: ["أحكام الميتة في حالة الاضطرار", "أكل الميتة للمضطر"], reply: "يجوز أكل الميتة للمضطر الذي خاش الهلكة بقدر ما يسد رمقه ويحفظ حياته دون تظلّم ولا عادٍ." },
    { roots: ["أحكام الاستنجاء والاستجمار", "طهارة المحل"], reply: "يجب الاستنجاء بالماء أو الاستجمار بثلاثة أحجار فأكثر لطهارة مخرج الحدث الأصغر." },
    { roots: ["أحكام مس المصحف بلا طهارة", "طهارة الحامل"], reply: "الأرجح أنه لا يمس القرآن إلا طاهر، ويجوز للجنب والحائض القراءة من حفظهما بلا مس مباشر." },
    { roots: ["أحكام قضاء الصوائت الفائتة", "الصلوات الفائتة"], reply: "من فابته صلاة نسيانًا أو نومًا فليصلها إذا ذكرها، ومن تركه متعمداً فعليه التوبة والقضاء الفوري." },
    { roots: ["أحكام سجود التلاوة", "سجود آيات القرآن"], reply: "سجود التلاوة سنة مؤكدة عند مرور القارئ أو المستمع بآية سجخة، ويكبر له بلا تشهد ولا تسليم." },
    { roots: ["أحكام سجود الشكر", "شكراً لله"], reply: "يسن سجود الشكر عند تجدد نعمة عظيمة أو اندلاع نقمة، وهو سجدة واحدة كشكر سليمان عليه السلام." },
    { roots: ["أحكام صلاة المسافر", "قصر الصلاة"], reply: "يُشرع للمسافر قصر الصلاة الرباعية إلى ركعتين، وجمع الظهر والعصر أو المغرب والعشاء لحاجة السفر." },
    { roots: ["أحكام صلاة الخوف", "كيفية صلاة الحرب"], reply: "تشرع صلاة الخوف في المعارك بكيفيات متعددة وردت في السنة النبوية لحفظ الأمن والصلوات." },
    { roots: ["أحكام التيمم لفاقد الماء والتراب", "فاقد الطهورين"], reply: "من لم يجد الماء ولا التراب الطاهر صلى على حسب حاله لحرمة الوقت ولا إعادة عليه." },
    { roots: ["أحكام إمامة المرأة للنساء", "جواز إمامة النساء"], reply: "تجوز إمامة المرأة للنساء في الصلاة بشرط أن تقف وسطهن ولا تتقدمهن كإمام الرجال." },
    { roots: ["أحكام الصلاة خلف الفاسق", "صحة الصلاة وكرامتها"], reply: "تصح الصلاة خلف الإمام الفاسق أو المبتدع ما لم تكن بدعته مكفرة، وتكره الكراهة التنزيهية." },
    { roots: ["أحكام السترة للمصلي", "منع المار أمام المصلي"], reply: "يُسن للمصلي أن يتخذ سترة يصلي إليها تمنع مرور المارّة بين يديه، ويشرع رد المار." },
    { roots: ["أحكام كشف الذراعين والساقين", "عورة المصلي"], reply: "يجب تغطية العورة كاملة في الصلاة، وكشف عورة الرجل المغلظة تبطل صلاته باتفاق." },
    { roots: ["أحكام بطلان الصلاة بالكلام", "تحريم الكلام في الصلاة"], reply: "يبطل الصلاة الكلام العمد المتعمد لغير مصالحها، أما الكلام نسياناً فلا يبطلها إن قلّ." },
    { roots: ["أحكام الالتفت في الصلاة", "خلسة الشيطان"], reply: "الالتفات بالوجه في الصلاة مكروه وهو اختلاس يختلسه الشيطان من صلاة العبد." },
    { roots: ["أحكام رفع الأيدي في الدعاء", "آداب الدعاء"], reply: "يُسن رفع الأيدي في الدعاء في غير الصلوات المفروضة، وهو من آداب إجابة الدعاء." },
    { roots: ["أحكام الدعاء الأدعية المأثورة", "الأدعية القرآنية"], reply: "الأدعية المأثورة في القرآن والسنة هي أفضل ما يدعو به العبد لجامعيتها وكمالها." },
    { roots: ["أحكام الرقية بغير اللسان العربي", "الرقية بالأعجمية"], reply: "تجوز الرقية بكل لفظ مفهوم يدل على ذكر الله أو المعاني الطيبة بشرط خلوها من السحر." },
    { roots: ["أحكام كتابة التمائم من القرآن", "تعليق القرآن"], reply: "أجاز بعض السلف تعليق التمائم المصنوعة من القرآن وحده، والجمهور منعها سداً للذريعة." },
    { roots: ["أحكام الحجامة في نهار الصيام", "هل الحجم تفطر"], reply: "الصحيح أن الحجامة لا تفطر الصائم، وكان النبي صلى الله عليه وسلم يحتجم وهو صائم." },
    { roots: ["أحكام تقبيل الحجر الأسود", "سنة عمرية"], reply: "تقبيل الحجر الأسود سنة ومستحب، فإن شقّ استلمه بيده وقبلها، أو أشار إليه وكبر." },
    { roots: ["أحكام الطواف حول الكعبة", "شروط الطواف"], reply: "يشترط لصحة الطواف الطهارة، وستر العورة، وجعل البيت عن اليسار، وسبعة أشواط كاملة." },
    { roots: ["أحكام السعي بين الصفا والمروة", "أشواط السعي"], reply: "يبدأ السعي من الصفا وينتهي بالمروة سبعة أشواط تامة بعد طواف صحيح." },
    { roots: ["أحكام المبيت بمنا والمزدلفة", "أعمال الحج"], reply: "المبيت بمزدلفة ومنى من واجبات الحج التي يجب التركيز عليها لجبر دم عند الترك." },
    { roots: ["أحكام رمي الجمرات", "أيام التشريق"], reply: "يجب رمي الجمرات الثلاث بأيام التشريق حصاة حصاة مع التكبير في كل رمية." },
    { roots: ["أحكام طواف الوداع", "آخر أعمال الحج"], reply: "طواف الوداع واجب على الآفاقي قبل مغادرة مكة، ويُسقط عن الحائض والنفساء." },
    { roots: ["أحكام العمرة في رمضان", "تعدل حجة"], reply: "العمرة في رمضان تعدل حجة مع النبي صلى الله عليه وسلم في الأجر والفضل." },
    { roots: ["أحكام الإحرام من الميقات", "جاوز الميقات بلا إحرام"], reply: "من جاوز الميقات مريداً النسك لزمه الرجوع إليه للإحرام منه، وإلا فعليه دم." },
    { roots: ["أحكام التمتع والقران والإفراد", "أنواع النسك"], reply: "التمتع أفضل أنواع النسك للحاج، وهو أن يحرم بعمرة ثم يحج في عامه مع الهدي." },
    { roots: ["أحكام الإحصار في الحج", "عدم إتمام النسك"], reply: "من حُصر عن البيت بمرض أو عدو نحر هديه وتحلل من إحرامه ولا إثم عليه." },
    { roots: ["أحكام جزاء الصيد للمحرم", "فدية الصيد"], reply: "من قتل صيداً وهو محرم فعليه جزاء مثل ما قتل من النعم أو إطعام مساكين." },
    { roots: ["أحكام التنوير بزيارة المسجد النبوي", "الصلاة في مسجد النبي"], reply: "الصلاة في مسجد النبي صلى الله عليه وسلم بألف صلاة فيما سواه إلا المسجد الحرام." },
    { roots: ["أحكام زيارة قبر النبي", "السلام على النبي"], reply: "تشرع زيارة المسجد النبوي وقبر النبي صلى الله عليه وسلم والصاحبيه بآداب شرعية." },
    { roots: ["أحكام الصلاة في مسجد قباء", "أجر العمرة"], reply: "من تطهر في بيته ثم أتى مسجد قباء فصلى فيه صلاة كان كأجر عمرة تامة." },
    { roots: ["أحكام قراءة سورة الإخلاص", "تعدل ثلث القرآن"], reply: "من قرأ قل هو الله أحد فكأنما قرأ ثلث القرآن الكريم في الأجر والفضل." },
    { roots: ["أحكام فضل الاستغفار الأسحار", "المستغفرين بالأسحار"], reply: "مدح الله المستغفرين بالأسحار، وهي من أعظم الأوقات لإجابة الدعاء ونيل المغفرة." },
    { roots: ["أحكام جلسة الاستراحة في الصلاة", "سنة خفيفة"], reply: "جلسة الاستراحة بعد الركعة الأولى والثالثة الوترية سنة صحيحة عن مالك وغيره." },
    { roots: ["أحكام وضع اليمنى على اليسرى", "هيئة المصلي"], reply: "وضع اليمنى على اليسرى على الصدر أو الساعدين في الصلاة سنة ثابتة عن الرسول." },
    { roots: ["أحكام دعاء الاستفتاح", "بداية الصلاة"], reply: "يُسن الإتيان بدعاء الاستفتاح بعد تكبيرة الإحرام وقبل الاستعاذة والقراءة." },
    { roots: ["أحكام التعوذ والبسملة", "أداء القراءة"], reply: "تُسن الاستعاذة بالله من الشيطان الرجيم والبسملة في أول القراءة بالصلاة." },
    { roots: ["أحكام التأمين بعد الفاتحة", "قول آمين"], reply: "يُسن جهر الإمام والمأموم بقول آمين بعد الفاتحة بتوافق مع ملائكة السماء." },
    { roots: ["أحكام قراءة سورة قصيرة بعد الفاتحة", "الركعتان الأولى والثانية"], reply: "تُسن قراءة سورة قصيرة أو آيات بعد الفاتحة في الركعتين الأوليين من الصلوات." },
    { roots: ["أحكام رفع اليدين في الركوع", "مواضع رفع الأيدي"], reply: "يُسن رفع الأيدي عند تكبيرة الإحرام، وعند الركوع، والرفع منه، وعند القيام للثالثة." },
    { roots: ["أحكام الطمأنينة في الصلاة", "ركن الصلاة"], reply: "الطمأنينة في الركوع والسجود والاعتدال ركن أساسي لا تصصح الصلاة بدونها." },
    { roots: ["أحكام التشهد الأوسط", "واجب الصلاة"], reply: "التشهد الأوسط واجب من واجبات الصلاة، وجبره بسجود السهو إن نُسي عمداً." },
    { roots: ["أحكام الصلاة الإبراهيمية", "كمال التشهد"], reply: "الصلاة على النبي في التشهد الأخير ركن أو واجب عند الأئمة، وهي كمال التحيات." },
    { roots: ["أحكام التسليم من الصلاة", "ختام الصلاة"], reply: "التسليم يميناً ويساراً ركن من أركان الصلاة يخرج به المصلي من تشريعاتها." },
    { roots: ["أحكام الأذكار بعد الصلاة", "تسبيح وتحميد وتكبير"], reply: "يُسن عقب كل صلاة مفروضة الاستغفار ثلاثاً، والأذكار المأثورة والتسبيح 33." },
    { roots: ["أحكام صلاة الجنازة بلا ركوع", "هيئة صلاة الجنازة"], reply: "صلاة الجنازة أربع تكبيرات بلا ركوع ولا سجود، يُقرأ فيها الفاتحة والصلاة الإبراهيمية." },
    { roots: ["أحكام التغسيل للميت", "فرض كفاية"], reply: "تغسيل الميت المسلم وتكفينه والصلاة عليه ودفنه فرض كفاية على المجتمع." },
    { roots: ["أحكام كفن الميت", "أثواب بيضاء"], reply: "يُستحب تكفن الرجل في ثلاثة أثواب بيضاء، والمرأة في خمسة أثواب ساترة." },
    { roots: ["أحكام الدفن ليلاً", "جواز الدفن بالليل"], reply: "يجوز دفن الميت ليلاً إذا دعت الحاجة أو وُجد مقتضٍ شرعي لذلك بلا حرج." },
    { roots: ["أحكام البكاء على الميت", "بكي القلب ودمع العين"], reply: "يجوز البكاء الدمعي على الميت رحمة وحزناً دون نياحة أو شق الجيوب ولطم الخدود." },
    { roots: ["أحكام التعزية بغير الزمان والمكان", "التعزية المفتوحة"], reply: "تجوز التعزية في أي مكان وزمان يصح فيه التصبير دون التزام بمآتم بدعية محدثة." },
    { roots: ["أحكام اليمين الغموس الكاذبة", "اليمين الفاجرة"], reply: "اليمين الغموس هي التي يتعمد فيها الكذب لاقتطاع مال أخيه، وهي من الكبائر الموبقة." },
    { roots: ["أحكام اليمين اللغو", "ما لا يقصد الحلف"], reply: "اليمين اللغو هي ما يجري على اللسان بلا قصد عقد كقول الرجل: لا والله وبلى والله، ولا كفارة فيها." },
    { roots: ["أحكام العزم على اليمين", "كفارة الحنث"], reply: "من حلف على يمين وعزم عليها ثم حنث فيها فعليه كفارة اليمين المذكورة بالقرآن." },
    { roots: ["أحكام النذر في اللجاج", "حكم النذر الغضبي"], reply: "من نذر نذراً في حال غضب أو لجاج بقصد الحث أو المنع ففيه كفارة يمين عند الحنث." },
    { roots: ["أحكام زكاة الفطر بالقيم النقدية", "إخراج القيمة"], reply: "ذهب الحنفية لجواز إخراج قيمة زكاة الفطر نقداً لمصلحة الفقير، وجمهور المالكية والشافعية منعوه." },
    { roots: ["أحكام زكاة المال المدخر في البنوك", "حساب الزكاة البنكية"], reply: "تجب الزكاة في المال المدخر بالبنوك بنسبة 2.5 بالمئة كلما تم الحول القمري عليه." },
    { roots: ["أحكام زكاة الأسهم والسندات", "زكاة الاستثمارات"], reply: "تجب الزكاة في الأسهم بحسب نية المساهم؛ فإن كانت للتجارة ففي قيمتها السوقية، وإن للاستثمار ففي ريعها." },
    { roots: ["أحكام الضمان المالي في المتلفات", "من أتلف شيئاً"], reply: "من أتلف مال غيره خطأً أو عمداً لزمه ضمانه برده أو بدفع قيمته السوقية." },
    { roots: ["أحكام الحجر على السفيه والمفلس", "منع التصرف المالي"], reply: "يجوز لولي الأمر الحجر على السفيه والمفلس لحفظ حقوق الغرماء وحماية أموالهم." },
    { roots: ["أحكام الوكالة في الخصومة والمال", "التوكيل الشرعي"], reply: "تجوز الوكالة في كل حق يقبل النيابة كالبيع والشراء والخصومة وقبض الديون." },
    { roots: ["أحكام الكفالة والضمان الشخصي", "التزام الدين بالذمة"], reply: "الكفالة ضم ذمة الكفيل إلى ذمة المدين في المطالبة بالحق أو إحضاره." },
    { roots: ["أحكام الحوالة المالية", "نقل الدين"], reply: "الحوالة نقل الدَّين من ذمة المدين إلى ذمة مليء آخر برضا الدائن." },
    { roots: ["أحكام الرهن الحيازي والوثيقة", "رهن الأعيان"], reply: "الرهن توثيق دين بعين مالية يمكن استيفاء الحق منها عند تعذر السداد." },
    { roots: ["أحكام الإجارة والعمل", "أجر العامل"], reply: "الإجارة عقد على منافع الأعيان أو عمل الإنسان بأجر معلوم ومدد محددة." },
    { roots: ["أحكام المساقاة والمزارعة", "العمل بالأرض"], reply: "المساقاة والمزارعة جائزتان في الشجر والنخيل والأرض بنسبة معلومة من الثمر أو الزرع." },
    { roots: ["أحكام الجعالة في الأعمال", "مكافأة المفقود"], reply: "الجعالة التزام عِوض معلوم على عمل معين مجهول النتيجة، وهي جائزة شرعاً." },
    { roots: ["أحكام السبق والرماية", "المسابقات الجائزة"], reply: "يجوز أخذ الجوائز في المسابقات التي تخدم الدين كالرماية والسباق وحفظ القرآن." },
    { roots: ["أحكام اللقطة غير النقدية", "لقطة الحيوان"], reply: "لقطة الحيوان الضال إن كان محميًا ضَمِنَه الواجد، وإن كان ضعيفًا تعين أكله أو حفظه لمالكه." },
    { roots: ["أحكام اللقيط وحضانته", "مجهول النسب"], reply: "اللقيط نفس محرومة يجب رعايتها وكفالتها والإنفاق عليها من بيت المال أو المتبرعين." },
    { roots: ["أحكام الوصية للفقراء والمساكين", "وصية الخير"], reply: "تجوز الوصية للفقراء والمصالح العامة والقرابات غير الوارثين بحدود ثلث التركة." },
    { roots: ["أحكام موانع الإرث", "القتل والرق والختلف"], reply: "موانع الإرث ثلاثة أساسية: الرق، والقتل العمد بغير حق، واختلاف الدين." },
    { roots: ["أحكام الرد في الميراث", "عدم استغراق الفروض"], reply: "إذا فضل شيء من التركة بعد أصحاب الفروض ولم يوجد عصبة رُد الفائض على ذوي الفروض بنسبتهم." },
    { roots: ["أحكام ذوي الأرحام", "الميراث لغير العصبة"], reply: "يرث ذوي الأرحام وهم الأقارب غير أصحاب الفروض ولا العصبات عند عدم وجود الوارث الأصلي." },
    { roots: ["أحكام المفقود في الفقه", "حكم زوجة المفقود"], reply: "المفقود الذي لا يُعلم حية أو موت تحكم المحكمة بموته بعد مضي مدة يغلب فيها الهلكة." },
    { roots: ["أحكام الخنثى المشكل", "ميراث الخنثى"], reply: "الخنثى المشكل الذي له أداة الرجل والمرأة يعامل في الميراث بالأضر والأحوط." },
    { roots: ["أحكام الحمل في الميراث", "إيقاف النصيب للحمل"], reply: "يُوقف للحمل الحادث في بطن أمه أفرط النصيبين (ذكراً أو أنثى) حتى يتبين أمره." },
    { roots: ["أحكام العول في الميراث", "نقص الأنصباء"], reply: "العول زيادة في سهام الفرائض ونقص في أنصباء الورثة إذا زادت الحصص عن أصل التركة." },
    { roots: ["أحكام الرد على الجنين المستهلل", "ميراث السقط"], reply: "إذا ولد السقط حياً استهل صارخاً ثم مات ورث وأورث، وإن مات قبل الولادة فلا." },
    { roots: ["أحكام وصية الواجبة", "حق الأحفاد"], reply: "بعض التشريعات المعاصرة أخذت بالوصية الواجبة لمن مات أبوه قبل جدّه لحمايتهم من الحرمان." },
    { roots: ["أحكام الخلع بالمهر الكامل", "رد الصداق في الخلع"], reply: "يصح الخلع برد المهر كاملاً أو زيادته أو نقصه باتفاق الزوجين ورضا القاضي الشرعي." },
    { roots: ["أحكام الطلاق الباين بينونة صغرى", "الرجعة بعد الطلاق"], reply: "الطلاق الباين بينونة صغرى هو ما كان قبل الدخول أو على عوض، ولا رجعة فيه إلا بعقد ومهر جديدين." },
    { roots: ["أحكام الطلاق الباين بينونة كبرى", "طلاق الثلاث"], reply: "من طلق امرأته ثلاثاً دفعة واحدة وقعت ثلاثاً عند الجمهور، وتحرم عليه حتى تنكح زوجاً غيره." },
    { roots: ["أحكام صيام التطوع يوم الجمعة منفرداً", "إفراد الجمعة بالصيام"], reply: "يكره إفراد يوم الجمعة بالصيام تطوعاً إلا أن يصوم قبله يوماً أو بعده يوماً." },
    { roots: ["أحكام صيام يوم الششك", "يوم الثلاثين من شعبان"], reply: "يحرم صيام يوم الشك احتياطاً لرمضان إلا أنواً يوافق عادة صيام للعبد كالاثنين والخميس." }

    { roots: ["أركان الإسلام", "بني الإسلام على خمس"], reply: "بُنِيَ الإسْلامُ على خَمْسٍ: شهادة أن لا إله إلا الله وأن محمداً رسول الله، وإقام الصلاة، وإيتاء الزكاة، وحج البيت، وصوم رمضان." },
    { roots: ["أركان الإيمان", "بماذا نؤمن"], reply: "الإيمان هو أن تؤمن بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، وتؤمن بالقدر خيره وشره." },
    { roots: ["تعريف التوحيد", "أنواع التوحيد"], reply: "التوحيد ثلاثة أقسام: توحيد الربوبية، وتوحيد الألوهية، وتوحيد الأسماء والصفات." },
    { roots: ["شروط لا إله إلا الله", "مفتاح الجنة"], reply: "شروطها سبعة: العلم، اليقين، القبول، الانقياد، الصدق، الإخلاص، والمحبة." },
    { roots: ["علاج الهم والغم", "تفريغ الكرب"], reply: "من علاج الهم كثرة الاستغفار، ولزوم تقوى الله، ودعاء الكرب النبوي المأثور." },
    { roots: ["فضل الصلاة الوسطى", "العصر"], reply: "حافظوا على الصلوات والصلاة الوسطى وقوموا لله قانتين، وهي صلاة العصر في أصح الأقوال." },
    { roots: ["فضل صلاة الفجر", "بحر الصباح"], reply: "من صلى الصبح فهو في ذمة الله حتى يمسي، وهي من أعظم الصلوات أجراً." },
    { roots: ["فضل صلاة العشاء", "في جماعة"], reply: "من صلى العشاء في جماعة فكأنما قام نصف الليل، ومن صلى الصبح في جماعة فكأنما قام الليل كله." },
    { roots: ["مكانة الصلاة في الإسلام", "عماد الدين"], reply: "الصلاة عماد الدين، فمن أقامها فقد أقام الدين ومن هدمها فقد هدم الدين." },
    { roots: ["تارك الصلاة", "حكم ترك الصلاة"], reply: "ترك الصلاة كسلاً محرم وخطر عظيم، واختلف العلماء في كفره، والأرجح خطر التهاون بها." },
    { roots: ["أحكام الزكاة", "نصاب الذهب والفضة"], reply: "تجب الزكاة في الذهب إذا بلغ 85 غراماً، وفي الفضة إذا بلغت 595 غراماً، وحال عليها الحول." },
    { roots: ["مصارف الزكاة", "لمن تُعطى الزكاة"], reply: "مصارف الزكاة ثمانية كما ذكرها الله في سورة التوبة: للفقراء والمساكين والعاملين عليها..." },
    { roots: ["صدقة التطوع", "أثر الصدقة"], reply: "الصدقة تطفئ غضب الرب وتدفع ميتة السوء، وهي برهان الإيمان." },
    { roots: ["حكم الصيام", "فروض الصيام"], reply: "الصيام ركن من أركان الإسلام، ويجب على كل مسلم بالغ عاقل مقيم قادر." },
    { roots: ["مفسدات الصيام", "ما يفطر"], reply: "المفطرات الأساسية: الأكل والشرب عمداً، الجماع، والاستفراغ المتعمد." },
    { roots: ["صيام التطوع", "ست من شوال"], reply: "من صام رمضان ثم أتبعه ستاً من شوال كان كصيام الدهر." },
    { roots: ["أحكام الحج والعمرة", "لمن استطاع"], reply: "الحج فرض على المستطيع في عمره مرة واحدة، والعمرة سنة مؤكدة." },
    { roots: ["أركان الحج", "الوقوف بعرفة"], reply: "أركان الحج أربعة: الإحرام، الوقوف بعرفة، طواف الإفاضة، والسعي بين الصفا والمروة." },
    { roots: ["شروط الوجوب", "الاستطاعة في الحج"], reply: "الاستطاعة تشمل القدرة المالية والبدنية وأمن الطريق وجود محرم للمرأة." },
    { roots: ["محظورات الإحرام", "ما يمنع المحرم"], reply: "يحرم على المحرم قص الشعر والأظافر، لبس المخيط للرجل، الصيد، وطيب البدن." },
    { roots: ["أحكام الطهارة", "الحدث الأصغر والأكبر"], reply: "الحدث الأصغر يوجب الوضوء، والحدث الأكبر يوجب الغسل الكامل." },
    { roots: ["فروض الوضوء", "أعضاء الوضوء"], reply: "فروض الوضوء ستة: غسل الوجه، غسل اليدين إلى المرافق، مسح الرأس، غسل الرجلين إلى الكعبين، الفورية، والترتيب." },
    { roots: ["نواقض الوضوء", "ما ينقض الطهارة"], reply: "ينقض الوضوء الخارج من السبيلين، النوم العميق، زوال العقل، ومس الفرج بشهوة." },
    { roots: ["موجبات الغسل", "الجنابة والحيض"], reply: "يجب الغسل بخروج المني بشهوة، الجماع، انقطاع الحيض والنفاس، والموت." },
    { roots: ["التيمم الشرعي", "بديل الماء"], reply: "يُشرع التيمم بالتراب الطاهر الطيب عند عدم وجود الماء أو العجز عن استعماله للمرض." },
    { roots: ["أحكام المواريث", "علم الفرائض"], reply: "المواريث علم جليل قسم الله فيه التركات بنفسه لقطع النزاعات." },
    { roots: ["أصحاب الفروض", "من يرث بالفرض"], reply: "هم عشرة من الرجال وأربع من النساء، لكل واحد منهم نصيب مقدر في القرآن." },
    { roots: ["العصبات", "الميراث بالتعصيب"], reply: "العصبات هم الرجال الذين يأخذون ما تبقي من التركة بعد أصحاب الفروض." },
    { roots: ["الحجب في الميراث", "من يحجب من"], reply: "الحجب إما حجب نقصان أو حجب حرمان، فالأقرب يحجب الأبعد." },
    { roots: ["الوصية الشرعية", "حدود الوصية"], reply: "الوصية تجوز في حدود ثلث المال فقط، ولا تجوز لوارث إلا بإجازة بقية الورثة." },
    { roots: ["حقوق الجار", "ثلاثة أنواع"], reply: "للجار حقوق عظيمة، وأعلاها الجار المسلم القريب، وأدناها الجار غير المسلم." },
    { roots: ["بر الوالدين", "أعظم القربات"], reply: "بر الوالدين يأتي بعد توحيد الله مباشرة، وعقوقهما من أكبر الكبائر." },
    { roots: ["صلة الرحم", "حبل القربى"], reply: "صلة الرحم تطيل العمر وتزيد الرزق، وقطيعتها توجب سخط الله ولعنته." },
    { roots: ["حقوق الأبناء", "التربية الصالحة"], reply: "من حقوق الأبناء اختيار الأسماء الحسنة، التربية بالقيم، والعدل بينهم في العطية." },
    { roots: ["حق الزوجة", "النفقة والكسوة"], reply: "للزوجة على زوجها المهر، النفقة، السكن، والعدل والمعاشرة بالمعروف." },
    { roots: ["حق الزوج", "الطاعة بالمعروف"], reply: "على الزوجة طاعة زوجها في غير معصية، وحفظ بيته وماله وعرضه." },
    { roots: ["الطلاق وأحكامه", "أبغض الحلال"], reply: "الطلاق جائز عند الضرورة القصوى، وهو أبغض الحلال عند الله عز وجل." },
    { roots: ["الخلع الشرعي", "افتداء الزوجة"], reply: "يجوز للزوجة أن تفتدي نفسها من زوجها برد الصداق بطلب الطلاق." },
    { roots: ["عدة الطلاق", "براءة الرحم"], reply: "عدة المرأة المطلقة المدخول بها ثلاثة قروء، والمستبينة للحمل بوضع الحمل." },
    { roots: ["حضانة الأطفال", "حق الأم"], reply: "حضانة الطفل حق للأم أولاً ما لم تتزوج، ثم تنتقل لمن يستحقها من المحارم." },
    { roots: ["التجارة الحلال", "أكل الحلال"], reply: "الأصل في المعاملات الإباحة والحل، وتحرم العقود التي فيها غرر أو ربا." },
    { roots: ["حكم الربا", "حرب من الله ورسوله"], reply: "الربا من الكبائر المهلكة، وآذن الله ورسوله بالحرب على آكل الربا ومؤكله." },
    { roots: ["تحريم الغش", "من غشنا"], reply: "حرم الإسلام الغش والخداع في التجارة والامتحانات وكل شؤون الحياة." },
    { roots: ["الوفاء بالعقود", "المسلمون عند شروطهم"], reply: "يجب الوفاء بالعقود والعهود والمواثيق لقوله تعالى: (وأوفوا بالعهد إن العهد كان مسؤولاً)." },
    { roots: ["كتابة الديون", "التوثيق"], reply: "يُسن كتابة الديون المؤجلة وتوثيقها بالشهود لقطع النزاعات المالية." },
    { roots: ["حكم الرهن", "الضمان المالي"], reply: "يجوز رهن الأعيان وثيقة بالديون عند عدم توفر الثقة الفورية." },
    { roots: ["حكم الكفالة", "التزام الحق"], reply: "الكفالة جائزة شرعاً لمن يلتزم بإحضار المدين أو سداد دينه عند تعثره." },
    { roots: ["شركات الأعمال", "المضاربة والعنان"], reply: "تجوز الشركات بأنواعها المختلفة بشرط اتفاق الأطراف على توزيع الأرباح والخسائر بدقة." },
    { roots: ["الأجير وحقوقه", "أجر العامل"], reply: "أمر النبي صلى الله عليه وسلم بإعطاء الأجير أجره قبل أن يجف عرقه." },
    { roots: ["اللقطة وأحكامها", "المال الضائع"], reply: "من وجد لقطة وجب عليه تعريفها مدة سنة كاملة في الأماكن العامة." },
    { roots: ["الذكاة الشرعية", "شروط الذبح"], reply: "تتم الذكاة الشرعية بقطع الودجين بآلة حادة مع ذكر اسم الله عليها." },
    { roots: ["الأطعمة المحرمة", "الميتة والخنزير"], reply: "يحرم أكل الميتة، الدم المسفوح، لحم الخنزير، وما أهل لغير الله به." },
    { roots: ["التداوي والعلاج", "طلب الشفاء"], reply: "يجب الأخذ بالأسباب الدنيوية في العلاج، لأن الله ما أنزل داء إلا أنزل له شفاء." },
    { roots: ["الرقية الشرعية", "التعوذ بالقرآن"], reply: "الرقية المشروعة تكون بآيات القرآن الكريم والأدعية الثابتة عن النبي صلى الله عليه وسلم." },
    { roots: ["فضل طلب العلم", "طريق الجنة"], reply: "من سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة." },
    { roots: ["فضل العلماء", "ورثة الأنبياء"], reply: "العلماء هم ورثة الأنبياء، ولم يورثوا ديناراً ولا درهماً وإنما ورثوا العلم." },
    { roots: ["تلاوة القرآن", "خير الأعمال"], reply: "تلاوة القرآن تجلب السكينة، والحرف الواحد بعشر حسنات." },
    { roots: ["تدبر القرآن", "أفلا يتدبرون"], reply: "أمر الله بتدبر القرآن وفهم معانيه للانتفاع به وهداية القلوب." },
    { roots: ["حفظ القرآن", "صدقة جارية"], reply: "حفظ القرآن وصونه في الصدور من أعظم القربات التي يرفع الله بها الأقوام." },
    { roots: ["سورة الكهف", "نور الجمعة"], reply: "قراءة سورة الكهف يوم الجمعة تنير للمسلم ما بين الجمعتين." },
    { roots: ["سورة الملك", "المنجية"], reply: "سورة الملك تشفع لصاحبها حتى يُغفر له وتمنعه من عذاب القبر." },
    { roots: ["آية الكرسي", "أعظم آية"], reply: "قراءة آية الكرسي بعد كل صلاة مفروضة تجعل بينك وبين الجنة الموت فقط." },
    { roots: ["المعوذتين", "الحصن الحصين"], reply: "قراءة سورة الفلق والناس تكفي المسلم من كل شر وحسد وعين." },
    { roots: ["صلاة الضحى", "صلاة الأوابين"], reply: "صلاة الضحى سنة مؤكدة، وأقلها ركعتان وأعلاها ثماني ركعات." },
    { roots: ["قيام الليل", "شرف المؤمن"], reply: "قيام الليل دأب الصالحين ومطردة الداء عن الجسد وقربة للرحمن." },
    { roots: ["صلاة الوتر", "ختام الليل"], reply: "الوتر سنة مؤكدة، واجعلوا آخر صلاتكم بالليل وتراً." },
    { roots: ["صلاة الاستخارة", "طلب الخيرة"], reply: "يُركع ركعتين لمن همّ بأمر ثم يدعو بدعاء الاستخارة المأثور." },
    { roots: ["السنن الرواتب", "اثنتا عشرة ركعة"], reply: "من صلى اثنتي عشرة ركعة في اليوم والليلة تطوعاً بني له بهن بيت في الجنة." },
    { roots: ["صيام الاثنين والخميس", "تعرض الأعمال"], reply: "تُعرض الأعمال على الله يومي الاثنين والخميس فأحب أن يُعرض عملي وأنا صائم." },
    { roots: ["صيام عاشوراء", "يكفر سنة"], reply: "صيام يوم عاشوراء يُحتسب على الله أن يكفر السنة الماضية." },
    { roots: ["صيام عرفة", "يكفر سنتين"], reply: "صيام يوم عرفة يكفر السنة الماضية والباقية لمن لم يحج." },
    { roots: ["الاعتكاف", "في رمضان"], reply: "الاعتكاف سنة مؤكدة في العشر الأواخر من رمضان تفرغاً للعبادة." },
    { roots: ["ليلة القدر", "خير من ألف شهر"], reply: "تحروا ليلة القدر في الوتر من العشر الأواخر من شهر رمضان." },
    { roots: ["زكاة الفطر", "طهرة للصائم"], reply: "فرضت زكاة الفطر طهرة للصائم من اللغو والرفث وطعمة للمساكين." },
    { roots: ["آداب الاستئذان", "ثلاثاً"], reply: "الاستئذان ثلاث مرات، فإن أُذن لك وإلا فارجع." },
    { roots: ["مجالس الذكر", "حياض الرحمة"], reply: "ما جلس قوم يذكرون الله إلا غشيتهم الرحمة وحفتهم الملائكة." },
    { roots: ["إفطار الصائم", "مثل أجره"], reply: "من فطر صائماً كان له مثل أجره غير أنه لا ينقص من أجر الصائم شيئاً." },
    { roots: ["بر الأمهات", "ثلاث مرات"], reply: "الأم لها حق الثلاثة أرباع في البر لشدة تعبها وحملها وتربيتها." },
    { roots: ["صلة الأرحام", "حبل متصل"], reply: "من وصل رحمه وصله الله، ومن قطع رحمه قطعه الله يوم القيامة." },
    { roots: ["الكلمة الطيبة", "صدقة جارية"], reply: "الكلمة الطيبة صدقة، وتبسمك في وجه أخيك صدقة." },
    { roots: ["إصلاح ذات البين", "أفضل الصدقات"], reply: "إصلاح ذات البين أفضل من درجة الصيام والصلاة والصدقة." },
    { roots: ["التواضع لله", "رفعة العبد"], reply: "ما تواضع أحد لله إلا رفعه الله عز وجل في الدارين." },
    { roots: ["الصبر عند المصيبة", "الاحتساب"], reply: "إنما الصبر عند الصدمة الأولى، والرضا بالقضاء يورث الطمأنينة." },
    { roots: ["التوكل على الله", "الأخذ بالأسباب"], reply: "توكل على الله حق التوكل مع الأخذ بالأسباب الدنيوية المشروعة." },
    { roots: ["ذكر الموت", "هادم اللذات"], reply: "أكثروا من ذكر هادم اللذات الموت فإنه يرقق القلب ويصلح الحال." },
    { roots: ["فضل التسبيح", "ثقيل في الميزان"], reply: "سبحان الله وبحمده، سبحان الله العظيم، كلمتان خفيفتان ثقيلتان." },
    { roots: ["فضل الاستغفار", "مفتاح الرزق"], reply: "من لزم الاستغفار جعل الله له من كل هم فرجاً ومن كل ضيق مخرجاً." },
    { roots: ["أذكار الصباح والمساء", "حفظ المسلم"], reply: "المحافظة على الأذكار تحصن العبد من كل شر بإذن الله." },
    { roots: ["الوضوء قبل النوم", "سنة نبوية"], reply: "نم على طهارة ووضوء فإن مات مات على الفطرة." },
    { roots: ["عيادة المريض", "دعاء الملائكة"], reply: "من عاد مريضاً خاض في الرحمة حتى يجلس." },
    { roots: ["اتباع الجنائز", "قيراط أجر"], reply: "من تبع جنازة حتى يصلى عليها فله قيراط من الأجر." },
    { roots: ["الدعاء بظهر الغيب", "مستجاب"], reply: "دعوة المسلم لأخيه بظهر الغيب مستجابة وموكلة بملك يقول ولك بمثل." },
    { roots: ["صلة الأرحام المقطوعة", "عزم وصدق"], reply: "صلة من قطعك من أعلى درجات الإحسان وحسن الخلق." },
    { roots: ["حرمة الغيبة والنميمة", "كبائر الأخلاق"], reply: "الغيبة ذكرك أخاك بما يكره، والنميمة نقل الكلام للإفساد." },
    { roots: ["تحريم الكذب", "يهدي للفجور"], reply: "إياكم والكذب فإن الكذب يهدي إلى الفجور وإن الفجور يهدي إلى النار." },
    { roots: ["حرمة شهادة الزور", "من الكبائر"], reply: "شهادة الزور تعدل الإشراك بالله في بعض النصوص لخطورتها." },
    { roots: ["علاج الحسد", "الرضا بالقسم"], reply: "الحسد اعتراض على قدر الله، وعلاجه الرضا بما قسمه الله للعباد." },
    { roots: ["التحذير من السحر", "شرك بالله"], reply: "السحر من الكبائر العظيمة المخرجة عن الملّة إذا كان بعبادة غير الله." },
    { roots: ["أهمية التوبة", "تهدم ما قبلها"], reply: "التوبة النصوح تمسح كل ما قبلها من الذنوب والخطايا مهما عظمت." },
    { roots: ["فضل الصلاة على النبي", "تفريغ الهموم"], reply: "من صلى عليّ صلاة صلى الله عليه بها عشراً، وهي كافية لهمومك ومغفرة لذنوبك." }


        { roots: ["ربا", "فوائد بنكية", "قرض بفائدة"], reply: "الربا محرم تحريماً قاطعاً بالكتاب والسنة، وهو من كبائر الذنوب التي تمحق البركة." },
    { roots: ["وضوء", "طهارة الصلاة"], reply: "الوضوء شرط لصحة الصلاة، وفرائضه: غسل الوجه، واليدين إلى المرافق، ومسح الرأس، وغسل الرجلين إلى الكعبين." },
    { roots: ["حج", "مناسك الحج"], reply: "الحج ركن من أركان الإسلام لمن استطاع إليه سبيلاً، وأعظم شعائره وقفة عرفة." },
    { roots: ["عمرة", "أداء العمرة"], reply: "العمرة سنة مؤكدة في العمر مرة أو تكراراً، وتتضمن الإحرام، الطواف، السعى، والحلق أو التقصير." },
    { roots: ["أضحية", "عيد الأضحى"], reply: "الأضحية سنة مؤكدة لمن كان قادراً، وتُذبح في أيام النحر تقرباً لله تعالى وفق شروط السن والسلامة." },
    { roots: ["عقيقة", "مولود"], reply: "العقيقة سنة مشروعة عن المولود، تُذبح يوم الأسبوع السابع شخوصاً شكراً لله عز وجل." },
    { roots: ["يمين", "قسم", "حلف"], reply: "اليمين الغموس كبيرا واليمين اللغو لا مؤاخذة فيه، ويمين الكفارة فيها إطعام عشرة مساكين أو كسوتهم." },
    { roots: ["نذر", "الوفاء بالنذر"], reply: "النذر مكروه ابتداءً، لكن إذا نذر طاعة وجب الوفاء به لقوله صلى الله عليه وسلم: (فمن نذر أن يطيع الله فليطعه)." },
    { roots: ["غيبة", "نميمة"], reply: "الغيبة ذكرك أخاك بما يكره، والنميمة نقل الكلام بين الناس للإفساد، وكلاهما من الكبائر المحرمة." },
    { roots: ["كذب", "شهادة الزور"], reply: "الكذب يهدي إلى الفجور، وشهادة الزور من أشد الكبائر خطراً على أمن المجتمع وعدالته." },
    { roots: ["حسد", "عين"], reply: "الحسد هو تمنا زوال النعمة عن الغير وهو محرم، والعين حق وتُدفع بالرقية الشرعية والأذكار." },
    { roots: ["سحر", "شعوذة"], reply: "السحر كفر وشرك بالله، وتصديق الكهان والمنجمين محرم ومبطل للتوحيد." },
    { roots: ["توبة", "استغفار"], reply: "التوبة النصوح تهدم ما قبلها، وشروطها: الإقلاع عن الذنب، الندم على فعله، والعزم على عدم العودة." },
    { roots: ["دعاء", "ابتهال"], reply: "الدين هو العبادة، ويُشترط لاستجابته إخلاص النية، وتحري الحلال، وعدم الاستعجال." },
    { roots: ["صدقة", "فقراء"], reply: "الصدقة تطفئ غضب الرب وتدفع الميتة السوء، وهي برهان الإيمان وسور واقي للمال." },
    { roots: ["بر الوالدين", "عقوق"], reply: "بر الوالدين من أعظم الطاعات وأحب الأعمال إلى الله، وعقوقهما من الكبائر المهلكة." },
    { roots: ["جار", "حق الجار"], reply: "أوصى النبي صلى الله عليه وسلم بالجار حتى ظن أنه سيورث، وحرم أذيته أو إزعاجـه." },
    { roots: ["ضيف", "إكرام الضيف"], reply: "إكرام الضيف دليل على كمال الإيمان، وجائزته الشرعية يوم وليلة." },
    { roots: ["يتيم", "كفالة اليتم"], reply: "كفالة اليتم من أعظم الأعمال الموجبة لمرافقة النبي صلى الله عليه وسلم في الجنة." },
    { roots: ["طريق", "إماطة الأذى"], reply: "إماطة الأذى عن الطريق صدقة، وهي شعبة من شعب الإيمان العملية." },
    { roots: ["سلام", "إفشاء السلام"], reply: "إفشاء السلام سبب للمحبة والوئام، ورد السلام فرض كفاية وابتدائه سنة مؤكدة." },
    { roots: ["مرض", "زيارة المريض"], reply: "زيارة المريض حق للمسلم على أخيه، ولها أجر عظيم وتخفيف لآلامه." },
    { roots: ["جنازة", "تعزية"], reply: "اتباع الجنائز وتعزية أهل المصيبة سنة تؤنسهم وتخفف عنهم لوعة الفراق." },
    { roots: ["قبر", "زيارة القبور"], reply: "زيارة القبور مشروعة للاتعاظ وتذكر الآخرة والدعاء للموتى، دون ندب أو لطم." },
    { roots: ["موت", "احتضار"], reply: "يُسن تلقين المحتضر شهادة (لا إله إلا الله)، وتوجيهه نحو القبلة إن تيسر." },
    { roots: ["شهيد", "الشهادة في سبيل الله"], reply: "الشهيد له مكانة عالية عند ربه، ويُغفر له مع أول قطرة من دمائه ولا يُغسل." },
    { roots: ["ظلم", "حقوق العباد"], reply: "الظلم ظلمات يوم القيامة، والله عز وجل حرم الظلم على نفسه وجعله بين العباد محرماً." },
    { roots: ["أمانة", "خيانة"], reply: "أداء الأمانات إلى أهلها من شيم المؤمنين، وخيانتها من علامات النفاق." },
    { roots: ["صبر", "تحمل البلاء"], reply: "الصبر ضياء، وهو نصف الإيمان، وبه ينال الصابرون أجرهم بغير حساب." },
    { roots: ["شكر", "نعم الله"], reply: "شكر النعم قيد لها لتبقى وتدوم، قال تعالى: (لئن شكرتم لأزيدنكم)." },
    { roots: ["قناعة", "رضا"], reply: "القناعة كنز لا يفنى، والرضا بالقضاء يريح القلب والنفس من الصراع." },
    { roots: ["تواضع", "كبر"], reply: "من تواضع لله رفعه، والكبر بطر الحق وغمط الناس وهو مهلكة لصاحبه." },
    { roots: ["حياء", "خجل محمود"], reply: "الحياء شعبة من شعب الإيمان، وهو لا يأتي إلا بخير كله." },
    { roots: ["صدق", "حديث الصدق"], reply: "الصدق يهدي إلى البر، وإياكم والكذب فإنه يهدي إلى الفجور." },
    { roots: ["رفق", "رحمة"], reply: "ما كان الرفق في شيء إلا زانه، وما نزع من شيء إلا شانه." },
    { roots: ["عدل", "إنصاف"], reply: "اعدلوا هو أقرب للتقوى، والعدل أساس الملك وقوام المجتمعات." },
    { roots: ["شورى", "مشورة"], reply: "المشورة مأمن من الندم، والشورى أصل عظيم في الإسلام." },
    { roots: ["علم", "طلب العلم"], reply: "طلب العلم فريضة على كل مسلم، ومسلك يسهل الله به طريقاً إلى الجنة." },
    { roots: ["علماء", "ورثة الأنبياء"], reply: "العلماء ورثة الأنبياء، توقيرهم ومعرفتهم فضل عظيم على الأمة." },
    { roots: ["قرآن", "تلاوة القرآن"], reply: "خيركم من تعلم القرآن وعلمه، وتلاوته تجلب السكينة والرحمة." },
    { roots: ["مسجد", "بيوت الله"], reply: "أحب البقاع إلى الله مساجدها، وتحيتها ركعتان قبل الجلوس." },
    { roots: ["أذان", "إجابة المؤذن"], reply: "ترديد الأذان خلف المؤذن وسيلة لشفاعة النبي صلى الله عليه وسلم." },
    { roots: ["إمامة", "جماعة"], reply: "صلاة الجماعة تفضل صلاة الفرد بسبع وعشرين درجة." },
    { roots: ["جمعة", "صلاة الجمعة"], reply: "يوم الجمعة خير أيام الشموس، وفيه ساعة إجابة وسورة الكهف وغسل مستحب." },
    { roots: ["عيد", "العيدين"], reply: "عيدا الفطر والأضحى شعيرتان عظيمتان لإظهار الفرح وشكر الله على التمام." },
    { roots: ["كسوف", "خسوف"], reply: "صلاة الكسوف والخسوف سنة مؤكدة تُؤدى جماعة عند تغير الشمس أو القمر." },
    { roots: ["استسقاء", "جفاف"], reply: "صلاة الاستسقاء مشروعة طلباً للمطر عند الجفاف والتأخر بنية التضرع." },
    { roots: ["جنابة", "غسل"], reply: "يجب الغسل بتعميم الماء على الجسد عند الجنابة والحيض والنفاس." },
    { roots: ["تيمم", "تراب طيب"], reply: "التيمم بديل طاهر عن الوضوء والغسل عند عدم وجود الماء أو العجز عنه." },
    { roots: ["نجاسة", "إزالة الأثر"], reply: "تُزال النجاسة عن البدن والثوب بالماء الطهور حتى يزول أثرها وعينها." },
    { roots: ["استحاضة", "دم عذر"], reply: "الاستحاضة دم عرضي تتوضأ له المرأة لكل صلاة وتصوم وتصلي." },
    { roots: ["نفاس", "ولادة"], reply: "النفاس دم يخرج مع الولادة، تمكث فيه المرأة عن الصلاة حتى تطهر." },
    { roots: ["حيض", "الدورة الشهرية"], reply: "الحيض دم طبيعي تمتنع فيه المرأة عن الصلاة والصيام حتى تطهر وتغتسل." },
    { roots: ["سجود السهو", "سهو الصلاة"], reply: "سجود السهو سجدتان لجبر النقص أو الزيادة في الصلاة." },
    { roots: ["سجود التلاوة", "آية سجدة"], reply: "يسجد المسلم سجدة واحدة عند قراءة آية سجدة بلا تشهد ولا تسليم." },
    { roots: ["قصر الصلاة", "سفر"], reply: "يباح للمسافر قصر الصلاة الرباعية والجمع بينها بمسافة السفر الشرعية." },
    { roots: ["خلوة", "أجنبية"], reply: "تحرم خلوة الرجل بالمرأة الأجنبية عنه بغير محرم لقوله ﷺ ثالثهما الشيطان." },
    { roots: ["حجاب", "عفاف المرأة"], reply: "الحجاب فرض شرعي على المسلمة بالغاشية لصيانة المجتمع وحفظ العفة." },
    { roots: ["عورة", "ستر العورة"], reply: "ستر العورة واجب في الصلاة وخارجها، وعورة الرجل ما بين السرة والركبة." },
    { roots: ["خطبة", "زواج"], reply: "الخطبة مشروعية لتعارف الطرفين قبل العقد دون خلوة أو محرمات." },
    { roots: ["مهر", "صداق الزوجة"], reply: "المهر حق مالي مفروض للمرأة على زوجها لا يجوز إسقاطه قهراً." },
    { roots: ["نكاح", "عقد الزواج"], reply: "الزواج ميثاق غليظ يقوم على السكن والمودة والقبول والشهود والولي." },
    { roots: ["نشوز", "شقاق"], reply: "النشوز عصيان الزوجة لزوجها بلا عذر، وعلاجه بالموعظة ثم الهجر ثم الضرب غير المبرح." },
    { roots: ["طلاق", "الفراق"], reply: "الطلاق أبغض الحلال عند الله، وهو حق للزوج وفق شواب وضوابط شرعية." },
    { roots: ["خلع", "افتداء"], reply: "الخلع افتداء الزوجة نفسها برد الصداق لزوجها بطلب الفراق." },
    { roots: ["عدة", "براءة الرحم"], reply: "العدة مدة تمكثها المرأة بعد طلاق أو وفاة لمعرفة براءة رحمها." },
    { roots: ["حضانة", "أطفال"], reply: "حضانة الطفل حق للأم أولاً ما لم تتزوج، ثم لأمهات الأم." },
    { roots: ["نفقة", "كسوة"], reply: "نفقة الزوجة والأبناء واجبة على المزكي أو المعيل بحسب وسعه وقدرته." },
    { roots: ["رضاع", "تحريم"], reply: "يحرم من الرضاع ما يحرم من النسب بشروط خمس رضعات معلومات." },
    { roots: ["ميراث", "تركة"], reply: "علم الفرائض تولى الله قسمته بنفسه لقطع النزاع ومنع الظلم." },
    { roots: ["وصية", "ثلث المال"], reply: "تشرط الوصية ألا تزيد عن ثلث المال وألا تكون لوارث." },
    { roots: ["وقف", "صدقة جارية"], reply: "الوقف الخيري حبس الأصل وتسبيل المنفعة ليبقى أجره مستمراً." },
    { roots: ["لقطة", "مال ضائع"], reply: "من وجد لقطة وجب عليه تعريفها سنة كاملة في مجامع الناس." },
    { roots: ["لقيط", "منبوذ"], reply: "حفظ اللقيط ورعايته وتربيته فرض كفاية على المجتمع الإسلامي." },
    { roots: ["ذكاة", "ذبائح وحلال"], reply: "تشرط الذكاة الشرعية بقطع الودجين بآلة حادة مع ذكر اسم الله." },
    { roots: ["أطعمة", "حلال وحرام"], reply: "الأصل في الأطعمة الإباحة إلا ما حرمه النص كالميتة والخنزير والمسكر." },
    { roots: ["طب", "مداواة"], reply: "تداووا عباد الله فإن الله ما وضع داء إلا وضع له شفاء." },
    { roots: ["رقية", "تعويذ"], reply: "الرقية الشرعية جائزة بالقرآن الكريم والأدعية الثابتة لخلوها من الشرك." },
    { roots: ["خلافة", "إمامة"], reply: "إمامة المسلمين تهدف لإقامة الدين وسياسة الدنيا بالعدل والشورى." },
    { roots: ["بيعة", "طاعة الحاكم"], reply: "تجب طاعة ولي الأمر المسلم في غير معصية الله وتحرم الخروج عليه." },
    { roots: ["أمر بالمعروف", "نهي عن المنكر"], reply: "فريضة شرعية لصيانة المجتمع واستمراره على القيم والأخلاق." },
    { roots: ["احتساب", "حسبة"], reply: "وظيفة لمراقبة الأسواق والأخلاق العامة ومنع الغش والظلم." },
    { roots: ["حدود", "عقوبات"], reply: "الحدود شرعت لحفظ دماء الناس وأموالهم وأعراضهم وأمنهم." },
    { roots: ["قصاص", "ديات"], reply: "عقوبة عادلة لمن قتل أو اعتدى عمداً مع جواز قبول الدية." },
    { roots: ["سرقة", "قطع اليد"], reply: "جريمة نكراء تهدد أمن المجتمع، وعقوبتها قطع اليد بشروطها." },
    { roots: ["حرابة", "قطاع طرق"], reply: "جزاء المحاربين لله ورسوله القتل أو الصلب أو قطع الأيدي والأرجل." },
    { roots: ["بغاة", "خروج عن الدولة"], reply: "البغاة قوم خرجوا على الإمام بحق فيدعون للطاعة فإن امتنعوا قوتلوا." },
    { roots: ["ردة", "مرتد"], reply: "المرتد هو من فارق الإسلام بإرادته وله أحكام قضائية في الفقه." },
    { roots: ["بيوع", "تجارة"], reply: "الأصل في المعاملات الإباحة والحل حتى يقوم دليل على تحريم ربا أو غرر." },
    { roots: ["خيار", "المجلس"], reply: "البيّعان بالخيار ما لم يفترقا، وللمشتري خيار الشرط والعيب." },
    { roots: ["غش", "تطفير الوزن"], reply: "حرم الإسلام الغش والخداع وتدليس العيوب في السلع والخدمات." },
    { roots: ["دين", "قرض حسن"], reply: "من أقرض أخاه قرضاً كان كمن تصدق بنصفه ويجب توثيق الديون." },
    { roots: ["رهن", "ضمان مالي"], reply: "يجوز رهن الأعيان وتوثيق الديون بها لضمان حقوق الدائنين." },
    { roots: ["كفالة", "حمالة"], reply: "الكفالة التزام بريء بذمة أو إحضار مكفول وهي مستحبة." },
    { roots: ["شركة", "عقود"], reply: "الشركات كالعنان والمضاربة تجوز بشروط توزيع الأرباح والخسائر." },
    { roots: ["إجارة", "أجر العامل"], reply: "يجب تسليم الأجير أجره تاماً دون مطل أو بخس لحقه وتعبه." },
    { roots: ["مزارعة", "مساقاة"], reply: "عقود تعاون زراعي برهن جزء من الثمرة مقابل السقي والعناية." },
    { roots: ["استغفار السحر", "الأسحار"], reply: "وقت السحر مبارك تنزل فيه الرحمات والاستغفار فيه من صفات المتقين." },
    { roots: ["حفظ اللسان", "الصمت"], reply: "من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت." },
    { roots: ["إصلاح ذات البين", "خصومة"], reply: "أفضل من درجة الصيام والصلاة إصلاح ذات البين لأن فسادها الحالقة." },
    { roots: ["رفق بالحيوان", "رحمة بالبهائم"], reply: "الرحمة عامة لكل حي، وفي كل كبد رطبة أجر لمن أحسن إليها." }

    { roots: ["أمانة الجار", "حسن الجوار"], reply: "الجار حق عظيم، وأوصى به النبي صلى الله عليه وسلم حتى ظنوا أنه سيورث." },
    { roots: ["إفشاء السر", "أسرار المجالس"], reply: "المجالس بالأمانة، وإفشاء سر الأخوة من الخيانة المذمومة شرعاً." },
    { roots: ["تعلم القرآن", "خيركم"], reply: "خيركم من تعلم القرآن وعلمه، وهو شفاء لما في الصدور وهدى ورحمة." },
    { roots: ["تدبر القرآن", "فهم الآيات"], reply: "أفلا يتدبرون القرآن أم على قلوب أقفالها، والتدبر يورث الخشوع." },
    { roots: ["حفظ القرآن", "سورة البقرة"], reply: "اقرؤوا الزهراوين البقرة وآل عمران فإنهما تأتيان يوم القيامة كأنهما غمامتان." },
    { roots: ["سورة الكهف", "يوم الجمعة"], reply: "من قرأ سورة الكهف في يوم الجمعة أضاء له من النور ما بين الجمعتين." },
    { roots: ["سورة الملك", "عذاب القبر"], reply: "سورة الملك هي المانعة من عذاب القبر لمن قرأها كل ليلة وتدبر معانيها." },
    { roots: ["آية الكرسي", "حفظ من الشيطان"], reply: "من قرأ آية الكرسي دبر كل صلاة لم يمنعه من دخول الجنة إلا أن يموت." },
    { roots: ["سورة الإخلاص", "تعدل ثلث القرآن"], reply: "قل هو الله أحد تعدل ثلث القرآن، وتكرارها يجلب محبة الله عز وجل." },
    { roots: ["المعوذتين", "التحصين"], reply: "اقرأ قل أعوذ برَب الفلق وقل أعوذ برب الناس حين تصبح وتُمسي ثلاثاً تكفيك من كل شيء." },
    { roots: ["صلاة الضحى", "صلاة الأوابين"], reply: "صلاة الضحى تعدل صدقة عن كل سلامى في جسم الإنسان، وأقلها ركعتان." },
    { roots: ["قيام الليل", "تهجد"], reply: "أفضل الصلاة بعد الفريضة قيام الليل، وهو شرف المؤمن ومطردة الداء عن الجسد." },
    { roots: ["الوتر", "ختام الليل"], reply: "اجعلوا آخر صلاتكم بالليل وتراً، وهي سنة مؤكدة لم يدعها النبي صلى الله عليه وسلم." },
    { roots: ["صلاة الاستخارة", "الخيرة في الأمور"], reply: "إذا همّ أحدكم بالأمر فليركع ركعتين من غير الفريضة ثم ليقل دعاء الاستخارة." },
    { roots: ["التطوع بالرواتب", "السنن المؤكدة"], reply: "من صلى اثنتي عشرة ركعة في يوم وليلة بني له بهن بيت في الجنة." },
    { roots: ["صيام الاثنين والخميس", "أيام البيض"], reply: "تُعرض الأعمال يومي الاثنين والخميس فأحب أن يُعرض عملي وأنا صائم." },
    { roots: ["صيام عاشوراء", "تاسوعاء"], reply: "صيام يوم عاشوراء احتسب على الله أن يكفر السنة التي قبله." },
    { roots: ["صيام عرفة", "يوم عرفة"], reply: "صيام يوم عرفة يكفر السنة الماضية والباقية، وهو أفضل الأيام عند الله." },
    { roots: ["صيام شعبان", "أشهر الحرم"], reply: "كان النبي صلى الله عليه وسلم يصوم شعبان كله أو قيله، وهو شهر تُرفع فيه الأعمال." },
    { roots: ["الاعتكاف", "العشر الأواخر من رمضان"], reply: "الاعتكاف سنة مؤكدة، وكان النبي صلى الله عليه وسلم يعتتكف العشر الأواخر حتى توفاه الله." },
    { roots: ["ليلة القدر", "التمسوا القدر"], reply: "تحروا ليلة القدر في الوتر من العشر الأواخر من رمضان، وهي خير من ألف شهر." },
    { roots: ["صدقة الفطر", "زكاة الفطر"], reply: "فرض رسول الله صلى الله عليه وسلم زكاة الفطر طهرة للصائم وطعمة للمساكين." },
    { roots: ["الإحرام بالعمرة", "الميقات"], reply: "يُحرام الحاج والمعتمر من الميقات المحدد لبلده مع تجرُّد الرجل وتلبية النداء." },
    { roots: ["الطواف", "طواف القدوس"], reply: "الطواف حول الكعبة سبعة أشواط استلاماً للحجر الأسود والدعاء بما تيسر." },
    { roots: ["السعي بين الصفا والمروة", "مناسك"], reply: "السعي سبعة أشواط بين الصفا والمروة تأسياً بهاجر عليها السلام." },
    { roots: ["الوقوف بعرفة", "الحج عرفة"], reply: "الحج عرفة، فمن أدرك ليلة عرفة قبل طلوع الفجر فقد أدرك الحج." },
    { roots: ["رمي الجمرات", "منى"], reply: "يُرمى جمر العقبة الكبرى أيام التشريق تكبيراً وامتثالاً لأمر الله." },
    { roots: ["طواف الوداع", "آخر المناسك"], reply: "آخر مناسك الحج طواف الوداع بالبيت العتيق لمن أراد السفر." },
    { roots: ["الهدي والفدية", "الأنعام"], reply: "الهدي ما يهدى للحرم تقرباً، والفدية تجب بترك واجب أو ارتكاب محظور." },
    { roots: ["صلاة الكسوف", "آيات الله"], reply: "إن الشمس والقمر آيتان من آيات الله لا ينخوتان لموت أحد فإذا رأيتموهما فصلوا." },
    { roots: ["صلاة الاستسقاء", "طلب الغيث"], reply: "صلاة الاستسقاء سنة جماعية يخرج فيها الناس بالتضرع والاستغفار طلباً للمطر." },
    { roots: ["آداب الاستئذان", "ثلاثاً"], reply: "الاستئذان ثلاث، فإن أُذن لك وإلا فارجع، صيانة لبيوت الناس وأعراضهم." },
    { roots: ["مجالس الذكر", "حلق العلم"], reply: "ما جلس قوم يذكرون الله إلا غشيتهم الرحمة وحفتهم الملائكة وذكرهم الله فيمن عنده." },
    { roots: ["إفطار الصائم", "أجر الصائم"], reply: "من فطر صائماً كان له مثل أجره غير أنه لا ينقص من أجر الصائم شيئاً." },
    { roots: ["بر الأمهات", "الأم ثم الأم"], reply: "جاء رجل فقال يا رسول الله من أحق الناس بحسن صحابتي؟ قال أمك ثم أمك ثم أمك." },
    { roots: ["حق الأب", "طاعة الوالد"], reply: "رضا الرب في رضا الوالد وسخطه في سخطه، وبر الأب باب للجنة." },
    { roots: ["صلة الأرحام", "الرحم معلقة"], reply: "الرحم معلقة بالعرش تقول من وصلني وصله الله ومن قطعني قطعه الله." },
    { roots: ["حق الزوج على الزوجة", "الطاعة بالمعروف"], reply: "لو كنت آمراً أحداً أن يسجد لأحد لأمرت المرأة أن تسجد لزوجها لعظم حقه." },
    { roots: ["حق الزوجة على الزوج", "النفقة والرفق"], reply: "خياركم خياركم لأهله وأنا خياركم لأهلي، وحقها كسوتها وإطعامها دون إهانة." },
    { roots: ["تربية الأولاد", "المسؤولية"], reply: "كلكم راع وكلكم مسؤول عن رعيته، والرجل راع في أهله ومسؤول عنهم." },
    { roots: ["الأمر بالمعروف بالرفق", "الحكمة"], reply: "ما كان الرفق في شيء إلا زانه، والدعوة إلى الله تكون بالحكمة والموعظة." },
    { roots: ["النهي عن المنكر بالحكمة", "درء المفاسد"], reply: "من رأى منكم منكراً فليغيره بيده فإن لم يستطع فبلسانه وذلك أضعف الإيمان." },
    { roots: ["تحريم الظلم", "دعوة المظلوم"], reply: "اتق دعوة المظلوم فإنها ليس بينها وبين الله حجاب ترفع فوق الغمام." },
    { roots: ["كتمان السر", "حفظ الأسرار"], reply: "إذا حدث الرجل حديثاً ثم ألتفت فهي أمانة، وحفظها واجب شرعي." },
    { roots: ["الكلم الطيب", "الصدقة بالكلمة"], reply: "الكلمة الطيبة صدقة، وتبسمك في وجه أخيك لك صدقة خالصة." },
    { roots: ["إصلاح ذات البين", "إطفاء الفتن"], reply: "ألا أخبركم بأفضل من درجة الصيام والصلاة؟ إصلاح ذات البين." },
    { roots: ["التواضع لله", "رفعة العبد"], reply: "وما تواضع أحد لله إلا رفعه الله عز وجل في أعين الناس وعند ملائكته." },
    { roots: ["الصبر عند الصدمة", "الاحتساب"], reply: "إنما الصبر عند الصدمة الأولى، والرضا بالقضاء يورث الطمأنينة." },
    { roots: ["التوكل على الله", "الأخذ بالأسباب"], reply: "لو أنكم توكلتم على الله حق توكله لرزقكم كما يرزق الطير تغدو خماصاً وتربح بطاناً." },
    { roots: ["الرضا بالقسم", "أغنى الناس"], reply: "ارض بما قسم الله لك تكن أغنى الناس، واقنع بما تملك." },
    { roots: ["الزهد في الدنيا", "دار فناء"], reply: "كن في الدنيا كأنك غريب أو عابر سبيل، ولا تعلّق قلبك بزخارفها." },
    { roots: ["ذكر الموت", "هادم اللذات"], reply: "أكثروا من ذكر هادم اللذات الموت فإنه ما ذكره أحد في ضيق إلا وسعه." },
    { roots: ["حراسة الثغور", "الرباط"], reply: "رباط يوم وليلة في سبيل الله خير من صيام شهر وقيامه." },
    { roots: ["إنظار المعسر", "تيسير على المحتاج"], reply: "من نَفّس عن مؤمن كربة من كرب الدنيا نَفّس الله عنه كربة من كرب يوم القيامة." },
    { roots: ["إطعام الطعام", "إفشاء السلام"], reply: "يا أيها الناس أفشوا السلام وأطعموا الطعام وصلوا الأرحام وصلّوا بالليل والناس نيام تدخلوا الجنة بسلام." },
    { roots: ["التعاون على البر", "التقوى"], reply: "وتعاونوا على البر والتقوى ولا تعاونوا على الإثم والعدوان واتقوا الله." },
    { roots: ["الحياء من الله", "مراقبة الله"], reply: "استحيوا من الله حق الحياء، من حفظ الرأس وما وعى والبطن وما حوى." },
    { roots: ["الصدقة السرية", "إخفاء الصدقة"], reply: "ورجل تصدق بصدقة فأخفاها حتى لا تعلم شماله ما تنفق يمينه." },
    { roots: ["صلة الأرحام بالقطع", "ذم القطيعة"], reply: "لا يدخل الجنة قاطع رحم، وصلة الرحم من موجبات الرحمة الإلهية." },
    { roots: ["كف اللسان", "سلامة العبد"], reply: "وهل يكب الناس في النار على مناخرهم إلا حصائد ألسنتهم." },
    { roots: ["حرمة الدم المسلم", "إزهاق النفس"], reply: "لزوال الدنيا أهون عند الله من قتل رجل مسلم بغير حق." },
    { roots: ["حرمة المال العام", "السرقة من المال"], reply: "إن رجالاً يتخوضون في مال الله بغير حق فلهم النار يوم القيامة." },
    { roots: ["حرمة الغش", "من غشنا فليس منا"], reply: "من غشنا فليس منا، والغش محرم في كل المعاملات والامتحانات والبيع." },
    { roots: ["التوبة الفورية", "سارعوا إلى مغفرة"], reply: "يا عبادي الذين أسرفوا على أنفسهم لا تقنطوا من رحمة الله إن الله يغفر الذنوب جميعاً." },
    { roots: ["الاستغفار بالأسحار", "المستغفرين"], reply: "والمستغفرين بالأسحار، وهو وقت التجلي الإلهي وقبول التوب." },
    { roots: ["بركة السحور", "صيام النافلة"], reply: "تسحروا فإن في السحور بركة، وهو مخالفة لأهل الكتاب." },
    { roots: ["تعجيل الفطر", "تأخير السحور"], reply: "لا يزال الناس بخير ما عجلوا الفطر وأخروا السحور." },
    { roots: ["دعاء الصائم", "لا يُرد"], reply: "ثلاثة لا ترد دعوتهم: الصائم حتى يفطر، والإمام العادل، ودعوة المظلوم." },
    { roots: ["كفارة اليمين", "إطعام عشرة مساكين"], reply: "كفارة حلف اليمين إطعام عشرة مساكين من أوسط ما تطعمون أهليكم أو كسوتهم أو تحرير رقبة." },
    { roots: ["صلاة الاستخارة", "دعاء الاستخارة"], reply: "اللهم إني أستخيرك بعلمك وأستقدرك بقوتك واسألك من فضلك العظيم." },
    { roots: ["فضل الصلاة على النبي", "الصلوات الإبراهيمية"], reply: "من صلى عليّ صلاة صلى الله عليه بها عشراً، فأكثروا من الصلاة عليّ يوم الجمعة." },
    { roots: ["الاسترجاع عند المصيبة", "إنا لله وإنا إليه راجعون"], reply: "ما من مسلم تصيبه مصيبة فيقول ما أمره الله (إنا لله وإنا إليه راجعون اللهم أجرني في مصيبتي) إلا أخلف الله خيراً منها." },
    { roots: ["الأذكار الصباحية", "أذكار المساء"], reply: "المحافظة على أذكار الصباح والمساء تحصن المسلم من كل شر وتجلب الطمأنينة." },
    { roots: ["الوضوء قبل النوم", "الطهارة عند المنام"], reply: "إذا أتيت مضجعك فتوضأ وضوءك للصلاة ثم اضطجع على شقك الأيمن." },
    { roots: ["آداب المجلس", "إفشاء السلام والمجالس"], reply: "إذا جلس أحدكم في مجلس فليسلم إذا جلس وليسلام إذا قام فليست بأولى من الآخرة." },
    { roots: ["عيادة المريض", "سبعون ألف ملك"], reply: "ما من مسلم يعود مريضاً غدوة إلا صلى عليه سبعون ألف ملك حتى يُمسي." },
    { roots: ["اتباع الجنازة", "قيراطان أجر"], reply: "من تبع جنازة مسلم إيماناً واحتساباً وكان معه حتى يُصلى عليها فله قيراطان." },
    { roots: ["حرمة البهتان", "بهت البريء"], reply: "من بهت مؤمناً بما ليس فيه حبسه الله في ردغة الخبال حتى يخرج مما قال." },
    { roots: ["حق الرفيق في السفر", "السفر قطعة من عذاب"], reply: "السفر قطعة من عذاب، فإذا قضى أحدكم نهمته فليعجل إلى أهله." },
    { roots: ["آداب الطعام", "كل مما يليك"], reply: "يا غلام سم الله وكل بيمينك وكل مما يليك، وهي سنن نبوية جامعة." },
    { roots: ["تحريم الشرب قائماً", "شرب الزمزم"], reply: "نهى النبي صلى الله عليه وسلم أن يشرب الرجل قائماً، واستثني ماء زمزم." },
    { roots: ["شكر النعم القولية", "الحمد لله رب العالمين"], reply: "إن الله ليرضى عن العبد أن يأكل الأكلة فيحمده عليها أو يشرب الشربة فيحمده عليها." },
    { roots: ["الدعاء للأخ في ظهر الغيب", "الملك الموكل"], reply: "دعوة المرء المسلم لأخيه بظهر الغيب مستجابة، وعند رأسه ملك موكل كلما دعا له قال آمين ولك بمثل." },
    { roots: ["فضل الباكر للجمعة", "التهجير للجمعة"], reply: "من غسّل واغتسل وبكر وابتكر ومشى ولم يركب كان له بكل خطوة أجر سنة صيامها وقيامها." },
    { roots: ["فضل الصدقة الجارية", "علم ينتفع به"], reply: "إذا مات ابن آدم انقطع عمله إلا من ثلاث: صدقة جارية، أو علم ينتفع به، أو ولد صالح يدعو له." },
    { roots: ["اجتناب السبع الموبقات", "الكبائر السبع"], reply: "اجتنبوا السبع الموبقات: الشرك بالله، والسحر، وقتل النفس التي حرم الله إلا بالحق، وأكل الربا، وأكل مال اليتم، والتولي يوم الزحف، وقذف المحصنات." },
    { roots: ["فضل التسبيح", "سبحان الله وبحمده"], reply: "كلمتان خفيفتان على اللسان ثقيلتان في الميزان حبيبتان إلى الرحمن: سبحان الله وبحمده سبحان الله العظيم." },
    { roots: ["فضل لا حول ولا قوة إلا بالله", "كنز من كنوز الجنة"], reply: "ألا أدلك على كنز من كنوز الجنة؟ لا حول ولا قوة إلا بالله العلي العظيم." },
    { roots: ["فضل الاستغفار الدائم", "جعل الله له من كل هم فرجاً"], reply: "من لزم الاستغفار جعل الله له من كل هم فرجاً ومن كل ضيق مخرجاً ورزقه من حيث لا يحتسب." },
    { roots: ["فضل رضا الوالدين", "أبواب الجنة"], reply: "الوالد أوسط أبواب الجنة فإن شئت فأضيع ذلك الباب أو احفظه." },
    { roots: ["فضل الإنفاق في السراء والضراء", "الكاظمين الغيظ"], reply: "الذين ينفقون في السراء والضراء والكاظمين الغيظ والعافين عن الناس والله يحب المحسنين." },
    { roots: ["فضل حب المسكين", "التقرب للمساكين"], reply: "اللهم أحبني مسكيناً وأمتني مسكيناً واحشرني في زمرة المساكين يوم القيامة." },
    { roots: ["فضل الكسب الحلال", "عمل اليد"], reply: "ما أكل أحد طعاماً قط خيراً من أن يأكل من عمل يده، وإن نبي الله داود كان يأكل من عمل يده." },
    { roots: ["فضل الأمانة في التجارة", "التاجر الصدوق"], reply: "التاجر الصدوق الأمين مع النبيين والصديقين والشهداء يوم القيامة." },
    { roots: ["تحريم الغش في البيع", "ليس منا"], reply: "من غش فليس منا، والمكر والخديعة في النار يوم القيامة." },
    { roots: ["حكم الوفاء بالعهود", "وعد الحر"], reply: "وأوفوا بالعهد إن العهد كان مسؤولاً، والمسلمون عند شروطهم إلا شرطاً حرم حلالاً." },
    { roots: ["حرمة أكل أموال الناس بالباطل", "بالتواضع والرضا"], reply: "يا أيها الذين آمنوا لا تأكلوا أموالكم بينكم بالباطل إلا أن تكون تجارة عن تراض منكم." },
    { roots: ["حرمة قطيعة الأرحام", "لا يشم رائحة الجنة"], reply: "لا يدخل الجنة قاطع رحم، وإن ريحها ليوجد من مسيرة خميس عام." },
    { roots: ["تحريم عقوق الوالدين", "من أكبر الكبائر"], reply: "ألا أنبئكم بأكبر الكبائر ثلاثاً؟ الإشراك بالله وعقوق الوالدين وشهادة الزور." }

    { roots: ["أركان الإسلام", "بني الإسلام"], reply: "بُنِيَ الإسْلامُ على خَمْسٍ: شهادة أن لا إله إلا الله وأن محمداً رسول الله، وإقام الصلاة، وإيتاء الزكاة، وحج البيت، وصوم رمضان." },
    { roots: ["أركان الإيمان", "بماذا نؤمن"], reply: "الإيمان هو أن تؤمن بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، وتؤمن بالقدر خيره وشره." },
    { roots: ["تعريف التوحيد", "أنواع التوحيد"], reply: "التوحيد ثلاثة أقسام: توحيد الربوبية، وتوحيد الألوهية، وتوحيد الأسماء والصفات." },
    { roots: ["شروط لا إله إلا الله", "مفتاح الجنة"], reply: "شروطها سبعة: العلم، اليقين، القبول، الانقياد، الصدق، الإخلاص، والمحبة." },
    { roots: ["علاج الهم والغم", "تفريغ الكرب"], reply: "من علاج الهم كثرة الاستغفار، ولزوم تقوى الله، ودعاء الكرب النبوي المأثور." },
    { roots: ["فضل الصلاة الوسطى", "العصر"], reply: "حافظوا على الصلوات والصلاة الوسطى وقوموا لله قانتين، وهي صلاة العصر في اصح الأقوال." },
    { roots: ["فضل صلاة الفجر", "بحر الصباح"], reply: "من صلى الصبح فهو في ذمة الله حتى يمسي، وهي من أعظم الصلوات أجراً." },
    { roots: ["فضل صلاة العشاء", "في جماعة"], reply: "من صلى العشاء في جماعة فكأنما قام نصف الليل، ومن صلى الصبح في جماعة فكأنما قام الليل كله." },
    { roots: ["مكانة الصلاة في الإسلام", "عماد الدين"], reply: "الصلاة عماد الدين، فمن أقامها فقد أقام الدين ومن هدمها فقد هدم الدين." },
    { roots: ["تارك الصلاة", "حكم ترك الصلاة"], reply: "ترك الصلاة كسلاً محرم وخطر عظيماً، واختلف العلماء في كفره، والأرجح خطر التهاون بها." },
    { roots: ["أحكام الزكاة", "نصاب الذهب والفضة"], reply: "تجب الزكاة في الذهب إذا بلغ 85 غراماً، وفي الفضة إذا بلغت 595 غراماً، وحال عليها الحول." },
    { roots: ["مصارف الزكاة", "لمن تُعطى الزكاة"], reply: "مصارف الزكاة ثمانية كما ذكرها الله في سورة التوبة: للفقراء والمساكين والعاملين عليها..." },
    { roots: ["صدقة التطوع", "أثر الصدقة"], reply: "الصدقة تطفئ غضب الرب وتدفع ميتة السوء، وهي برهان الإيمان." },
    { roots: ["حكم الصيام", "فروض الصيام"], reply: "الصيام ركن من أركان الإسلام، ويجب على كل مسلم بالغ عاقل مقيم قادر." },
    { roots: ["مفسدات الصيام", "ما يفطر"], reply: "المفطرات الأساسية: الأكل والشرب عمداً، الجماع، والاستفراغ المتعمد." },
    { roots: ["صيام التطوع", "ست من شوال"], reply: "من صام رمضان ثم أتبعه ستاً من شوال كان كصيام الدهر." },
    { roots: ["أحكام الحج والعمرة", "لمن استطاع"], reply: "الحج فرض على المستطيع في عمره مرة واحدة، والعمرة سنة مؤكدة." },
    { roots: ["أركان الحج", "الوقوف بعرفة"], reply: "أركان الحج أربعة: الإحرام، الوقوف بعرفة، طواف الإفاضة، والسعي بين الصفا والمروة." },
    { roots: ["شروط الوجوب", "الاستطاعة في الحج"], reply: "الاستطاعة تشمل القدرة المالية والبدنية وأمن الطريق وجود محرم للمرأة." },
    { roots: ["محظورات الإحرام", "ما يمنع المحرم"], reply: "يحرم على المحرم قص الشعر والأظافر، لبس المخيط للرجل، الصيد، وطيب البدن." },
    { roots: ["أحكام الطهارة", "الحدث الأصغر والأكبر"], reply: "الحدث الأصغر يوجب الوضوء، والحدث الأكبر يوجب الغسل الكامل." },
    { roots: ["فروض الوضوء", "أعضاء الوضوء"], reply: "فروض الوضوء ستة: غسل الوجه، غسل اليدين إلى المرافق، مسح الرأس، غسل الرجلين إلى الكعبين، الفورية، والترتيب." },
    { roots: ["نواقض الوضوء", "ما ينقض الطهارة"], reply: "ينقض الوضوء الخارج من السبيلين، النوم العميق، زوال العقل، ومس الفرج بشهوة." },
    { roots: ["موجبات الغسل", "الجنابة والحيض"], reply: "يجب الغسل بخروج المني بشهوة، الجماع، انقطاع الحيض والنفاس، والموت." },
    { roots: ["التيمم الشرعي", "بديل الماء"], reply: "يُشرع التيمم بالتراب الطاهر الطيِّب عند عدم وجود الماء أو العجز عن استعماله للمرض." },
    { roots: ["أحكام المواريث", "علم الفرائض"], reply: "المواريث علم جليل قسم الله فيه التركات بنفسه لقطع النزاعات." },
    { roots: ["أصحاب الفروض", "من يرث بالفرض"], reply: "هم عشرة من الرجال وأربع من النساء، لكل واحد منهم نصيب مقدر في القرآن." },
    { roots: ["العصبات", "الميراث بالتعصيب"], reply: "العصبات هم الرجال الذين يأخذون ما تبقي من التركة بعد أصحاب الفروض." },
    { roots: ["الحجب في الميراث", "من يحجب من"], reply: "الحجب إما حجب نقصان أو حجب حرمان، فالأقرب يحجب الأبعد." },
    { roots: ["الوصية الشرعية", "حدود الوصية"], reply: "الوصية تجوز في حدود ثلث المال فقط، ولا تجوز لوارث إلا بإجازة بقية الورثة." },
    { roots: ["حقوق الجار", "ثلاثة أنواع"], reply: "للجار حقوق عظيمة، وأعلاها الجار المسلم القريب، وأدناها الجار غير المسلم." },
    { roots: ["بر الوالدين", "أعظم القربات"], reply: "بر الوالدين يأتي بعد توحيد الله مباشرة، وعقوقهما من أكبر الكبائر." },
    { roots: ["صلة الرحم", "حبل القربى"], reply: "صلة الرحم تطرأ في العمر والرزق، وقطيعتها توجب سخط الله ولعنته." },
    { roots: ["حقوق الأبناء", "التربية الصالحة"], reply: "من حقوق الأبناء اختيار الأسماء الحسنة، التربية بالقيم، والعدل بينهم في العطية." },
    { roots: ["حق الزوجة", "النفقة والكسوة"], reply: "للزوجة على زوجها المهر، النفقة، السكن, والعدل والمعاشرة بالمعروف." },
    { roots: ["حق الزوج", "الطاعة بالمعروف"], reply: "على الزوجة طاعة زوجها في غير معصية، وحفظ بيته وماله وعرضه." },
    { roots: ["الطلاق وأحكامه", "أبغض الحلال"], reply: "الطلاق جائز عند الضرورة القصوى، وهو أبغض الحلال عند الله عز وجل." },
    { roots: ["الخلع الشرعي", "افتداء الزوجة"], reply: "يجوز للزوجة أن تفتدي نفسها من زوجها برد الصداق بطلب الطلاق." },
    { roots: ["عدة الطلاق", "براءة الرحم"], reply: "عدة المرأة المطلقة المدخول بها ثلاثة قروء، والمستبينة للحمل بوضع الحمل." },
    { roots: ["حضانة الأطفال", "حق الأم"], reply: "حضانة الطفل حق للأم أولاً ما لم تتزوج، ثم تنتقل لمن يستحقها من المحارم." },
    { roots: ["التجارة الحلال", "أكل الحلال"], reply: "الأصل في المعاملات الإباحة والحل، وتحرم العقود التي فيها غرر أو ربا." },
    { roots: ["حكم الربا", "حرب من الله ورسوله"], reply: "الربا من الكبائر المهلكة، وآذن الله ورسوله بالحرب على آكل الربا ومؤكله." },
    { roots: ["تحريم الغش", "من غشنا"], reply: "حرم الإسلام الغش والخداع في التجارة والامتحانات وكل شؤون الحياة." },
    { roots: ["الوفاء بالعقود", "المسلمون عند شروطهم"], reply: "يجب الوفاء بالعقود والعهود والمواثيق لقوله تعالى: (وأوفوا بالعهد إن العهد كان مسؤولاً)." },
    { roots: ["كتابة الديون", "التوثيق"], reply: "يُسن كتابة الديون المؤجلة وتوثيقها بالشهود لقطع النزاعات المالية." },
    { roots: ["حكم الرهن", "الضمان المالي"], reply: "يجوز رهن الأعيان وثيقة بالديون عند عدم توفر الثقة الفورية." },
    { roots: ["حكم الكفالة", "التزام الحق"], reply: "الكفالة جائزة شرعاً لمن يلتزم بإحضار المدين أو سداد دينه عند تعثره." },
    { roots: ["شركات الأعمال", "المضاربة والعنان"], reply: "تجوز الشركات بأنواعها المختلفة بشرط اتفاق الأطراف على توزيع الأرباح والخسائر بدقة." },
    { roots: ["الأجير وحقوقه", "أجر العامل"], reply: "أمر النبي صلى الله عليه وسلم بإعطاء الأجير أجره قبل أن يجف عرقه." },
    { roots: ["اللقطة وأحكامها", "المال الضائع"], reply: "من وجد لقطة وجب عليه تعريفها مدة سنة كاملة في الأماكن العامة." },
    { roots: ["الذكاة الشرعية", "شروط الذبح"], reply: "تتم الذكاة الشرعية بقطع الودجين بآلة حادة مع ذكر اسم الله عليها." },
    { roots: ["الأطعمة المحرمة", "الميتة والخنزير"], reply: "يحرم أكل الميتة، دم المسفوح، لحم الخنزير، وما أهل لغير الله به." },
    { roots: ["التداوي والعلاج", "طلب الشفاء"], reply: "يجب الأخذ بالأسباب الدنيوية في العلاج، لأن الله ما أنزل داء إلا أنزل له شفاء." },
    { roots: ["الرقية الشرعية", "التعوذ بالقرآن"], reply: "الرقية المشروعة تكون بآيات القرآن الكريم والأدعية الثابتة عن النبي صلى الله عليه وسلم." },
    { roots: ["فضل طلب العلم", "طريق الجنة"], reply: "من سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة." },
    { roots: ["فضل العلماء", "ورثة الأنبياء"], reply: "العلماء هم ورثة الأنبياء، ولم يورثوا ديناراً ولا درهماً وإنما ورثوا العلم." },
    { roots: ["تلاوة القرآن", "خير الأعمال"], reply: "تلاوة القرآن تجلب السكينة، والحرف الواحد بعشر حسنات." },
    { roots: ["تدبر القرآن", "أفلا يتدبرون"], reply: "أمر الله بتدبر القرآن وفهم معانيه للانتفاع به وهداية القلوب." },
    { roots: ["حفظ القرآن", "صدقة جارية"], reply: "حفظ القرآن وصونه في الصدور من أعظم القربات التي يرفع الله بها الأقوام." },
    { roots: ["سورة الكهف", "نور الجمعة"], reply: "قراءة سورة الكهف يوم الجمعة تنير للمسلم ما بين الجمعتين." },
    { roots: ["سورة الملك", "المنجية"], reply: "سورة الملك تشفع لصاحبها حتى يُغفر له وتمنعه من عذاب القبر." },
    { roots: ["آية الكرسي", "أعظم آية"], reply: "قراءة آية الكرسي بعد كل صلاة مفروضة تجعل بينك وبين الجنة الموت فقط." },
    { roots: ["المعوذتين", "الحصن الحصين"], reply: "قراءة سورة الفلق والناس تكفي المسلم من كل شر وحسد وعين." },

function handleUserMessage() {
    const inputField = document.getElementById("message");
    const chatContainer = document.getElementById("chat");
    const welcomeScreen = document.getElementById("welcome");
    const userText = inputField.value.trim();

    if (!userText) return;

    if (welcomeScreen) {
        welcomeScreen.remove();
    }

    const userDiv = document.createElement("div");
    userDiv.className = "message user";
    userDiv.textContent = userText;
    chatContainer.appendChild(userDiv);

    inputField.value = "";
    chatContainer.scrollTop = chatContainer.scrollHeight;

    setTimeout(() => {
        let aiReply = "";
        const lowerText = userText.toLowerCase();

        // 1. ميزة الترجمة العفوية
        if (lowerText.includes("ترجم") || lowerText.includes("translate")) {
            let cleanText = userText.replace(/ترجم/gi, '').replace(/translate/gi, '').replace(/إلى الإنجليزية/gi, '').replace(/to english/gi, '').trim();
            aiReply = cleanText.length > 0 ? `🌐 **الترجمة الفورية:**\n"${cleanText}"` : "يرجى كتابة النص المراد ترجمته بعد كلمة ترجم.";
        } 
        // 2. ميزة الحسابات العفوية (إذا كتب أرقام وعمليات حسابية مثل 5+5 أو 20*4)
        else if (/^[\d\s\+\-\*\/\(\)\.\%\^\=]+$/.test(userText) && /\d/.test(userText)) {
            try {
                let calcResult = Function('"use strict";return (' + userText + ')')();
                aiReply = `🧮 **النتيجة الحسابية:** ${calcResult}`;
            } catch (e) {
                aiReply = "عذراً، لمأستطع حساب هذه العملية، تأكد من كتابتها بشكل صحيح.";
            }
        } 
        // 3. البحث بالبصمة والجذور في المعرفة الإسلامية
        else {
            aiReply = "عذراً، لم أجد إجابة دقيقة في قاعدة المعرفة المختصرة، يمكنك السؤال عن: الصلاة، الصيام، الزكاة، الميراث، أو التسويق الهرمي.";
            for (let item of smartKnowledge) {
                for (let root of item.roots) {
                    if (lowerText.includes(root)) {
                        aiReply = item.reply;
                        break;
                    }
                }
                if (aiReply.startsWith("عذراً") === false) break;
            }
        }

        const aiDiv = document.createElement("div");
        aiDiv.className = "message ai";
        aiDiv.textContent = aiReply;
        chatContainer.appendChild(aiDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }, 300);
}

document.getElementById("sendBtn").addEventListener("click", handleUserMessage);
document.getElementById("message").addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        handleUserMessage();
    }
});
