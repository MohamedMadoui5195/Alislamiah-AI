<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alislamiah-AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{font-family:Arial,"Tahoma",sans-serif;background:#060c16;color:#222;overflow:hidden;}
.header{height:68px;position:fixed;top:0;right:0;left:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#833ab4 0%,#c13584 28%,#e1306c 52%,#fd1d1d 72%,#f77737 100%);color:white;}
.header-title{font-size:23px;font-weight:bold;letter-spacing:.2px;}
.chat{position:absolute;top:68px;bottom:82px;right:0;left:0;overflow-y:auto;padding:22px 14px 25px;background:#060c16;}
.chat::-webkit-scrollbar{width:5px;}
.chat::-webkit-scrollbar-thumb{background:#d62976;border-radius:10px;}
.message{max-width:82%;padding:14px 17px;margin:13px 0;font-size:16px;line-height:1.75;border-radius:21px;animation:none !important;transition:none !important;word-wrap:break-word;}
.user{margin-right:auto;margin-left:0;color:white;background:linear-gradient(135deg,#feda75 0%,#fa7e1e 22%,#f56040 42%,#e1306c 65%,#c13584 82%,#833ab4 100%);border-bottom-right-radius:5px;box-shadow:0 5px 15px rgba(225,48,108,.20);}
.ai{margin-left:auto;margin-right:0;background:#ffffff;color:#202020;border:2px solid transparent;background-image:linear-gradient(#ffffff,#ffffff),linear-gradient(135deg,#feda75,#fa7e1e,#e1306c,#c13584,#833ab4);background-origin:border-box;background-clip:padding-box,border-box;border-bottom-left-radius:5px;box-shadow:0 4px 16px rgba(131,58,180,.10);}
.welcome{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.welcome h1{font-size:32px;margin-bottom:8px;background:linear-gradient(90deg,#833ab4,#e1306c,#f77737);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.welcome p{color:#888;font-size:15px;}
.input-area{position:fixed;bottom:0;right:0;left:0;height:82px;padding:13px 12px;background:#060c16;border-top:1px solid #17283e;z-index:20;}
.input-box{width:100%;height:55px;display:flex;align-items:center;border:2px solid transparent;border-radius:30px;background-image:linear-gradient(#fff,#fff),linear-gradient(90deg,#833ab4,#c13584,#e1306c,#fd1d1d,#f77737);background-origin:border-box;background-clip:padding-box,border-box;padding:4px;}
textarea{flex:1;height:45px;resize:none;border:none;outline:none;background:transparent;padding:11px 16px;font-family:Arial,"Tahoma",sans-serif;font-size:16px;color:#222;direction:rtl;}
textarea::placeholder{color:#aaa;}
.send{width:45px;height:45px;border:none;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,#833ab4,#c13584,#e1306c,#f77737);color:white;font-size:15px;font-weight:bold;flex-shrink:0;animation:none !important;transition:none !important;}
.send:disabled{opacity:.55;}
@media(max-width:600px){
    .header{height:62px;}
    .header-title{font-size:21px;}
    .chat{top:62px;bottom:78px;padding:18px 10px;}
    .message{max-width:86%;font-size:15.5px;padding:12px 15px;}
    .input-area{height:78px;padding:11px 9px;}
    .input-box{height:54px;}
    textarea{font-size:15px;}
}
</style>
</head>
<body>

<div id="alislamiah-chat-box" style="font-family:Arial,sans-serif;background:#060c16;color:#fff;padding:20px;border-radius:12px;max-width:450px;margin:auto;box-shadow:0 4px 15px rgba(0,0,0,0.5);">
    <h3 style="text-align:center;color:#f77737;margin-bottom:15px;">Alislamiah-AI</h3>
    <div id="chat-messages" style="height:320px;overflow-y:auto;background:#111;padding:12px;margin-bottom:12px;border-radius:8px;display:flex;flex-direction:column;gap:8px;"></div>
    <div style="display:flex;gap:8px;">
        <input type="text" id="chat-input" placeholder="اكتب سؤالك هنا..." style="flex:1;padding:10px 14px;border-radius:8px;border:none;outline:none;font-size:14px;direction:rtl;" onkeydown="if(event.key==='Enter')sendUserMessage()">
        <button onclick="sendUserMessage()" style="padding:10px 16px;background:linear-gradient(135deg,#833ab4,#e1306c);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">إرسال</button>
    </div>
</div>



<script>
// قاعدة بيانات موسعة جداً لتغطية جميع المواضيع والطلبات
const siteDatabase = [
    // التحيات والترحيب
    {q: ["سلام", "مرحباً", "السلام", "اهلا", "حيّاك", "صباح", "مساء", "السلاَم"], a: "وعليكم السلام ورحمة الله وبركاته! أهلاً بك في منصة Alislamiah-AI."},
    {q: ["من أنت", "اسمك", "ما هو أنت", "تعريف"], a: "أنا مساعد Alislamiah-AI الذكي المدمج في موقعك لخدمة الزوار."},
    {q: ["كيف حالك", "شلونك", "أخبارك"], a: "الحمد لله بخير ونعمة، كيف يمكنني مساعدتك اليوم؟"},
    
    // القرآن الكريم وعلومه
    {q: ["قرآن", "آية", "سورة", "تلاوة", "مصصحف", "القرآن"], a: "قال الله تعالى في محكم تنزيله: (وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ)."},
    {q: ["سورة البقرة", "البقرة"], a: "سورة البقرة سنام القرآن وذروته، أخذها بركة وتركها حسرة."},
    {q: ["آية الكرسي", "الكرسي"], a: "قال الله تعالى: (اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...) وهي أعظم آية في كتاب الله."},
    {q: ["سورة الكهف", "الكهف"], a: "قراءة سورة الكهف يوم الجمعة تنور ما بين الجمعتين."},
    
    // الصلاة والعبادات
    {q: ["صلاة", "اوقات", "الصلوات", "فرض", "الصلاة"], a: "الصلاة عماد الدين، من أقامها فقد أقام الدين ومن هدمها فقد هدم الدين."},
    {q: ["صيام", "رمضان", "صوم"], a: "الصيام جُنة، وهو عبادة عظيمة تربي النفس على الصبر وتقوى الله عز وجل."},
    {q: ["زكاة", "صدقة", "فقراء"], a: "الصدقة تطفئ غضب الرب وتدفع ميتة السوء وتطهر الأموال."},
    {q: ["حج", "عمرة", "طواف"], a: "الحج المبرور ليس له جزاء إلا الجنة."},
    
    // الأذكار والاستغفار
    {q: ["استغفار", "استغفر", "ذنب", "معصية"], a: "أستغفر الله العظيم واتوب إليه. أكثر من الاستغفار ليجعل الله لك من كل هم فرجاً."},
    {q: ["دعاء", "ادعية", "ذكر", "تسبيح"], a: "أفضل الدعاء هو ما وافق خشوع القلب وحضوره. أكثر من قول: (رَبنا آتنا في الدنيا حسنة وفي الآخرة حسنة)."},
    {q: ["صبر", "ابتلاء", "هم", "حزن"], a: "اعلم أن مع العسر يسراً، وأن الصبر مفتاح الفرج."},
    {q: ["توبة", "رجوع"], a: "باب التوبة مفتوح دائماً لا يغلق حتى غروب الشمس من مغربها."},
    
    // البرمجة والتقنية
    {q: ["برمجة", "كود", "تطوير", "موقع"], a: "البرمجة عالم ممتع يتطلب الصبر واستخدام حلول هيكلية ذكية ومحلية."},
    {q: ["ذكاء اصطناعي", "تقنية", "تكنولوجيا"], a: "التقنية تهدف لتسهيل حياة الإنسان وحل مشاكله المعقدة."},
    {q: ["جيميناي", "gemini", "api"], a: "النماذج الذكية توفر حلولاً مذهلة عند دمجها بشكل صحيح في الواجهات."},
    
    // ردود إضافية عامة ومتنوعة
    {q: ["شكرا", "جزاك الله", "بارك الله", "مشكور"], a: "وجزاك خيراً وبارك فيك! يسعدني جداً تقديم المساعدة لك."},
    {q: ["مع السلامة", "وداعا", "إلى اللقاء"], a: "في أمان الله ورعايته! ننتظر زيارتك القادمة بشغف."}
];

function sendUserMessage(){
    const input = document.getElementById('chat-input');
    const box = document.getElementById('chat-messages');
    const text = input.value.trim();
    if(!text) return;

    box.innerHTML += '<div style="background:#1f2937;padding:8px 12px;border-radius:8px;max-width:80%;margin-right:auto;text-align:right;">أنت: ' + text + '</div>';
    input.value = '';
    
    setTimeout(() => {
        let reply = "عذراً، لم أجد مطابقة دقيقة، لكن النظام يعمل بكفاءة تامة ضمن قاعدة البيانات المحلية.";
        for(let item of siteDatabase){
            for(let word of item.q){
                if(text.includes(word)){
                    reply = item.a;
                    break;
                }
            }
        }
        box.innerHTML += '<div style="background:#374151;padding:8px 12px;border-radius:8px;max-width:80%;margin-left:auto;text-align:right;color:#feda75;">المساعد: ' + reply + '</div>';
        box.scrollTop = box.scrollHeight;
    }, 200);
}
</script>



<div class="header">
    <div class="header-title">Alislamiah-AI</div>
</div>

<div class="chat" id="chat">
    <div class="welcome" id="welcome">
        <h1>Alislamiah-AI</h1>
        <p>كيف يمكنني مساعدتك؟</p>
    </div>
</div>

<div class="input-area">
    <div class="input-box">
        <textarea id="message" placeholder="اكتب رسالتك..." rows="1"></textarea>
        <button class="send" id="sendButton" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
const p1 = "AQ.Ab8RN6Jwl4";
const p2 = "5ktI8q1FhJosf";
const p3 = "TqKkgYki0jmgs";
const p4 = "DsTbmJ5bDZFKJw";
const API_KEY = p1 + p2 + p3 + p4;

const MODEL = "gemini-2.5-flash";
const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

async function sendMessage(){
    const input = document.getElementById("message");
    const button = document.getElementById("sendButton");
    const text = input.value.trim();
    if(!text) return;

    const welcome = document.getElementById("welcome");
    if(welcome){ welcome.remove(); }

    addMessage(text, "user");
    input.value = "";
    button.disabled = true;

    try{
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                contents: [{ parts: [{ text: text }] }]
            })
        });

        if(!response.ok){
            throw new Error("API Error " + response.status);
        }

        const data = await response.json();
        const answer = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if(!answer){
            throw new Error("Gemini لم يرجع إجابة");
        }

        addMessage(answer, "ai");

    }catch(error){
        console.error(error);
        addMessage("تعذر الاتصال بـ Alislamiah-AI حاليًا.", "ai");
    }

    button.disabled = false;
}

function addMessage(text, type){
    const chat = document.getElementById("chat");
    const bubble = document.createElement("div");
    bubble.className = "message " + type;
    bubble.textContent = text;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
}

document.getElementById("message").addEventListener("keydown", function(event){
    if(event.key === "Enter" && !event.shiftKey){
        event.preventDefault();
        sendMessage();
    }
});
</script>

</body>
</html>
