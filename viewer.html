<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعراض الموقع - Alislamiah AI Browser</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1020;
color:white;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* الشريط العلوي الثابت للتحكم بالمتصفح الداخلي */
.header{
height:60px;
background:rgba(11, 16, 32, 0.9);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,0.1);
padding:0 20px;
display:flex;
align-items:center;
gap:15px;
z-index:1000;
}

.nav-btn{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
color:white;
width:38px;
height:38px;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
transition:0.3s;
text-decoration:none;
font-size:16px;
}

.nav-btn:hover{
background:rgba(255,255,255,0.2);
transform:translateY(-2px);
}

.url-display{
flex:1;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
padding:8px 15px;
border-radius:10px;
color:#9fb4d6;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
direction: ltr;
text-align: left;
}

/* إطار عرض الموقع الداخلي (WebView البديل للويب) */
.viewer-container{
flex:1;
width:100%;
background:white;
position:relative;
}

iframe{
width:100%;
height:100%;
border:none;
}

.loading{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%, -50%);
color:#333;
font-size:18px;
font-weight:bold;
z-index:1;
}
</style>
</head>

<body>

<div class="header">
    <button class="nav-btn" onclick="history.back()" title="رجوع">⬅️</button>
    <a href="index.html" class="nav-btn" title="الرئيسية">🏠</a>
    <div class="url-display" id="url-text">جاري التحميل...</div>
</div>

<div class="viewer-container">
    <div class="loading" id="loading-text">جاري تحميل الموقع...</div>
    <iframe id="site-frame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
</div>

<script>
    // استخراج رابط الموقع المستهدف من الـ URL
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('url');

    const urlText = document.getElementById('url-text');
    const siteFrame = document.getElementById('site-frame');
    const loadingText = document.getElementById('loading-text');

    if(targetUrl) {
        urlText.textContent = targetUrl;
        siteFrame.src = targetUrl;

        siteFrame.onload = () => {
            loadingText.style.display = 'none';
        };
    } else {
        urlText.textContent = "رابط غير صالح";
        loadingText.textContent = "عذراً، لم يتم العثور على الرابط المطلوبة.";
    }
</script>

</body>
</html>
